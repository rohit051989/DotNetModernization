  - id: role-library-project
    name: "Library project"
    summary: "A project with no entry point of its own — consumed by other projects, not run directly."
    description: |
      Identified by the absence of every registered entry-point signal.
      OutputType=Library isn't used as a positive gate: on classic
      net4x it is equally true of Web Forms, MVC5, WebAPI2 and WCF-in-IIS
      projects (IIS hosts them), so it can't discriminate a genuine library
      from those. Absence of entry-point evidence is decisive on its own.
      Also disqualified by any test-indicator signal: per Part D, "highest
      score wins" compares raw scores across role patterns, and a test
      project that exercises a data layer (EF Core, a DbContext — completely
      normal in integration tests) would otherwise accumulate enough
      library-shaped supporting evidence to outscore role-test-project's own
      unweighted anchor match. role-test-project's own docstring already
      warns that test code legitimately contains the technology it tests;
      this disqualifier is the library side of that same guarantee.
    legacy_stack: "Any"
    category: library
    typical_indicators: "No Main method, no top-level statements, no host-builder call, no ServiceBase.Run, no Global.asax."
    known_risks: "None — this is a classification input, not a migration target."
    classification_role: PROJECT_ROLE
    classification_family: PROJECT_ROLE
    classification_value: LIBRARY
    priority: 65
    compatible_with: []
    conflicts_with: []
    anchor_signals: []
    eligibility: null
    analysis_requirements:
