category: hosting
deleted: false
description: 'The project is the process a WCF service runs in: it constructs a ServiceHost (or CoreWCF host) or holds the service''s .svc file. Not a batch job and not the service''s implementation — that is wcf-service, usually on another project. The host follows the service''s decision where it settles the question: CoreWCF, REST and gRPC all run in ASP.NET Core, so each derives "ASP.NET Core web host"; a service that remains Windows-hosted leaves the host to be decided on its own.'
detection:
  match:
    all: []
    any:
    - id: hosts-wcf-service
      signal:
        name: HOSTS_WCF_SERVICE
    atLeast: []
    metadata: []
    none: []
excluded_roles:
- TEST
id: wcf-service-host
name: WCF service host
owner_team: null
resolutions:
- consumer_impact: low
  container_ready: true
  deleted: false
  derivations: []
  description: Replace the ServiceHost or IIS hosting with an ASP.NET Core application on .NET 10 (Kestrel) that hosts the service's new endpoints — CoreWCF, REST or gRPC.
  effort: medium
  id: wcf-host-aspnetcore-web-host
  is_default: true
  linux_compatible: true
  name: ASP.NET Core web host
  notes: null
  status: active
  target_description: .NET 10 ASP.NET Core web host, container on OCP4
- consumer_impact: none
  container_ready: false
  deleted: false
  derivations: []
  description: Out of scope for the Linux move; the host stays on Windows.
  effort: low
  id: wcf-host-remain-windows-hosted
  is_default: false
  linux_compatible: false
  name: Remain Windows-hosted
  notes: null
  status: active
  target_description: .NET Framework on Windows Server
- consumer_impact: low
  container_ready: true
  deleted: false
  derivations: []
  description: The re-platformed services each get their own ASP.NET Core project; this host is removed.
  effort: low
  id: wcf-host-retire
  is_default: false
  linux_compatible: true
  name: Retire the host
  notes: null
  status: active
  target_description: No separate host process
scope: application
status: active
