# The 51 lifecycle steps, transcribed verbatim from 17-LIFECYCLE-STEPS.md —
# the source of truth for step_name, lifecycle_step_no, display_name and
# owner_code. Do not re-derive or rename step_name; see that file's
# "Changing this file" section before editing an existing entry.
#
# Every step here seeds as a stub: adapter_type stub, empty consumes/produces,
# implementation_status stub. That invariant lives in seed_data.py, not here,
# so this file stays a pure transcription of the doc.
#
# `viewpoint` (25-STANDARDS-AND-VIEWPOINTS.md Part A2) is NOT a transcription
# — docs/25 says "populate from the Appendix F mapping", but no Appendix F
# exists anywhere in this repository. Each value here is a first-pass
# Rozanski & Woods classification derived directly from this step's own
# description in 17-LIFECYCLE-STEPS.md, reasoned through by hand rather than
# copied from a source. Two viewpoints are deliberately never assigned:
# CONTEXT (external-actor relationships — the capability gap Part B1 names
# explicitly; no step produces this today) and INFORMATION (no step here
# documents estate data/storage architecture). FUNCTIONAL is assigned only
# to the three steps that snapshot or verify an API's interface surface
# (19, 32, 48) — business-capability mapping, the other half of "functional",
# is Part B4's separate, deliberate gap. Review this mapping before treating
# it as authoritative; it is the platform's best current answer, not a
# transcribed spec.

