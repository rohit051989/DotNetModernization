      # unconditionally would assert a version fact the catalog cannot know.
      - id: netstandard-modern-library-verify-scope
        name: "No migration required — supported version"
        summary: "The class library is on a currently supported framework version. Confirm the classification and close it out of the modernization backlog."
        target_stack: "Already modern — no retarget needed"
