category: framework
deleted: false
description: |-
  Web Forms application using the page lifecycle, ViewState, server controls
  and code-behind. There is no lift-and-shift path: Web Forms does not exist on
  modern .NET, so any migration is a rewrite by definition.
detection:
  match:
    all: []
    any:
    - id: aspx-file
      signal:
        minimumOccurrences: 1
        name: ASPX_FILE
    - id: page-base
      signal:
        name: PAGE_BASE_CLASS
    - id: exposes-webforms-ui
      signal:
        name: EXPOSES_WEBFORMS_UI
    atLeast: []
    metadata:
    - equals: net-framework
      field: frameworkFamily
      id: legacy-framework
    none: []
excluded_roles: []
id: aspnet-webforms
name: ASP.NET Web Forms
owner_team: null
resolutions:
- consumer_impact: high
  container_ready: true
  deleted: false
  derivations: []
  description: Rewrite as a conventional server-rendered ASP.NET Core MVC application.
  effort: high
  id: aspnetcore-mvc-rewrite
  impact_rules:
  - action: rewrite
    filter:
      extension: .cs
    from: seed
    id: code-behind
    reason: Page code-behind is rewritten as MVC controllers and Razor views — logic carried, the page lifecycle and ViewState are not
    select: self
  - action: delete
    filter:
      extension:
      - .aspx
      - .ascx
      - .master
    from: seed
    id: markup-evidence
    reason: Web Forms markup is replaced by MVC controllers and Razor views
    select: self
  - action: delete
    from: code-behind
    id: markup
    kind: webforms_markup
    reason: Web Forms markup (.aspx, .ascx, .master) does not run on ASP.NET Core; it is replaced by the new views
    traverse: convention_files
  - action: rewrite
    from: seed
    id: project
    reason: The Web Application project becomes an SDK-style Microsoft.NET.Sdk.Web project
    traverse: project_file
  - action: update
    from: seed
    id: config
    path: system.web
    reason: system.web settings move to ASP.NET Core configuration and middleware
    traverse: config_elements
  - action: update
    from: code-behind
    id: tests
    reason: Tests of page code target the rewritten classes
    traverse: referencing_tests
  is_default: true
  linux_compatible: true
  name: ASP.NET Core MVC rewrite
  notes: |-
    Prerequisites: Same as Blazor Server. Preferred where the team's skills favour MVC over Blazor.

    Known limitations: Requires explicit reimplementation of state that ViewState previously handled implicitly.
  status: active
  target_description: .NET 10 + ASP.NET Core MVC + Razor views, container on OCP4
- consumer_impact: high
  container_ready: true
  deleted: false
  derivations: []
  description: Rewrite as a Blazor Server application, the closest conceptual match to the Web Forms component and server-render model.
  effort: high
  id: blazor-server-net10
  impact_rules:
  - action: rewrite
    filter:
      extension: .cs
    from: seed
    id: code-behind
    reason: Page code-behind is rewritten as Blazor Server components — logic carried, the page lifecycle and ViewState are not
    select: self
  - action: delete
    filter:
      extension:
      - .aspx
      - .ascx
      - .master
    from: seed
    id: markup-evidence
    reason: Web Forms markup is replaced by Blazor Server components
    select: self
  - action: delete
    from: code-behind
    id: markup
    kind: webforms_markup
    reason: Web Forms markup (.aspx, .ascx, .master) does not run on ASP.NET Core; it is replaced by the new views
    traverse: convention_files
  - action: rewrite
    from: seed
    id: project
    reason: The Web Application project becomes an SDK-style Microsoft.NET.Sdk.Web project
    traverse: project_file
  - action: update
    from: seed
    id: config
    path: system.web
    reason: system.web settings move to ASP.NET Core configuration and middleware
    traverse: config_elements
  - action: update
    from: code-behind
    id: tests
    reason: Tests of page code target the rewritten classes
    traverse: referencing_tests
  is_default: false
  linux_compatible: true
  name: Blazor Server on .NET 10
  notes: |-
    Prerequisites: Screen inventory and behavioural specification captured before starting. Business sign-off on UI change.

    Known limitations: No automated path preserves ViewState or the page lifecycle. Expect genuine redesign of stateful screens. Requires a persistent connection, which changes load-balancer and session-affinity requirements on OCP4.
  status: active
  target_description: .NET 10 + Blazor Server, container on OCP4
scope: application
status: active
