job_name: phase0-repository-discovery
version: 8
description: "Per-repository discovery and analysis. Lifecycle steps 1-8 (17-LIFECYCLE-STEPS.md v2.0)."

parameters:
  - name: engagement_id
    type: string
    required: true
    description: "The engagement this run belongs to."
  - name: repository_id
    type: string
    required: true
    description: "UUID of the registered repository to analyse."
  - name: ingest_token
    type: string
    required: true
    description: "UUID generated per registration or rescan. Makes each rescan a distinct job instance rather than a restart of the previous one."

stub_policy: continue

flow:
  - step: repository-ingest
  - step: solution-discovery
    inputs:
      repository-inventory: "${artifacts.repository-inventory}"
    restart:
      allow_start_if_complete: false
      start_limit: 3
  - step: application-fingerprinting
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
  # v7: step 4 is implemented and consumes both upstream artifacts, so both
  # are wired here.
  - step: entry-point-inventory
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
  # v8: step 5 is implemented. It consumes the same two artifacts, both
  # required: step 2's project list and step 3's skip verdicts and
  # UNC_PATH_LITERAL signals.
  - step: outbound-invocation-inventory
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
  # Step 6 replaces pattern-classification: it matches catalog items against
  # the fingerprint's signals and emits occurrences, not a classification.
  - step: item-detection
    inputs:
      application-fingerprint: "${artifacts.application-fingerprint}"
  - step: test-coverage-assessment
  - step: risk-scoring-tier-assignment
