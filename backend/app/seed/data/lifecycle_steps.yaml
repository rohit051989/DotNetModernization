# The 39 lifecycle steps, transcribed verbatim from 17-LIFECYCLE-STEPS.md
# v2.5 (v2.0 plus dependency-assessment inserted at 6 in v2.1,
# impact-analysis inserted at 9 in v2.3, conversion-preparation at 11 in v2.4 and dependency-hierarchy at 7 in v2.5; later
# steps moved up, slugs unchanged) — the source of truth for step_name, lifecycle_step_no, display_name,
# owner_code and viewpoint. Do not re-derive or rename step_name; see that
# file's "Renumbering and slug stability" and "Registration rules" before
# editing an existing entry.
#
# Every step here seeds as a stub: adapter_type stub, empty consumes/produces,
# implementation_status stub. That invariant lives in seed_data.py, not here,
# so this file stays a pure transcription of the doc. An already-implemented
# step keeps its adapter and contract on reseed; only the fields below are
# refreshed.
#
# `viewpoint` is transcribed from the v2.0 register. The spec writes "—" for
# the three pure gate steps (plan-approval-gate, code-review, release-approval); that is stored as NONE ("gate steps
# carry no viewpoint — they are governance, not analysis").
#
# Steps that left the lifecycle in v2.0 are NOT listed here. Their
# registrations are retired by migration e5c1d7a93f20 (renamed slugs are
# soft-deleted, removed steps deprecated) and the seeder never revives them.

