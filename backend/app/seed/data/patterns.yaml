  - id: role-library-project
    name: "Library project"
    summary: "A project with no entry point of its own — consumed by other projects, not run directly."
    description: |
      Identified by the absence of every registered entry-point signal.
      OutputType=Library isn't used as a positive gate: on classic
      net4x it is equally true of Web Forms, MVC5, WebAPI2 and WCF-in-IIS
      projects (IIS hosts them), so it can't discriminate a genuine library
      from those. Absence of entry-point evidence is decisive on its own.
      Also disqualified by any test-indicator signal: per Part D, "highest
      score wins" compares raw scores across role patterns, and a test
      project that exercises a data layer (EF Core, a DbContext — completely
      normal in integration tests) would otherwise accumulate enough
      library-shaped supporting evidence to outscore role-test-project's own
      unweighted anchor match. role-test-project's own docstring already
      warns that test code legitimately contains the technology it tests;
      this disqualifier is the library side of that same guarantee.
    legacy_stack: "Any"
    category: library
    typical_indicators: "No Main method, no top-level statements, no host-builder call, no ServiceBase.Run, no Global.asax."
    known_risks: "None — this is a classification input, not a migration target."
    classification_role: PROJECT_ROLE
    classification_family: PROJECT_ROLE
    classification_value: LIBRARY
    priority: 65
    compatible_with: []
    conflicts_with: []
    anchor_signals: []
    eligibility: null
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred: {}
    thresholds:
      minimumScore: 50
      highConfidenceScore: 70
    rules_status: active
    required_signals_pending: []
    rules:
      # Absence of entry-point evidence is what determines the role (see the
      # description above) — supporting weights below don't change that, they
      # only grade *how substantively* library-shaped the surviving evidence
      # is, so a library with a real data-access layer (a DbContext, EF Core
      # usage) scores above a library that's just a bag of DTOs.
      schema: signal-rules/1.0
      all: []
      any: []
      atLeast: []
      supporting:
        - id: db-context-class
          signal:
            name: DB_CONTEXT_BASE_CLASS
          weight: 20
        - id: ef-core-namespace
          signal:
            name: MICROSOFT_ENTITYFRAMEWORKCORE_NAMESPACE
          weight: 15
        - id: services-folder
          signal:
            name: SERVICES_FOLDER
          weight: 15
      none:
        - id: no-main-entry
          signal:
            name: MAIN_METHOD_ENTRY_POINT
          disqualify: true
        - id: no-toplevel-entry
          signal:
            name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
          disqualify: true
        - id: no-web-builder
          signal:
            name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-host-builder
          signal:
            name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-webhost-builder
          signal:
            name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-global-asax
          signal:
            name: GLOBAL_ASAX_ENTRY_POINT
          disqualify: true
        - id: no-startup-class
          signal:
            name: STARTUP_CLASS_ENTRY_POINT
          disqualify: true
        - id: no-servicebase-run
          signal:
            name: SERVICEBASE_RUN_ENTRY_POINT
          disqualify: true
        - id: no-hosted-service
          signal:
            name: ADD_HOSTED_SERVICE_ENTRY_POINT
          disqualify: true
        - id: no-test-method-attr
          signal:
            name: TEST_METHOD_ATTRIBUTE
          disqualify: true
        - id: no-fact-attr
          signal:
            name: FACT_ATTRIBUTE
          disqualify: true
        - id: no-test-attr
          signal:
            name: TEST_ATTRIBUTE
          disqualify: true
        - id: no-test-fixture-attr
          signal:
            name: TEST_FIXTURE_ATTRIBUTE
          disqualify: true
      metadata: []

