  - id: ssis-package
    name: "SSIS package"
    summary: "SQL Server Integration Services package performing ETL, defined in a .dtsx file."
    description: |
      Integration Services package with control flow and data flow tasks,
      connection managers, and frequently embedded script tasks containing C# or
      VB.NET. Executed by SQL Server Agent or the SSIS catalog.
    legacy_stack: "SQL Server Integration Services"
    category: data-etl
    typical_indicators: ".dtsx files, .dtproj project files, connection managers, Execute SQL and Data Flow tasks, Script Task components."
    known_risks: "No market tooling covers this conversion. Package XML is highly structured and parseable, which favours a deterministic-first accelerator, but transaction and checkpoint semantics, package variables and expression evaluation carry real behavioural risk. Row-level output equivalence testing is the only credible verification."
    classification_role: PRIMARY
    classification_family: APPLICATION_TYPE
    classification_value: SSIS_PACKAGE
    priority: 50
    compatible_with: []
    conflicts_with: []
    # Was ["SSIS_PACKAGE_FILE"] — not a registered signal (step 3 emits no
    # SSIS signals at all), and an active pattern may not reference one
    # (Part B3). Detection is metadata-only for now; SSIS_PACKAGE_FILE
    # returns here as the anchor once SsisExtractor registers it.
    anchor_signals: []
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred: {}
    thresholds:
      # Lowered from 70: the only condition is a metadata match (base score
      # 50, Part E) — no supporting signal evidence exists yet to lift it
      # higher. Confident detection (structuralType is unambiguous), thin
      # evidence — matchWarnings below says so on every match. Raise this
      # again once SsisExtractor's signals give real supporting evidence.
      minimumScore: 50
      highConfidenceScore: 90
    rules_status: active
    # Unchanged despite promotion — this tracks the richer package-internals
    # signals SsisExtractor will add later (control flow, data flow, script
    # tasks), independent of the metadata-only detection now active below.
    # The extractor backlog (GET /api/catalog/pending-signals) is unaffected
    # by this promotion.
    required_signals_pending:
      - signal_name: SSIS_PACKAGE_FILE
        purpose: "Anchor signal — identifies a .dtsx package"
        expected_extractor: SsisExtractor
        blocking: true
      - signal_name: SSIS_CONNECTION_MANAGER
        purpose: "Supporting evidence for connection topology"
        expected_extractor: SsisExtractor
        blocking: false
    rules:
      # Promoted to active on metadata alone: step 2 already derives
      # structuralType: ssis_project from the .dtproj extension
      # (project_parser.py's EXTENSION_MAP), independent of step 3 signals
      # entirely — no need to wait for SsisExtractor to detect the package
      # exists. The any/supporting signal conditions this pattern used to
      # carry (SSIS_PACKAGE_FILE, SSIS_CONNECTION_MANAGER) are removed for
      # now, not merely emptied — Part B3 forbids an active pattern from
      # referencing any unregistered signal anywhere in detection_rules,
      # including anchor_signals above. They come back once SsisExtractor
      # registers those names.
      schema: signal-rules/1.0
      all: []
      any: []
      atLeast: []
      supporting: []
      none: []
      metadata:
        # No frameworkFamily condition, and one would break this pattern: an
        # SSIS project has no TargetFramework at all, so step 2 records
        # framework_family as null and any family condition would match
        # nothing. structuralType is the guard, and it is exact. Part C.
        - id: is-ssis-project
          field: structuralType
          equals: ssis_project
      matchWarnings:
        - "Detected structurally; package internals not yet analysed."
    target_states:
      - id: csharp-worker-container
        name: "C# worker with in-process pipeline"
        summary: "Convert the package to a C# worker that reimplements the data flow in code, containerized for OCP4."
        target_stack: ".NET 10 worker + OCP4 CronJob"
        consumer_impact: medium
        effort: high
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: false
        prerequisites: "Source and target schemas documented. Representative input data available for equivalence testing."
        known_limitations: "Complex data flows with many transformations translate poorly to straight-line code. Package-level variables and expression evaluation need explicit reimplementation. Script tasks require porting on their own terms."
        engine_support:
          engine: none
          coverage: none
          scenarios: []
          skills: []
          gaps: ["No market tooling covers SSIS conversion at all"]
          custom_skills_required: ["ssis-inventory-parser", "ssis-dataflow-converter", "ssis-script-task-porter", "ocp4-container-packaging"]
        playbook_md: |
          ## Approach
          Deterministic first: parse the .dtsx XML to inventory components,
          connection managers and script tasks. Template-convert connection managers
          and standard data flow components. Use an LLM sub-agent only for script
          tasks and error-handling semantics.
          ## Verification
          Execute the source package and the generated worker against identical
          input, then diff output tables row by row. This is the strongest
          verification available anywhere in the programme — use it as the reference
          standard for what a verification oracle should look like.

      - id: csharp-sql-pushdown
        name: "C# orchestrator with SQL pushdown"
        summary: "Push set-based transformation logic into SQL and keep a thin C# orchestrator for control flow."
        target_stack: ".NET 10 worker + T-SQL + OCP4 CronJob"
        consumer_impact: medium
        effort: medium
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: false
        prerequisites: "Source and target reside on the same database platform, and the transformation is expressible as set operations."
        known_limitations: "Only applies where transformations are set-based. Row-by-row logic, external service calls and file-based sources still need application code. Moves load onto the database server."
        engine_support:
          engine: none
          coverage: none
          scenarios: []
          skills: []
          gaps: ["No market tooling covers SSIS conversion at all"]
          custom_skills_required: ["ssis-inventory-parser", "ssis-to-sql-translator", "ocp4-container-packaging"]
        playbook_md: |
          Frequently the lower-effort option for straightforward load packages.
          Assess per package during inventory rather than choosing once for the whole
          estate — the two SSIS options are likely to be mixed across several hundred
          packages, and the segmentation rule should be recorded in the decision.

  # ---------------------------------------------------------------- 9
  # "Already modern" patterns — classification_family ALREADY_MODERN. Not a
  # migration target: the single target state option on each just records
  # "verify and confirm scope", so a genuinely modern project gets a MATCHED
  # result of its own instead of falling through to NO_PATTERN_MATCHED and
  # entering step 5's clustering queue as if it were unclassified legacy
  # code. Anchored on the *modern* hosting/component entry points, which are
  # structurally disjoint from every legacy pattern's anchors above (a
  # Program.cs calls either WebHost.CreateDefaultBuilder/Startup.cs or
  # WebApplication.CreateBuilder, never both) — so these never compete with
  # the legacy patterns for the same project. aspnetcore-minimal-api and
  # aspnetcore-mvc-modern are kept mutually exclusive by construction
  # (minimal-api disqualifies itself on CSHTML_FILE) rather than via
  # conflicts_with, so a hybrid API+MVC host like eShopOnWeb's Web project
  # resolves to the more specific mvc-modern match instead of MULTIPLE_MATCHES.
  - id: aspnetcore-minimal-api
    name: "Modern ASP.NET Core minimal-hosting API"
    summary: "ASP.NET Core Web API on the modern WebApplication.CreateBuilder hosting model, net6.0 or later."
    description: |
      REST API built on the minimal hosting model introduced in .NET 6 —
      `WebApplication.CreateBuilder(...)` in `Program.cs`, with either
      attribute-routed controllers or `MapGet`/`MapPost`-style endpoints.
      Already on a fully supported, actively maintained .NET target. Not a
      migration candidate — verify the classification and move on.
    legacy_stack: "Already modern"
    category: web-api
    typical_indicators: "Program.cs with WebApplication.CreateBuilder, no Startup.cs, controllers deriving from ControllerBase or mapped minimal-API endpoints, net6.0 or later."
    known_risks: "None — already on a supported modern target. The only risk is misclassification: confirm no residual legacy dependency was missed before closing this out of the backlog."
    classification_role: PRIMARY
    classification_family: ALREADY_MODERN
    classification_value: MODERN_ASPNETCORE_API
    priority: 50
    compatible_with: []
    conflicts_with: []
    anchor_signals: ["WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT"]
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred: {}
    thresholds:
      minimumScore: 60
      highConfidenceScore: 85
    rules_status: active
    required_signals_pending: []
    rules:
      schema: signal-rules/1.0
      all:
        - id: webapp-builder
          signal:
            name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
      any: []
      atLeast: []
      supporting:
        - id: api-controller-attr
          signal:
            name: API_CONTROLLER_ATTRIBUTE
          weight: 15
        - id: controllerbase-class
          signal:
            name: CONTROLLER_BASE_BASE_CLASS
          weight: 15
        - id: route-attr
          signal:
            name: ROUTE_ATTRIBUTE
          weight: 10
        - id: http-get
          signal:
            name: HTTP_GET_ATTRIBUTE
          weight: 10
        - id: http-post
          signal:
            name: HTTP_POST_ATTRIBUTE
          weight: 10
        - id: mvc-namespace
          signal:
            name: MICROSOFT_ASPNETCORE_MVC_NAMESPACE
          weight: 10
        - id: aspnetcore-package
          signal:
            name: MICROSOFT_ASPNETCORE_PACKAGE
          weight: 5
      none:
        - id: no-razor-views
          signal:
            name: CSHTML_FILE
          disqualify: true
      # No frameworkFamily condition needed: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
      # in `all` is a strictly tighter guard. WebApplication.CreateBuilder ships
      # with ASP.NET Core 6+, which has no .NET Framework support at all, so the
      # signal cannot appear off the modern lineage — and it also excludes net5.0,
      # which a `frameworkFamily in [net]` condition would wrongly admit. Part C.
      metadata: []
    target_states:
      # Two options, and which one applies is a step 14 decision driven by
      # the classification's framework_version, not by re-detecting the
      # pattern: support lifecycle parameterises target-state selection, it
      # does not change the code shape (Part C). Neither is is_recommended —
      # the condition is in the option names, and recommending either
      # unconditionally would assert a version fact the catalog cannot know.
      - id: aspnetcore-minimal-api-verify-scope
        name: "No migration required — supported version"
        summary: "The ASP.NET Core minimal API is on a currently supported framework version. Confirm the classification and close it out of the modernization backlog."
        target_stack: "Already modern — no retarget needed"
        consumer_impact: none
        effort: low
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: true
        is_recommended: false
        prerequisites: "framework_version on the classification is a currently supported release. If it is not, take aspnetcore-minimal-api-retarget-lts instead."
        known_limitations: "Confirms only what step 3/4 could observe from source and package evidence. Spot-check for a stray legacy dependency before formally closing the item."
        playbook_md: |
          ## Steps
          1. Read `framework_version` from the classification. If it names an
             out-of-support release, stop — this is the wrong option; take
             `aspnetcore-minimal-api-retarget-lts`.
          2. Spot-check for any residual legacy dependency the automated
             signals wouldn't catch.
          3. Record the verification and close this project out of the
             modernization backlog — no transformation work is queued.
      - id: aspnetcore-minimal-api-retarget-lts
        name: "Retarget to current LTS — version out of support"
        summary: "Same code shape, unsupported framework version. Retarget the ASP.NET Core minimal API to the current LTS and fix whatever breaking changes that specific version hop introduces."
        target_stack: "ASP.NET Core minimal API on the current LTS"
        consumer_impact: none
        effort: low
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: true
        is_recommended: false
        prerequisites: "framework_version on the classification names an out-of-support release (e.g. netcoreapp3.1, net5.0, or a .NET version past its support date at the time of the engagement). Repository builds cleanly before the hop."
        known_limitations: "Which breaking changes apply is a function of the source version, which is why this is one option parameterised by framework_version rather than one pattern per release. The hop itself is mechanical; verification is the real work."
        playbook_md: |
          ## Steps
          1. Read `framework_version` from the classification — it determines
             which breaking-change set applies. This option does not assume a
             particular source version.
          2. Raise `TargetFramework` to the current LTS.
          3. Update package references to versions matching the new target.
          4. Work the build-fix loop, then run the characterization and
             contract-parity checks for the versions actually crossed.
