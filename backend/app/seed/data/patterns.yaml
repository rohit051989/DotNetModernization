patterns:

  # ---------------------------------------------------------------- 1
  - id: aspnetcore-rest-api-legacy
    name: "Legacy-hosted ASP.NET Core REST API"
    summary: "ASP.NET Core Web API on the Startup.cs + WebHost/Host builder hosting model, any version."
    description: |
      REST API built on ASP.NET Core using the classic `Startup.cs`
      `ConfigureServices` / `Configure` pair with `WebHost.CreateDefaultBuilder`
      or `Host.CreateDefaultBuilder`. Typically hosted in IIS behind the
      ASP.NET Core Module.

      **The discriminator is the hosting model, not the version.** Core 2.1 and
      Core 3.1 REST APIs are structurally identical — same Startup.cs, same
      controllers, same Microsoft.AspNetCore.Mvc — and one accelerator handles
      both by reading `framework_version`. Projects on the modern
      `WebApplication.CreateBuilder` model belong to `aspnetcore-minimal-api`
      or `aspnetcore-mvc-modern` instead, and are disqualified here explicitly.
    legacy_stack: "ASP.NET Core (Startup.cs hosting model)"
    category: web-api
    typical_indicators: "Startup.cs with ConfigureServices/Configure, Program.cs with WebHost.CreateDefaultBuilder or Host.CreateDefaultBuilder, controllers deriving from ControllerBase."
    known_risks: "Default JSON serializer changes from Newtonsoft to System.Text.Json on modern .NET, which can silently alter payload casing, null handling and date formats. Contract snapshot before migration is essential. Which breaking changes apply depends on the recorded framework_version, not on this pattern."
    classification_role: PRIMARY
    classification_family: APPLICATION_TYPE
    classification_value: REST_API
    priority: 50
    compatible_with: []
    conflicts_with: []
    anchor_signals: ["STARTUP_CLASS_ENTRY_POINT", "WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT", "HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT"]
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred: {}
    thresholds:
      minimumScore: 70
      highConfidenceScore: 90
    rules_status: active
    required_signals_pending: []
    rules:
      # The hosting model is the discriminator (see this pattern's
      # description): Startup.cs AND one of the two pre-6.0 host builders,
      # and explicitly NOT WebApplication.CreateBuilder, which is what
      # aspnetcore-minimal-api / aspnetcore-mvc-modern / blazor-server-modern
      # all require in their own `all` group. Previously this was
      # `any: [webhost-builder, startup-class]` with no metadata condition at
      # all, which is what let it match a .NET Framework project
      # (eShopPorted.csproj, net461) and collide with fx-aspnet-mvc.
      schema: signal-rules/1.0
      all:
        - id: startup-class
          signal:
            name: STARTUP_CLASS_ENTRY_POINT
      any:
        - id: webhost-builder
          signal:
            name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
        - id: host-builder
          signal:
            name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
      atLeast: []
      supporting:
        - id: mvc-namespace
          signal:
            name: MICROSOFT_ASPNETCORE_MVC_NAMESPACE
          weight: 15
        - id: api-controller-attr
          signal:
            name: API_CONTROLLER_ATTRIBUTE
          weight: 15
        - id: controllerbase-class
          signal:
            name: CONTROLLER_BASE_BASE_CLASS
          weight: 15
        - id: route-attr
          signal:
            name: ROUTE_ATTRIBUTE
          weight: 10
        - id: http-get
          signal:
            name: HTTP_GET_ATTRIBUTE
          weight: 5
        - id: http-post
          signal:
            name: HTTP_POST_ATTRIBUTE
          weight: 5
        - id: controllers-folder
          signal:
            name: CONTROLLERS_FOLDER
          weight: 5
        - id: aspnetcore-package
          signal:
            name: MICROSOFT_ASPNETCORE_PACKAGE
          weight: 5
      none:
        - id: not-webapp-builder
          signal:
            name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          disqualify: true
      # No metadata conditions, deliberately. frameworkFamily is the WRONG
      # discriminator for an ASP.NET Core pattern: ASP.NET Core runs on
      # either family — ASP.NET Core 2.x on .NET Framework 4.6.1 was a
      # supported configuration, and eShopPorted.csproj is one. Its
      # migration path follows the code shape (retarget, fix Core breaking
      # changes), not the TFM; it does not migrate like a System.Web.Mvc app.
      #
      # A `frameworkFamily in [net-core]` condition here was the
      # version-condition error one level up: it bound the pattern to a
      # target-framework attribute when the hosting model above is the real
      # discriminator. Framework family stays an attribute on the
      # classification (framework_family/framework_version, Part F).
      # fx-aspnet-mvc excludes this hosting model explicitly, so the two
      # patterns separate on shape from both directions. See Part C.
      metadata: []
    target_states:
      - id: net10-api-controllers-preserved
        name: ".NET 10 Web API, controllers preserved"
        summary: "Retarget to .NET 10, move to WebApplicationBuilder, keep controller classes and routes exactly as they are."
        target_stack: ".NET 10 + ASP.NET Core, container on OCP4"
        consumer_impact: none
        effort: low
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: true
        is_recommended: true
        prerequisites: "Repository builds cleanly on the current framework. Contract snapshot captured before any change."
        known_limitations: "Pins Newtonsoft.Json explicitly rather than adopting System.Text.Json, to guarantee payload parity. Serializer modernization is deferred to a later pass."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: strong
          scenarios: ["dotnet-upgrade"]
          skills: ["sdk-style-conversion", "aspnetcore-hosting-model"]
          gaps: ["OCP4 containerization", "health endpoint injection", "stdout logging configuration"]
          custom_skills_required: ["ocp4-container-packaging", "linux-remediation"]
        playbook_md: |
          ## Steps
          1. Convert project to SDK-style if not already.
          2. Retarget to `net10.0`.
          3. Replace `WebHost.CreateDefaultBuilder` with `WebApplication.CreateBuilder`,
             folding `Startup.ConfigureServices` and `Startup.Configure` into `Program.cs`.
          4. Pin `Newtonsoft.Json` via `AddNewtonsoftJson()` to preserve payload shape.
          5. Replace `IHostingEnvironment` with `IWebHostEnvironment`.
          6. Move `appsettings` overrides to environment variables.
          7. Add `/healthz` and `/readyz` endpoints for OCP4 probes.
          ## Parity checks
          - OpenAPI diff against the pre-migration snapshot: zero route, verb, status
            code or schema differences.
          - Characterization tests replayed against recorded request/response pairs.

      - id: net10-api-minimal
        name: ".NET 10 Minimal API"
        summary: "Retarget and additionally rewrite controllers as minimal API endpoints."
        target_stack: ".NET 10 + Minimal APIs, container on OCP4"
        consumer_impact: none
        effort: medium
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: false
        prerequisites: "Good test coverage, since endpoint code is restructured rather than retargeted."
        known_limitations: "External contract is unchanged but internal structure churns significantly, enlarging the review surface for no consumer-visible benefit. Not the default choice under a lift-and-shift posture."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: partial
          scenarios: ["dotnet-upgrade"]
          skills: ["sdk-style-conversion"]
          gaps: ["controller-to-minimal-API restructuring", "OCP4 containerization"]
          custom_skills_required: ["minimal-api-restructure", "ocp4-container-packaging"]
        playbook_md: |
          Same retargeting steps as the controllers-preserved option, then convert
          each controller action to a mapped endpoint. Only select this where the
          client explicitly wants the modern idiom and accepts the larger diff.

  # ---------------------------------------------------------------- 2
  - id: fx47-class-library
    name: ".NET Framework 4.7 class library"
    summary: "Shared class library targeting .NET Framework 4.7, consumed by multiple applications."
    description: |
      Non-SDK-style class library on .NET Framework 4.7x. Frequently a shared
      dependency across several applications in the same repository, which makes it
      a coordination point rather than an isolated migration.
    legacy_stack: ".NET Framework 4.7 / 4.7.1 / 4.7.2"
    category: library
    typical_indicators: "Legacy csproj with <TargetFrameworkVersion>, packages.config, AssemblyInfo.cs, OutputType Library."
    known_risks: "Shared libraries fan out. Migrating one can break every consumer simultaneously, so these must be sequenced first within a wave and verified across all dependents."
    classification_role: PRIMARY
    classification_family: APPLICATION_TYPE
    classification_value: LIBRARY
    priority: 30
    compatible_with: []
    conflicts_with: []
    anchor_signals: []
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred:
        projectMetadataParsed: true
    thresholds:
      minimumScore: 50
      highConfidenceScore: 70
    rules_status: active
    required_signals_pending: []
    rules:
      # No positive anchor exists in the registry for "plain legacy library" —
      # on classic net4x, OutputType=Library also appears on Web Forms, MVC5,
      # WebAPI2 and WCF-in-IIS projects (IIS hosts them, not a self-hosted
      # process), so metadata.outputType can't discriminate. This pattern is
      # therefore purely a metadata + negative-evidence match: net-framework,
      # and none of the other seven patterns' decisive evidence present.
      schema: signal-rules/1.0
      all: []
      any: []
      atLeast: []
      supporting: []
      none:
        - id: no-aspx
          signal:
            name: ASPX_FILE
          disqualify: true
        - id: no-page-base
          signal:
            name: PAGE_BASE_CLASS
          disqualify: true
        - id: no-svc
          signal:
            name: SVC_FILE
          disqualify: true
        - id: no-service-contract
          signal:
            name: SERVICE_CONTRACT_ATTRIBUTE
          disqualify: true
        - id: no-mvc-controller
          signal:
            name: CONTROLLER_BASE_CLASS
          disqualify: true
        - id: no-webapi-controller
          signal:
            name: API_CONTROLLER_BASE_CLASS
          disqualify: true
        - id: no-global-asax
          signal:
            name: GLOBAL_ASAX_FILE
          disqualify: true
        - id: no-service-base
          signal:
            name: SERVICE_BASE_BASE_CLASS
          disqualify: true
        - id: no-main-entry
          signal:
            name: MAIN_METHOD_ENTRY_POINT
          disqualify: true
        - id: no-toplevel-entry
          signal:
            name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
          disqualify: true
        # ASP.NET Core hosting entry points. This pattern is absence-based —
        # it has no positive signal condition of its own, so its `none` list
        # IS its definition, and any hosting model absent from that list is a
        # project type it will happily claim. ASP.NET Core 2.x on .NET
        # Framework satisfies the family condition below, so without these a
        # Startup-only Core project with no Main matched here at 50.
        # Mutual exclusion, per Part C: aspnetcore-rest-api-legacy declares
        # nothing about libraries, so this side has to declare it.
        - id: no-startup-class
          signal:
            name: STARTUP_CLASS_ENTRY_POINT
          disqualify: true
        - id: no-webhost-builder
          signal:
            name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-host-builder
          signal:
            name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        # Completes the set: the three above were added for the ASP.NET Core
        # hosting shapes, and WebApplication.CreateBuilder is the fourth.
        # A .NET Framework class library cannot contain it.
        - id: no-web-builder
          signal:
            name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          disqualify: true
      metadata:
        - id: legacy-framework
          field: frameworkFamily
          equals: net-framework
        # A project that produces an executable is not a class library.
        # The `none` disqualifiers above already exclude one via its entry-point
        # signal, but only when step 3 actually extracted it: on a PARTIAL
        # fingerprint with syntax analysis unavailable, an absence-based pattern
        # like this one goes blind and co-matches the desktop and console
        # patterns. outputType is step 2 msbuild metadata, present whether or
        # not syntax analysis ran, so it holds where the signal does not. This
        # is the library half of the mutual exclusion the desktop patterns
        # declare with `outputType equals WinExe` (docs/24 Part C).
        - id: not-an-executable
          field: outputType
          notIn: ["WinExe", "Exe"]
    target_states:
      - id: netstandard20-bridge
        name: ".NET Standard 2.0 bridge"
        summary: "Retarget to .NET Standard 2.0 so both legacy and modern consumers can reference it during a phased migration."
        target_stack: ".NET Standard 2.0"
        consumer_impact: none
        effort: low
        linux_compatible: true
        container_ready: false
        is_lift_and_shift: true
        is_recommended: true
        prerequisites: "No dependency on Framework-only APIs such as System.Web, AppDomain or Windows-specific configuration."
        known_limitations: "Interim state, not a destination. Some Framework APIs have no .NET Standard equivalent. Plan a later move to net10.0 once all consumers are migrated."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: strong
          scenarios: ["dotnet-upgrade", "sdk-style-conversion"]
          skills: ["sdk-style-conversion", "packages-config-to-packagereference"]
          gaps: []
          custom_skills_required: []
        playbook_md: |
          Use where the library has consumers that cannot migrate in the same wave.
          Convert to SDK-style, migrate packages.config to PackageReference,
          retarget to netstandard2.0, remove AssemblyInfo in favour of csproj
          properties. Both old and new consumers keep working.

      - id: net10-class-library
        name: ".NET 10 class library"
        summary: "Retarget directly to .NET 10. Requires all consumers to migrate in the same wave."
        target_stack: ".NET 10"
        consumer_impact: low
        effort: low
        linux_compatible: true
        container_ready: false
        is_lift_and_shift: true
        prerequisites: "All consuming applications scheduled in the same migration wave."
        known_limitations: "Legacy Framework consumers cannot reference a net10.0 library. Sequencing is mandatory, not optional."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: strong
          scenarios: ["dotnet-upgrade"]
          skills: ["sdk-style-conversion", "packages-config-to-packagereference"]
          gaps: ["cross-repository consumer coordination"]
          custom_skills_required: []
        playbook_md: |
          Preferred destination once the dependency graph shows every consumer is in
          the same wave. Otherwise use the .NET Standard 2.0 bridge first.

  # ---------------------------------------------------------------- 3
  - id: fx-aspnet-mvc
    name: "Classic ASP.NET MVC / Web API on .NET Framework"
    summary: "ASP.NET MVC 5 or Web API 2 application on .NET Framework, hosted in IIS."
    description: |
      System.Web-based MVC or Web API application with Global.asax, App_Start
      configuration classes and web.config. Tightly coupled to IIS and the
      System.Web pipeline.
    legacy_stack: ".NET Framework 4.6 - 4.8, ASP.NET MVC 5 / Web API 2"
    category: web-api
    typical_indicators: "Global.asax, App_Start/RouteConfig.cs, App_Start/WebApiConfig.cs, web.config with system.web section, references to System.Web.Mvc."
    known_risks: "HttpContext usage is often pervasive and does not map cleanly. Session state, request-scoped statics and web.config transforms all need deliberate handling."
    classification_role: PRIMARY
    classification_family: WEB_APPLICATION
    classification_value: MVC_WEB_APPLICATION
    priority: 55
    compatible_with: ["aspnet-webforms"]
    conflicts_with: []
    anchor_signals: ["CONTROLLER_BASE_CLASS", "API_CONTROLLER_BASE_CLASS", "SYSTEM_WEB_MVC_NAMESPACE"]
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred:
        projectMetadataParsed: true
        semanticAnalysis: true
    thresholds:
      minimumScore: 70
      highConfidenceScore: 90
    rules_status: active
    required_signals_pending: []
    rules:
      # Compatible with aspnet-webforms rather than mutually exclusive — the
      # old forbidden_file_globs on .aspx is dropped; a hybrid app genuinely
      # can contain both (see the note above), and step 5 wants that surfaced,
      # not hidden by one pattern crowding the other out.
      schema: signal-rules/1.0
      all: []
      any:
        - id: mvc-controller
          signal:
            name: CONTROLLER_BASE_CLASS
        - id: webapi-controller
          signal:
            name: API_CONTROLLER_BASE_CLASS
        - id: mvc-namespace
          signal:
            name: SYSTEM_WEB_MVC_NAMESPACE
        - id: webapi-namespace
          signal:
            name: SYSTEM_WEB_HTTP_NAMESPACE
      atLeast: []
      supporting:
        - id: global-asax
          signal:
            name: GLOBAL_ASAX_FILE
          weight: 10
        - id: app-start-folder
          signal:
            name: APP_START_FOLDER
          weight: 10
        - id: route-attr
          signal:
            name: ROUTE_ATTRIBUTE
          weight: 10
        - id: route-prefix-attr
          signal:
            name: ROUTE_PREFIX_ATTRIBUTE
          weight: 10
        - id: http-get
          signal:
            name: HTTP_GET_ATTRIBUTE
          weight: 5
        - id: http-post
          signal:
            name: HTTP_POST_ATTRIBUTE
          weight: 5
        - id: controllers-folder
          signal:
            name: CONTROLLERS_FOLDER
          weight: 5
        - id: views-folder
          signal:
            name: VIEWS_FOLDER
          weight: 5
      none:
        # A System.Web.Mvc application never has an ASP.NET Core hosting
        # entry point. These are true exclusions, not weak counter-evidence,
        # and they are what should have separated this pattern from
        # aspnetcore-rest-api-legacy from the start: without them, an
        # ASP.NET Core app targeting net461 (a supported configuration —
        # eShopPorted.csproj is exactly this) satisfies both patterns, and
        # binding it here would attach a System.Web.Mvc accelerator to code
        # that needs a Core retarget instead.
        - id: not-startup-class
          signal:
            name: STARTUP_CLASS_ENTRY_POINT
          disqualify: true
        - id: not-webhost-builder
          signal:
            name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        - id: not-host-builder
          signal:
            name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
      metadata:
        # Kept: System.Web.Mvc is genuinely .NET Framework-bound, so family
        # is a real discriminator here — unlike the ASP.NET Core patterns,
        # which run on either family. See Part C.
        - id: legacy-framework
          field: frameworkFamily
          equals: net-framework
    target_states:
      - id: aspnetcore-incremental-adapters
        name: "Incremental migration with System.Web adapters"
        summary: "Run ASP.NET Core alongside the existing app using System.Web adapters and a YARP strangler proxy, migrating routes progressively."
        target_stack: ".NET 10 + ASP.NET Core + System.Web adapters + YARP"
        consumer_impact: none
        effort: medium
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: true
        is_recommended: true
        prerequisites: "Ability to run two processes during transition. Route inventory captured up front."
        known_limitations: "Temporarily increases operational complexity by running two applications. Requires a defined end date or the interim state becomes permanent."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: strong
          scenarios: ["aspnet-to-aspnetcore"]
          skills: ["system-web-adapters", "routing-migration", "httpcontext-migration", "global-asax-to-startup", "webconfig-to-appsettings"]
          gaps: ["YARP proxy configuration", "OCP4 containerization"]
          custom_skills_required: ["ocp4-container-packaging", "linux-remediation"]
        playbook_md: |
          ## Steps
          1. Stand up a new ASP.NET Core host alongside the existing application.
          2. Introduce YARP to route unmigrated paths back to the legacy app.
          3. Add System.Web adapters so shared session and HttpContext work across both.
          4. Migrate controllers route group by route group, verifying each.
          5. Retire the legacy host once the route inventory is exhausted.
          ## Parity checks
          - Route inventory diff at each increment: no route may disappear silently.

      - id: aspnetcore-mvc-net10
        name: "Direct migration to ASP.NET Core MVC on .NET 10"
        summary: "Single-pass migration of the whole application to ASP.NET Core MVC."
        target_stack: ".NET 10 + ASP.NET Core MVC, container on OCP4"
        consumer_impact: low
        effort: high
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: false
        prerequisites: "Strong test coverage. Limited HttpContext and session sprawl."
        known_limitations: "Big-bang cutover with a large review surface. Only appropriate for small or well-tested applications."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: strong
          scenarios: ["aspnet-to-aspnetcore"]
          skills: ["routing-migration", "filters-migration", "httpcontext-migration", "global-asax-to-startup", "webconfig-to-appsettings", "bundling-migration"]
          gaps: ["OCP4 containerization", "Windows authentication replacement on Linux"]
          custom_skills_required: ["ocp4-container-packaging", "linux-remediation"]
        playbook_md: |
          Use for smaller applications where the incremental approach adds more
          operational overhead than it removes risk.

  # ---------------------------------------------------------------- 4
  - id: aspnet-webforms
    name: "ASP.NET Web Forms"
    summary: "Server-rendered Web Forms application with .aspx pages and code-behind."
    description: |
      Web Forms application using the page lifecycle, ViewState, server controls
      and code-behind. There is no lift-and-shift path: Web Forms does not exist on
      modern .NET, so any migration is a rewrite by definition.
    legacy_stack: ".NET Framework 4.x, ASP.NET Web Forms"
    category: web-ui
    typical_indicators: ".aspx and .aspx.cs pairs, .ascx user controls, Site.Master, ViewState in rendered output, references to System.Web.UI."
    known_risks: "This is the one pattern where the engagement's lift-and-shift default cannot be honoured. Surface it to the client early rather than discovering it mid-programme. Effort estimates for Web Forms rewrites are routinely underestimated."
    classification_role: PRIMARY
    classification_family: WEB_APPLICATION
    classification_value: WEB_FORMS_APPLICATION
    priority: 55
    compatible_with: ["fx-aspnet-mvc"]
    conflicts_with: []
    anchor_signals: ["ASPX_FILE", "PAGE_BASE_CLASS"]
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred:
        projectMetadataParsed: true
    thresholds:
      minimumScore: 70
      highConfidenceScore: 90
    rules_status: active
    required_signals_pending: []
    rules:
      schema: signal-rules/1.0
      all: []
      any:
        - id: aspx-file
          signal:
            name: ASPX_FILE
            minimumOccurrences: 1
        - id: page-base
          signal:
            name: PAGE_BASE_CLASS
      atLeast: []
      supporting:
        - id: ascx-file
          signal:
            name: ASCX_FILE
          weight: 10
        - id: user-control-base
          signal:
            name: USER_CONTROL_BASE_CLASS
          weight: 10
        - id: master-page-base
          signal:
            name: MASTER_PAGE_BASE_CLASS
          weight: 10
        - id: system-web-ui-namespace
          signal:
            name: SYSTEM_WEB_UI_NAMESPACE
          weight: 10
        - id: global-asax
          signal:
            name: GLOBAL_ASAX_FILE
          weight: 5
      none: []
      metadata:
        - id: legacy-framework
          field: frameworkFamily
          equals: net-framework
    target_states:
      - id: blazor-server-net10
        name: "Blazor Server on .NET 10"
        summary: "Rewrite as a Blazor Server application, the closest conceptual match to the Web Forms component and server-render model."
        target_stack: ".NET 10 + Blazor Server, container on OCP4"
        consumer_impact: high
        effort: high
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: false
        prerequisites: "Screen inventory and behavioural specification captured before starting. Business sign-off on UI change."
        known_limitations: "No automated path preserves ViewState or the page lifecycle. Expect genuine redesign of stateful screens. Requires a persistent connection, which changes load-balancer and session-affinity requirements on OCP4."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: partial
          scenarios: ["webforms-to-blazor"]
          skills: ["webforms-page-conversion", "server-control-mapping"]
          gaps: ["ViewState semantics", "complex page lifecycle logic", "OCP4 session affinity"]
          custom_skills_required: ["ocp4-container-packaging", "webforms-behaviour-capture"]
        playbook_md: |
          ## Before starting
          Capture a screen-by-screen behavioural specification. Automated conversion
          produces a starting point, not a finished screen.
          ## Verification
          Conventional contract parity does not apply. Use screen-level acceptance
          tests derived from the captured specification instead.

      - id: aspnetcore-mvc-rewrite
        name: "ASP.NET Core MVC rewrite"
        summary: "Rewrite as a conventional server-rendered ASP.NET Core MVC application."
        target_stack: ".NET 10 + ASP.NET Core MVC + Razor views, container on OCP4"
        consumer_impact: high
        effort: high
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: false
        prerequisites: "Same as Blazor Server. Preferred where the team's skills favour MVC over Blazor."
        known_limitations: "Requires explicit reimplementation of state that ViewState previously handled implicitly."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: partial
          scenarios: ["aspnet-to-aspnetcore"]
          skills: ["routing-migration", "webconfig-to-appsettings"]
          gaps: ["Web Forms page model has no direct MVC equivalent", "OCP4 containerization"]
          custom_skills_required: ["ocp4-container-packaging", "webforms-behaviour-capture"]
