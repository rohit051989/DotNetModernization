# The oracle for calibrating impact-analysis (app/impact/calibration.py):
# sampleapps/WCF/MODERNIZATION-NET10-REST.md, a hand analysis of moving the WCF
# Catalog to REST on .NET 10. Sections 6 (files to change), 7 (new files) and
# 8 (files to delete), file by file, relative to the repository root.
#
# The hand analysis is the reference, not the truth: where it is wrong or
# inconsistent the classification below says so.

repository: sampleapps/WCF
inputs: wcf                  # the frozen upstream artifacts and integration edges, beside this file
source: sampleapps/WCF/MODERNIZATION-NET10-REST.md

# The scenario the hand analysis describes, as engagement decisions. Every other
# found item takes its default resolution.
decisions:
  wcf-service: wcf-service-rest-rewrite
  wcf-service-host: wcf-host-aspnetcore-web-host
  wcf-nettcp-client: migrate-to-service-protocol

# Regression floors, and a ceiling on review. A rule edit that drops recall or precision
# below its floor, or moves files to review past the ceiling, fails
# tests/test_impact_calibration.py. Raise the floors when the rules improve.
# Review is an abstention: it is neither found nor claimed (app/impact/calibration.py).
floors:                      # measured 2026-10-09: 43/70, 43/67 in scope, 43/44; review 13 of 57 listed
  recall: 0.61
  recall_in_scope: 0.64
  precision: 0.97
ceilings:
  review_rate: 0.25

