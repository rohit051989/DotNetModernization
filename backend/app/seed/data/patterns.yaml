  - id: netstandard-modern-library
    name: "Modern class library"
    summary: "Class library on the SDK-style framework lineage (.NET Core, .NET 5+, or .NET Standard) — portable, no System.Web-era coupling."
    description: |
      A library with no entry point of its own (same absence-of-entry-point
      basis as role-library-project) on the SDK-style framework lineage —
      `net-core` (netcoreapp1.x-3.1), `net` (.NET 5 and later), or
      `net-standard`. Structurally portable, with none of the System.Web-era
      coupling that makes fx47-class-library a migration problem.

      **Family discriminates, version does not.** Which exact version it is
      (netcoreapp3.1 versus net8.0) is carried on the classification as
      `framework_version` and read by whichever accelerator or risk score
      needs it; it does not split this pattern. Requires msbuild-evaluated
      project metadata (`projectMetadataParsed`) to confirm the target
      framework; on a fingerprint without that capability this pattern
      correctly falls back rather than asserting portability it cannot verify.

      **This pattern does not assert that the target is still supported.**
      A netcoreapp3.1 or net5.0 library matches it and is nonetheless past
      end of life and needs a retarget. Support lifecycle is a
      `framework_version` judgement, not a pattern boundary — so it is
      resolved in the **target state**, not here: the two options below are
      "no migration required — supported version" and "retarget to current
      LTS — version out of support", and step 14 picks between them from the
      classification's `framework_version`. See Part C.
    legacy_stack: "SDK-style lineage"
    category: library
    typical_indicators: "SDK-style csproj, no Main method, no top-level statements, no host-builder call; a netcoreapp, net5.0+, or netstandard TargetFramework."
    known_risks: "No System.Web-era coupling to unpick. Two residual risks: the target framework may itself be out of support (netcoreapp3.1, net5.0) and need a retarget, which framework_version tells you and this pattern does not; and misclassification — confirm no residual legacy dependency was missed before closing this out of the backlog."
    classification_role: PRIMARY
    classification_family: ALREADY_MODERN
    classification_value: MODERN_LIBRARY
    priority: 45
    compatible_with: []
    conflicts_with: []
    anchor_signals: []
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        syntaxAnalysis: true
        projectMetadataParsed: true
      preferred: {}
    thresholds:
      minimumScore: 50
      highConfidenceScore: 70
    rules_status: active
    required_signals_pending: []
    rules:
      schema: signal-rules/1.0
      all: []
      any: []
      atLeast: []
      supporting: []
      none:
        - id: no-main-entry
          signal:
            name: MAIN_METHOD_ENTRY_POINT
          disqualify: true
        - id: no-toplevel-entry
          signal:
            name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
          disqualify: true
        - id: no-web-builder
          signal:
            name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-host-builder
          signal:
            name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-webhost-builder
          signal:
            name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-global-asax
          signal:
            name: GLOBAL_ASAX_ENTRY_POINT
          disqualify: true
        - id: no-startup-class
          signal:
            name: STARTUP_CLASS_ENTRY_POINT
          disqualify: true
        - id: no-servicebase-run
          signal:
            name: SERVICEBASE_RUN_ENTRY_POINT
          disqualify: true
        - id: no-hosted-service
          signal:
            name: ADD_HOSTED_SERVICE_ENTRY_POINT
          disqualify: true
      metadata:
        # Replaces `frameworkVersion regex ^net(6|7|8|9|10)\.0$|^netstandard2\.1$`.
        # Two problems with that condition, both fixed here:
        #   1. It discriminated within a family (net6 in, net5 out;
        #      netstandard2.1 in, 2.0 out) — a version split of one code
        #      shape, which is exactly what framework_version is for.
        #   2. It could never match anything. The regex is written against
        #      raw TFM strings ("net8.0"), but frameworkVersion holds step
        #      2's normalised version ("8.0"), so every project failed it.
        #
        # `net-core` (netcoreapp1.x-3.1) is included: a netcoreapp3.1 class
        # library is the same shape as a net8.0 one — SDK-style, no entry
        # point, portable — and excluding it left it matching no library
        # pattern at all, so a common real-estate project fell through to
        # step 5's discovery queue. Whether its specific version is still
        # supported is a framework_version question for step 10's risk
        # scoring, not a pattern boundary (Part C).
        # Family still discriminates: fx47-class-library owns net-framework
        # libraries, this one owns the SDK-style lineage.
        - id: modern-family
          field: frameworkFamily
          in: ["net", "net-core", "net-standard"]
        # A project that produces an executable is not a class library.
        # The `none` disqualifiers above already exclude one via its entry-point
        # signal, but only when step 3 actually extracted it: on a PARTIAL
        # fingerprint with syntax analysis unavailable, an absence-based pattern
        # like this one goes blind and co-matches the desktop and console
        # patterns. outputType is step 2 msbuild metadata, present whether or
        # not syntax analysis ran, so it holds where the signal does not. This
        # is the library half of the mutual exclusion the desktop patterns
        # declare with `outputType equals WinExe` (docs/24 Part C).
        - id: not-an-executable
          field: outputType
          notIn: ["WinExe", "Exe"]
