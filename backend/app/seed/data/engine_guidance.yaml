# Engine-facing guidance: the factory default for catalog_items.engine_guidance and
# item_resolutions.engine_guidance (36-COPILOT-ENHANCED-CONVERSION Part K).
#
# This is the only catalog text the input generator puts in front of a conversion engine. The
# author-facing `description`, `target_description` and `notes` stay for catalog authors and
# reviewers and are never generated into a repository.
#
#   item guidance        what the change is and why it matters on the target platform
#   resolution guidance  what to do, in concrete steps
#
# Written for the engine reading one repository's branch and nothing else, so: self-contained;
# no platform documents, "Part X" citations or platform paths; no lifecycle step names; no
# catalog or signal vocabulary (catalog, item, resolution, occurrence, signal, discovery,
# engagement, presumptive, matrix); no notes for authors. The generator's self-containedness
# check (app/engine/inputs/selfcontained.py) refuses generated files that break these rules.
#
# Seeded through app/items/baseline.py like every catalog default: a row edited since it was
# seeded is never overwritten, and the field is exported with the catalog (catalog/items/).
#
# Written so far: every item detected in the first experiment's three applications
# (AccountsApi.Net10, AccountsApi.Net8, eShopOnWeb), with every one of their resolutions, and the
# four items the first pilot run exposed (registry 1.12.0); and (2026-11-24) ssis-package,
# fx47-class-library, wcf-service, wcf-service-host, asmx-service, windows-only-assembly-reference,
# legacy-project-format and packages-config with every resolution, and one resolution each of
# directory-services-usage, encoding-default and fx-aspnet-mvc; and (2026-11-25) one shared text for
# every resolution that keeps something unchanged (the `unchanged` section at the end); and (2026-11-26)
# linq-to-sql-usage, system-web-in-library, wif-usage and windows-workflow-usage with every resolution, and
# missing-dockerfile with its multi-stage Dockerfile.
# Name frameworks by role, never by version: "the target framework", "the project's current
# framework" (in its SDK-style short form where a project file needs it). Each work item lists the
# real values for its projects.
# Still to write: every active resolution without guidance is on the reviewed allow-list,
# engine_guidance_allowlist.yaml beside this file, with the reason; a test fails for one that is on
# neither. Items whose own text is still to write: aspnet-webforms,
# container-fixed-user-writable-path, directory-services-usage, encoding-default, fx-aspnet-mvc,
# interactive-console-tool, modern-worker-service, msmq-usage,
# package-not-approved, registry-access, system-drawing-common, wcf-nettcp-client,
# wcf-non-http-client-binding, wcf-non-http-service-binding, windows-service,
# windows-service-hosting, winforms-desktop, wpf-desktop.

items:

  aspnetcore-iis-hosting:
    guidance: |-
      This application is hosted in IIS through the ASP.NET Core Module: an `AspNetCoreHostingModel`
      property in the project file, an `aspNetCore` element or `AspNetCoreModuleV2` handler in
      web.config, or a `UseIIS()` / `UseIISIntegration()` call. In an OpenShift container there is no
      IIS: Kestrel serves requests directly and must listen on the container's port. web.config is
      ignored on Linux, so anything configured only there (request size limits, timeouts, Windows
      authentication, IIS server options) stops applying without any error.
    resolutions:
      kestrel-on-container-port: |-
        1. Remove the `<AspNetCoreHostingModel>` property from the project file.
        2. Remove the `aspNetCore` element and the AspNetCoreModule handler from web.config. Delete
           web.config if nothing else is left in it.
        3. Remove `UseIIS()` and `UseIISIntegration()` calls and any `IISServerOptions` configuration.
        4. Let Kestrel listen on port 8080: set `ASPNETCORE_HTTP_PORTS=8080` in the container image
           (an `ENV` line in the Dockerfile), not in code.
        5. Move anything web.config configured that the application relies on (request size limits,
           timeouts) to Kestrel options, with the same values. If web.config enabled Windows
           authentication, leave it and report it in the task's notes: it needs a decision.
      keep-iis-for-windows-hosts: |-
        Keep web.config and the IIS integration, so the same build still runs under IIS on the Windows
        servers, and also let Kestrel listen on port 8080 in the container (`ASPNETCORE_HTTP_PORTS=8080`
        in the image). Configure anything web.config sets that the application relies on (request size
        limits, timeouts) for Kestrel too, with the same values.

  aspnetcore-rest-api-legacy:
    guidance: |-
      A REST API built on ASP.NET Core with a `Startup` class (`ConfigureServices` and `Configure`) and
      `WebHost.CreateDefaultBuilder` or `Host.CreateDefaultBuilder`. On the target framework the hosting
      model is `WebApplication.CreateBuilder`. The controllers, routes, status codes and JSON payloads that
      callers depend on must not change.
    resolutions:
      net10-api-controllers-preserved: |-
        1. Set `<TargetFramework>` to the target framework.
        2. Replace `Program` and `Startup` with `WebApplication.CreateBuilder`: move each registration in
           `ConfigureServices` to `builder.Services`, and each middleware call in `Configure` to the
           `app` pipeline, in the same order.
        3. Keep every controller class, route, attribute and action signature exactly as it is.
        4. Keep the JSON serializer the API uses today. If it uses Newtonsoft.Json
           (`AddNewtonsoftJson`), keep it with the same settings, so responses do not change.
        5. Build and run the existing tests; no test may be edited to make it pass.
      net10-api-minimal: |-
        Retarget to the target framework, move to `WebApplication.CreateBuilder`, and rewrite each controller
        action as a minimal API endpoint with the same route, HTTP method, request and response shapes,
        and status codes. Callers must see no difference.

  console-batch-job:
    guidance: |-
      A console application that does batch work (file processing, data loads, reports) and exits, run
      on a schedule; on Windows typically by Task Scheduler. On OpenShift a scheduled run is a CronJob:
      it starts a container, runs the program to completion and stops. The program must not wait for
      keyboard input, and must exit with a non-zero code when it fails.
    resolutions:
      ocp4-cronjob-container: |-
        1. Set `<TargetFramework>` to the target framework.
        2. Make the program run to completion without user input, and return a non-zero exit code when
           it fails.
        3. Read file and directory locations from configuration, never from fixed Windows paths.
        4. Add a Dockerfile for the program (numeric non-root user, no ports) and an OpenShift CronJob
           manifest. Take the schedule from the deployment parameter named below; never write a schedule
           yourself.
        5. OpenShift runs the container as an arbitrary user, not the user named in the image, so the
           program cannot write inside the image. For each folder the program writes to (logs, output,
           work files), mount a writable volume (`emptyDir`, or a persistent volume claim where the
           files must outlive the run) at the path its configuration setting names, and set that setting
           to the mount path in the manifest. Write nowhere outside those mounts.
        6. Set `concurrencyPolicy: Forbid`, so a run never starts while the previous one is still
           running, unless the program is safe to run twice at once (it never empties, refills or locks
           shared data); then record why in the task's notes.
        7. Set `successfulJobsHistoryLimit: 3` and `failedJobsHistoryLimit: 3`, and `backoffLimit` on
           the job template, so finished runs and failed retries do not pile up.
      console-batch-job-not-deployable: |-
        This program is a tool a person runs by hand, not a workload: do not containerize or deploy it.
        Only make it build and run on the target framework.
      worker-service-container: |-
        Convert the program to a .NET Worker Service (a `BackgroundService`) that runs continuously and
        does the work on an internal timer, add a Dockerfile, and deploy it as an OpenShift Deployment.
        The interval is supplied at deployment; never write a value for it.

  container-privileged-port:
    guidance: |-
      The Dockerfile or a manifest binds a port below 1024 (for example `EXPOSE 80`,
      `ASPNETCORE_URLS=http://+:80` or `containerPort: 80`). OpenShift runs containers as a non-root
      user, which cannot bind a port below 1024, so the application fails to start.
    resolutions:
      unprivileged-port-8080: |-
        1. Make the application listen on 8080: set `ASPNETCORE_HTTP_PORTS=8080` (or
           `ASPNETCORE_URLS=http://+:8080`) in the Dockerfile, and change `EXPOSE` to 8080.
        2. If the image also exposes 443, remove it: on OpenShift, TLS is terminated by the route.
        3. In manifests, set `containerPort: 8080`, and have the Service map port 80 to
           `targetPort: 8080`, so callers see no change.
      net-bind-service-capability: |-
        Keep the port. Add the `NET_BIND_SERVICE` capability to the container's `securityContext` in the
        manifest, and report in the task's notes that the cluster owners must allow it through a
        security context constraint. Change no code.

  container-runs-as-root:
    guidance: |-
      The image runs as root: its final stage has no `USER` instruction or switches to `root`, or a
      manifest asks for user 0, privileged mode or privilege escalation. OpenShift's default security
      policy refuses such a pod, or starts it as an arbitrary non-root user in group 0, so anything that
      needed root fails at run time.
    resolutions:
      non-root-numeric-user: |-
        1. End the final stage of the Dockerfile with `USER 1001` (a numeric user; or the base image's
           `$APP_UID`).
        2. Make every path the application writes to owned by group 0 and writable by the group:
           `chown -R 1001:0 <path> && chmod -R g=u <path>`.
        3. Remove `runAsUser: 0`, `privileged: true` and `allowPrivilegeEscalation: true` from manifests.
        4. Nothing the application does at run time may need root.
      dedicated-scc: |-
        Leave the image unchanged. The service account must be granted a security context constraint
        that allows its user, which the cluster owners grant. Change no code; report the requirement in
        the task's notes.

  datetime-now-usage:
    guidance: |-
      `DateTime.Now`, `DateTime.Today` and `DateTimeOffset.Now` return the host's local time, and
      `ToLocalTime()`, `TimeZoneInfo.Local` and `DateTimeKind.Local` depend on the host's time zone. On
      the Windows servers that is the site's time zone; in a Linux container it is UTC unless set, so
      timestamps, schedules and date boundaries silently shift by the time-zone offset.
    resolutions:
      container-local-timezone: |-
        Do not change the code. In the Dockerfile, make sure time-zone data (`tzdata`) is installed and
        set the `TZ` environment variable from the deployment parameter named below, so local time means
        what it did on the Windows servers. Before that, add a characterization test that pins the
        current behaviour of each listed place (skill `writing-characterization-tests`).
      utc-at-boundaries: |-
        Add a characterization test for each listed place first (skill
        `writing-characterization-tests`). Then use `DateTime.UtcNow` (or an injected `TimeProvider`)
        wherever the value is stored, compared or calculated with, and convert to local time only where
        it is displayed, in the display time zone named below.
      utc-everywhere: |-
        Make every time in this code UTC, whatever the host's time zone. Add a characterization test for
        each listed place first (skill `writing-characterization-tests`). Then:
        1. Take the current time only from a UTC source: `TimeProvider` (injected where the code uses
           dependency injection, `TimeProvider.System` elsewhere), `DateTime.UtcNow` or
           `DateTimeOffset.UtcNow`. `DateTime.Today` becomes the UTC date (`DateTime.UtcNow.Date`).
        2. A value an API returns or a log writes carries UTC explicitly: `DateTimeKind.Utc`, or a
           `DateTimeOffset` with offset zero, so it serialises with `Z` or `+00:00`.
        3. Remove every dependence on the host's zone: `TimeZoneInfo.Local`, `ToLocalTime()` and
           `DateTimeKind.Local`.
        4. Do not set the container's `TZ` as the fix: the code must give UTC whatever `TZ` is.
        5. Where the business genuinely needs local time (a cut-off, a business date, a displayed time),
           convert explicitly with a named time zone (`TimeZoneInfo.FindSystemTimeZoneById` with an IANA
           id from configuration), never the host's, and report the place in the task's notes.
        6. Stop at every place where a time is stored or compared with stored values (a database, a
           file, a message): change nothing there, because existing stored values may be local times.
           List each such place in the task's notes, under "Stored times for a decision", with the file,
           the line and what is stored or compared.

  hardcoded-windows-path:
    guidance: |-
      A Windows path (one that starts with a drive letter, or a UNC path to a network share) written
      into source code or a configuration value. These paths do not exist in a Linux container, so file
      access fails at run time.
    resolutions:
      externalize-path-setting: |-
        Replace each literal path with a configuration setting read through `IConfiguration` or
        options, with the same meaning. Do not write a Linux path: the value is supplied at deployment
        under the parameter named below. In configuration files, remove the Windows path value rather
        than replacing it with another literal. File names are case-sensitive on Linux: a path the code
        builds or a setting holds must match the file's real case, letter for letter.
      rewrite-linux-mount-path: |-
        Replace each Windows path with the equivalent path under a volume mounted into the container
        (for example `/mnt/data/...`), and add that volume and its mount to the deployment manifest.
        File names are case-sensitive on Linux: a path must match the file's real case, letter for letter.

  missing-health-endpoint:
    guidance: |-
      The application exposes no health endpoint, so OpenShift's liveness and readiness probes have
      nothing meaningful to call; a hung or not-yet-ready instance keeps receiving traffic.
    resolutions:
      aspnetcore-health-checks: |-
        For an application this conversion moves to ASP.NET Core, add them in its ASP.NET Core host, in
        the same work as the rest of its platform changes.
        1. Register health checks with `builder.Services.AddHealthChecks()`, with a check for each
           dependency the application cannot serve without (its database, required downstream
           services).
        2. Map two endpoints: `/health/live`, with no dependency checks (the process is up), and
           `/health/ready`, with the dependency checks.
        3. In the deployment manifest, point the liveness probe at `/health/live` and the readiness
           probe at `/health/ready`, on port 8080.
        4. Do not require authentication on either endpoint.
      tcp-socket-probe: |-
        Do not change the code. In the deployment manifest, add `tcpSocket` liveness and readiness
        probes on port 8080.

  missing-ocp4-manifests:
    guidance: |-
      The application has no OpenShift (Kubernetes) deployment manifests and no Helm chart, so it
      cannot be deployed to OpenShift.
    resolutions:
      plain-manifests: |-
        For each deployable application, add OpenShift manifests kept in the repository beside the
        code: a Deployment (numeric non-root user, port 8080, liveness and readiness probes, resource
        requests and limits), a Service, a Route, and a ConfigMap for settings that are not secret.
        The probes call the application's health endpoints: the liveness probe `/health/live` and the
        readiness probe `/health/ready`, on port 8080, as the health endpoint instruction creates
        them; an application with no HTTP endpoint (a worker, a job) gets `tcpSocket` or `exec`
        probes instead, and a CronJob none. Take the namespace, image registry and route host names
        from the deployment parameters named below; never write values for them. Refer to Secrets by
        name only.
      helm-chart: |-
        Add a Helm chart for the application: a Deployment (numeric non-root user, port 8080, probes),
        a Service, a Route and a ConfigMap, with one values file per environment. The probes call the
        application's health endpoints, `/health/live` (liveness) and `/health/ready` (readiness) on
        port 8080, as the health endpoint instruction creates them; an application with no HTTP
        endpoint gets `tcpSocket` or `exec` probes instead. The namespace, image registry and route host
        are values supplied at deployment; never write them.

  package-provided-by-framework:
    guidance: |-
      The project references a NuGet package that the target framework already includes in its shared
      framework (for example `Microsoft.AspNetCore.Server.Kestrel` 2.x in an ASP.NET Core project, or
      `System.Text.Json`). The reference pins an old or redundant copy; the framework's own version is
      the one to use.
    resolutions:
      remove-framework-provided-package: |-
        Remove the `PackageReference` from the project file. If the version is managed centrally
        (Directory.Packages.props), remove that version too when no other project uses it. Add nothing
        in its place: the shared framework provides the assemblies. Build to confirm.
      keep-framework-provided-package: |-
        Keep the reference, at a version no lower than the one the target framework provides.

  package-replacement-required:
    guidance: |-
      A NuGet package the project references has no version that supports the target framework, or
      its publisher has retired it. It has to be replaced, not upgraded.
    resolutions:
      package-replacement-publisher-suggested: |-
        Replace the package with the replacement its publisher names, at the version shown with each
        place below (`replacement <package> <version>`): the replacement's newest release that supports
        the target framework and has no known advisory. Use exactly that version, and change the calling
        code to the replacement's API. Where no replacement is named, or the place says no release of it
        qualifies, leave the reference unchanged and record it in the task's notes.
      package-replacement-alternative: |-
        Replace the package with a maintained library that supports the target framework and provides
        the same capability, and change the calling code to its API.
      package-replacement-framework-builtin: |-
        Remove the package and use the capability the target framework provides itself, changing the
        calling code to the framework's API.
  package-upgrade-breaking:
    guidance: |-
      The recommended version of a NuGet package removes or changes public members this code calls.
      Bumping the version alone breaks the build: the calling code has to change in the same change.
    resolutions:
      package-upgrade-breaking-bump-and-adapt: |-
        1. Change the package's version to the recommended version where it is declared (the project
           file, Directory.Packages.props, or the property it names), in every project that references
           the package, together with any no-code-change upgrade of the same package.
        2. Change each listed call site to the new version's API, keeping the behaviour the same.
        3. Build and run the tests.
      package-upgrade-breaking-replace: |-
        Replace the package with a different library that supports the target framework, and change the
        call sites to its API.

  package-upgrade-safe:
    guidance: |-
      A NuGet package has a newer version that supports the target framework, and nothing this code
      calls changed between the two versions.
    resolutions:
      package-upgrade-safe-bump: |-
        Change the version to the recommended one shown at each place (`package from -> to`), where the
        version is declared: the project file, Directory.Packages.props, or the MSBuild property it
        names. Change every project that references the package in the same change, so the solution
        never mixes two versions of one package.
      package-upgrade-safe-keep-current: |-
        Leave the version unchanged: it already supports the target framework.

  package-vulnerable:
    guidance: |-
      The version of a NuGet package this project uses has a published security advisory.
    resolutions:
      package-vulnerable-upgrade: |-
        Change the package to the version shown with each place below (`fixed in <version>`), which has
        no known advisory, where the version is declared. If the same package is also being upgraded for
        the target framework, do both in one change. Where a place says there is no release without a
        known advisory yet, leave the version unchanged, do not look for another, and record it in the
        task's notes.
      package-vulnerable-accept-risk: |-
        Leave the version unchanged: the risk has been accepted. Change nothing.
      package-vulnerable-replace: |-
        Replace the package with a maintained alternative that has no advisory and supports the target
        framework, and change the calling code to its API.

  sensitive-config-key:
    guidance: |-
      A configuration file holds a secret value (a password, token, client secret, API key or similar)
      under the key shown. On OpenShift, secrets come from Secrets supplied at deployment, never from
      files built into the image or kept in the repository.
    resolutions:
      ocp4-secret-injection: |-
        1. Remove the secret value from every configuration file in the repository: leave the key out,
           or empty.
        2. Keep the code reading the setting through `IConfiguration` under the same key; do not rename
           it.
        3. The value is supplied at deployment from an OpenShift Secret, as an environment variable
           named after the key with `:` written as `__` (for example `Cache__Redis__Password`). The
           names are listed below. Never write a secret value anywhere.
      external-secret-store: |-
        Remove the secret value from the configuration files and read it at run time from the external
        secret store (for example HashiCorp Vault through its agent, or the External Secrets operator),
        under the same configuration key. Never write a secret value anywhere.

  serilog-file-sink:
    guidance: |-
      Serilog writes logs to a file on a Windows path. In a container that path does not exist, and
      logs belong on standard output, where OpenShift collects them.
    resolutions:
      console-json-only: |-
        Remove the Serilog `File` sink from code and configuration, and keep (or add) the `Console` sink
        with `CompactJsonFormatter`, so every log event goes to standard output as JSON. Remove the
        `Serilog.Sinks.File` package if nothing else uses it.
      otlp-exporter: |-
        Replace the Serilog `File` sink with the OpenTelemetry sink (`Serilog.Sinks.OpenTelemetry`),
        sending logs to the collector endpoint supplied at deployment; never write the endpoint value.

  target-framework-retarget:
    guidance: |-
      The project targets a .NET version below this upgrade's target framework (each place shows
      `from -> to`).
    resolutions:
      retarget-to-engagement-target: |-
        Change the target framework where it is declared (the project file's `TargetFramework`, or the
        `Directory.Build.props` that sets it) to the target shown, and update the SDK version in
        `global.json` to match, if there is one.
  unqualified-hostname:
    guidance: |-
      An endpoint URL uses a single-label host name (for example `http://appsrv0341/...`). On Windows
      the name is completed by NetBIOS or the DNS suffix list; in an OpenShift container it is found
      only if the cluster's DNS search domains cover it, so calls fail.
    resolutions:
      fully-qualify-hostname: |-
        Replace the single-label host in each listed URL with its fully qualified DNS name, in every
        environment's configuration. The fully qualified names are deployment parameters named below;
        never guess a domain.
      cluster-dns-search-domain: |-
        Do not change the URLs. Add the corporate DNS domain to the pod's `dnsConfig.searches` in the
        deployment manifest, using the domain supplied at deployment.

  windows-auth-connection-string:
    guidance: |-
      A database connection string authenticates with the process's Windows identity
      (`Integrated Security`, `Trusted_Connection` or SSPI). A Linux container has no Windows domain
      identity, so the connection fails.
    resolutions:
      sql-auth-from-secret: |-
        1. Remove `Integrated Security` / `Trusted_Connection` from the connection string.
        2. Remove the connection string's value from the configuration files. It is supplied at
           deployment from an OpenShift Secret, as a connection string with a SQL login, under the
           name listed below (`ConnectionStrings__<Name>`).
        3. Never write a user name or password anywhere.
      kerberos-keytab: |-
        Keep Windows authentication in the connection string. The pod is given a Kerberos identity at
        deployment: a keytab from a Secret, a `krb5.conf`, and a ticket-renewal sidecar in the manifest.
        Change no code; add the manifest pieces with names only, never credentials.

  enterprise-vault-secret-reference:
    guidance: |-
      This configuration value is not the secret itself but a reference, `vault:<name>`. At start-up
      `AddEnterpriseVaultSecrets()` (Enterprise.Vault) replaces each reference with the contents of the
      file `<name>` in its secrets directory: the `ENTERPRISE_VAULT_SECRETS_DIR` environment variable,
      else a Windows default, else `/vault/secrets`. On OpenShift that directory must be filled at
      deployment, one file per referenced name, or the application starts with these settings unresolved.
    resolutions:
      vault-agent-files: |-
        1. Keep every `vault:` reference and the `AddEnterpriseVaultSecrets()` call as they are.
        2. In the deployment manifest, have the Vault Agent injector write each referenced secret as a
           file named after it (the text after `vault:`) into `/vault/secrets`: the
           `vault.hashicorp.com/agent-inject` annotations, with one `agent-inject-secret-<name>` per
           reference, using the Vault role and secret path from the deployment parameters named below.
        3. Set `ENTERPRISE_VAULT_SECRETS_DIR=/vault/secrets` in the container.
        4. Never write a secret value anywhere.
      openshift-secret-files: |-
        1. Keep every `vault:` reference and the `AddEnterpriseVaultSecrets()` call as they are.
        2. In the deployment manifest, mount the OpenShift Secret named below as a volume at
           `/vault/secrets`, so each referenced name is a file there, and set
           `ENTERPRISE_VAULT_SECRETS_DIR=/vault/secrets` in the container.
        3. Never write a secret value anywhere.
      keep-existing-vault-delivery: |-
        1. This repository already delivers its vault secrets on OpenShift; the mechanism and its files are
           named below. Keep it exactly as it is: do not replace, remove, rewrite or duplicate it, and add no
           other delivery mechanism (no Vault Agent annotations, no Secret volume).
        2. Keep every `vault:` reference and the `AddEnterpriseVaultSecrets()` call as they are.
        3. Check that every reference listed below is delivered by that mechanism: its name appears in the
           mechanism's mapping. Where one is missing, add it there in the same form as the others; never
           a value.
        4. Never write a secret value anywhere.
      environment-secrets: |-
        1. Replace each `vault:` reference with nothing: remove the value from the configuration file and
           keep the code reading the setting under the same key.
        2. Remove the `AddEnterpriseVaultSecrets()` call and the Enterprise.Vault package once no reference
           is left.
        3. Each value is supplied at deployment from an OpenShift Secret as an environment variable named
           after its key, with `:` written as `__`; the names are listed below. Never write a secret value
           anywhere.

  unparseable-config-file:
    guidance: |-
      This configuration file is not valid JSON or XML; each place shows where parsing stopped. Usually a
      Windows path is written with single backslashes in a JSON string. .NET fails to load the file at
      start-up, and none of its settings take effect.
    resolutions:
      fix-config-syntax: |-
        Correct the syntax without changing what any value means: in a JSON string, write each backslash
        twice. Change nothing else in the file in this step, and confirm it now parses (build and start the
        application, or load it with a JSON parser). Its paths and secrets are then handled by the other
        instructions.
      remove-unused-config-file: |-
        If nothing loads this file (no `AddJsonFile` or default host configuration reads it, and it is not
        copied to the output), delete it. Otherwise correct its syntax instead.

  custom-file-logger-provider:
    guidance: |-
      This class is a custom logging provider (`ILoggerProvider`) that writes log files. In a container the
      files are lost with the pod and nothing collects them; on OpenShift, logs belong on standard output.
    resolutions:
      unregister-file-logger-provider: |-
        1. Remove the provider's registration (`AddProvider`, or the extension method that adds it), so
           nothing writes log files.
        2. Keep the provider class, its settings class and every test that uses them, exactly as they are:
           the tests create the provider themselves and still build and pass. Do not delete or edit them.
        3. Make sure console logging stays enabled, so every log event goes to standard output.
      remove-file-logger-provider: |-
        1. Remove the provider's registration (`AddProvider`, or the extension method that adds it) and the
           provider class itself.
        2. Remove its configuration section and the settings class bound to it.
        3. Remove the tests listed below with it, and only those: a decision chose this, naming them.
        4. Make sure console logging stays enabled, so every log event goes to standard output.
      file-logger-to-stdout: |-
        Keep the provider and its line format, but write each line to standard output (`Console.Out`)
        instead of a file, and remove its directory setting and any file handling.

  windows-build-pipeline:
    guidance: |-
      The repository's build and pipeline files assume Windows: batch scripts (`.bat`, `.cmd`), CI
      workflows that run on Windows agents or call Windows workflows, or Jenkinsfiles with a Windows agent
      label or `bat` / `powershell` steps. The application is to run in a Linux container, built by a
      pipeline that runs on Linux.
    resolutions:
      linux-build-pipeline: |-
        1. For each batch script the pipeline runs, add a shell script beside it, same folder and name with
           `.sh`, that does the same steps with the .NET CLI. Keep every `.bat` and `.cmd` script and every
           Windows job or step exactly as it is: the existing pipeline runs them until cutover. Never delete,
           rename or empty one.
        2. Every new shell script starts with `#!/bin/sh` (or `#!/usr/bin/env bash`), has LF line endings and
           is executable in git: add the rule `*.sh text eol=lf` to the repository's `.gitattributes` (create
           it at the root if there is none), and run `git add --chmod=+x <script>` for each script.
        3. Add Linux jobs or stages beside the Windows ones in each CI workflow and Jenkinsfile, calling the
           shell scripts, with the same stages, order and outputs. Point only at scripts that exist: a batch
           script listed below, or a shell script you add in the same change.
        4. Build the container image in the Linux job from the repository's existing Dockerfile.
      keep-windows-build-agents: |-
        Keep the Windows agents and batch scripts. Make the publish step target `linux-x64`, and build the
        container image with a Linux builder the pipeline calls, not on the Windows agent.

  # ---- 2026-11-24: the items a descoped .NET Framework repository's conversion met with no instruction, and the two
  # project-file items. Every framework is named by role ("the target framework", "the project's current framework"):
  # each work item lists the real values for its projects.

  ssis-package:
    guidance: |-
      This project is a SQL Server Integration Services package project: a `.dtproj` with `.dtsx`
      packages holding a control flow, data flows, connection managers and often script tasks or
      script components in C# or VB.NET. The SSIS runtime (`Microsoft.SqlServer.Dts.Runtime`, in
      `Microsoft.SqlServer.ManagedDTS`) runs only on .NET Framework on Windows with the SSIS engine
      installed: it does not exist on the target framework or in a Linux container, so code that loads
      and executes a package (`Application.LoadPackage`, `Package.Execute`) stops working. The
      packages are the exact record of what the job does today.
    resolutions:
      csharp-worker-container: |-
        Reimplement each package as C# code on the target framework, and replace the code that
        executes the package with a call to it. The `.dtsx` file is the specification: reproduce what
        it does, exactly; do not improve, reorder or correct it.
        1. Leave the `.dtsx` files and the `.dtproj` unchanged: they stay as the reference until the
           cutover.
        2. Run the control flow's tasks in the package's order: each Execute SQL task as one SQL command
           with the same text and parameters; each data flow as code, as below.
        3. For each data flow, write one reader per source and one writer per destination. A flat-file
           source gets its own parser, with exactly the format its connection manager declares: fixed
           widths or delimiters, header rows, text qualifier and code page. Write to SQL Server with
           `SqlBulkCopy` and explicit column mappings, the same as the destination's mappings.
        4. Keep null handling exactly as the package declares it. A flat-file source with
           `RetainNulls=true` turns an empty field into `DBNull.Value`; with `RetainNulls=false` an empty
           field stays an empty string. A destination with `FastLoadKeepNulls=false` does not set
           `SqlBulkCopyOptions.KeepNulls`; only `FastLoadKeepNulls=true` sets it. Keep the destination's
           batch size and table lock setting.
        5. Translate derived columns and expressions to the same results, with SSIS's own semantics:
           `SUBSTRING` counts from 1, and a null input gives a null output.
        6. Translate each script task and script component line by line, keeping every branch, its null
           handling and the case sensitivity of its comparisons (a VB.NET `=` on strings is
           case-sensitive by default: use `StringComparison.Ordinal`).
        7. Keep the method that executed the package: its signature, its return values and its log
           lines, so its callers do not change. Replace only the package loading and execution inside
           it.
        8. Read connection strings and file paths from configuration (environment variables, a
           ConfigMap or a Secret), named after the package's connection managers; never a value in code.
        9. Log progress as counts and line numbers, never a line's content.
        10. Remove the references to `Microsoft.SqlServer.ManagedDTS` and
            `Microsoft.SqlServer.Dts.Runtime` once nothing uses them.
        11. Add unit tests on made-up input that need no database: each flat file's offsets or
            delimiters, each branch of each script, empty and null fields, a malformed line, the order
            of the SQL statements, and each writer's column mappings (through an interface over the bulk
            copy, asserting on what would be sent). When there is no test project for this code, create
            one beside the project it tests and add it to the conversion's solution: a test project for
            in-scope code is in scope.
      csharp-sql-pushdown: |-
        Move each package's set-based transformations into SQL run by the database, and keep a small C#
        orchestrator on the target framework for the control flow. The `.dtsx` file is the
        specification: reproduce what it does, exactly; do not improve, reorder or correct it.
        1. Leave the `.dtsx` files and the `.dtproj` unchanged until the cutover.
        2. Run the control flow's tasks in the package's order from the orchestrator: each Execute SQL
           task with the same text and parameters.
        3. For each data flow whose source and destination are in the same database, write the
           transformation as one SQL statement or stored procedure (`INSERT ... SELECT`, `MERGE`) giving
           the same rows: the same filters, lookups, derived columns, data types and null handling as
           the package declares.
        4. A data flow that reads a file, or moves rows between databases, cannot be pushed down as it
           is: load the rows into a staging table first, with `SqlBulkCopy`, explicit column mappings
           and the package's null handling (`RetainNulls`, `FastLoadKeepNulls`, as declared), then
           transform them in SQL.
        5. Translate script tasks and script components into SQL where they work on whole sets, and
           otherwise into C# in the orchestrator, line by line, keeping every branch and the case
           sensitivity of its comparisons.
        6. Keep the method that executed the package: its signature, its return values and its log
           lines. Replace only the package loading and execution inside it.
        7. Read connection strings and file paths from configuration, named after the package's
           connection managers. Log counts and line numbers, never a row's content.
        8. Remove the references to `Microsoft.SqlServer.ManagedDTS` and
           `Microsoft.SqlServer.Dts.Runtime` once nothing uses them.
        9. Add unit tests that need no database: the order and parameters of the orchestrator's
           statements, each statement's text, and the parsing of each staged file on made-up input. When
           there is no test project for this code, create one beside the project it tests and add it to
           the conversion's solution: a test project for in-scope code is in scope.

  fx47-class-library:
    guidance: |-
      A class library on .NET Framework, often referenced by several applications in this repository.
      A .NET Framework project cannot reference a library built only for the target framework, and a
      project on the target framework cannot reference one built only for .NET Framework, so how this
      library is retargeted decides which of its consumers still build. Its consumers are the projects
      whose `ProjectReference` names it.
    resolutions:
      netstandard20-bridge: |-
        Build the library for both the project's current framework and .NET Standard 2.0, so its .NET
        Framework consumers and its consumers on the target framework can all reference it while the
        applications move one by one.
        The work items that replace what only .NET Framework provides in this library (LINQ to SQL, System.Web,
        Windows Identity Foundation, Windows Workflow, directory services, Windows-only assemblies, the Event
        Log and the like) come first, and Prerequisites names them; each kept its replacement buildable for
        both frameworks. A use of a .NET Framework-only API that is still left and has no `netstandard2.0`
        equivalent is a compile error to report in the task's notes, never one to stub out or remove.
        1. The project must be SDK-style first (the instruction for old-style project files does it,
           in an earlier task). Then set `<TargetFrameworks>` to the project's current framework, in its
           SDK-style short form, and `netstandard2.0`, separated by a semicolon. Not the current
           framework alone: consumers on the target framework could not reference it. Not
           `netstandard2.0` alone: its .NET Framework consumers then fail with CS0012 for types from the
           framework's own assemblies.
        2. Keep `RootNamespace`, `AssemblyName` and the strong-name key (`SignAssembly`,
           `AssemblyOriginatorKeyFile`) exactly as they are: the assembly's identity must not change.
        3. If `Properties/AssemblyInfo.cs` exists, keep it and set
           `<GenerateAssemblyInfo>false</GenerateAssemblyInfo>`, so the attributes are not generated a
           second time.
        4. Compile exactly the files the project compiled before: none added, none left out.
        5. A reference to a .NET Framework assembly (`System.Configuration`, `System.Data` and the like)
           stays, for the current framework only. For `netstandard2.0`, reference the NuGet package that
           provides the same API (for `System.Configuration`, `System.Configuration.ConfigurationManager`),
           in an `ItemGroup` with `Condition="'$(TargetFramework)' == 'netstandard2.0'"`.
        6. Change no source file unless a `netstandard2.0` compile error needs it, and then keep the
           .NET Framework behaviour identical (`#if NETSTANDARD2_0` only where there is no common API).
        7. Build the library, then build every project that references it, the .NET Framework ones
           included, and run their tests.
      net10-class-library: |-
        Retarget the library to the target framework alone, in the same change as every project that
        references it.
        The work items that replace what only .NET Framework provides in this library (System.Web, Windows
        Identity Foundation, Windows Workflow, directory services, Windows-only assemblies, the Event Log and the
        like) come first, and Prerequisites names them. A rewrite of LINQ to SQL to EF Core is the exception: it
        needs the target framework, so it is made in this same task. A use of a .NET Framework-only API that is
        still left is a compile error to report in the task's notes, never one to stub out or remove.
        1. The project must be SDK-style first (the instruction for old-style project files does it,
           in an earlier task), keeping `RootNamespace`, `AssemblyName`, the strong-name key and the
           compiled files.
        2. Set `<TargetFramework>` to the target framework.
        3. Replace each .NET Framework assembly reference with the target framework's own API or the
           NuGet package that provides it; remove the references the target framework provides itself.
        4. Fix only the compile errors this causes, keeping the behaviour identical.
        5. Every project that references the library must reach the target framework in this same
           change, since a .NET Framework project can no longer reference it. If one of them is not part
           of this conversion, do not retarget the library: record it as left unchanged in the task's
           notes, naming that project.
        6. Build the library and every project that references it, and run their tests.

  wcf-service:
    guidance: |-
      This project implements a WCF service (`System.ServiceModel`): `[ServiceContract]` interfaces with
      `[OperationContract]` methods, `[DataContract]` types and often `[FaultContract]` faults, hosted
      by IIS through a `.svc` file or by a `ServiceHost`. Hosting a WCF service does not exist on the
      target framework. The service's contract (its operations, the data they take and return, and its
      faults) is what its callers depend on: how the service is converted decides whether they change. A
      classic ASP.NET web project's old-style project file has no supported SDK-style form on .NET
      Framework: it becomes an SDK-style ASP.NET Core project in the move itself, as the instruction
      below says, not in a conversion of its own first.
    resolutions:
      wcf-service-corewcf: |-
        Port the service to CoreWCF on the target framework, keeping its contract exactly, so its
        callers keep working unchanged.
        1. Before changing anything, save the service's current WSDL contract in the repository beside
           the service, as the reference.
        2. If this project is a classic ASP.NET web project (System.Web, configured by web.config), make
           it an SDK-style ASP.NET Core project in this same task, not before:
           `<Project Sdk="Microsoft.NET.Sdk.Web">` with `<TargetFramework>` set to the target framework,
           keeping `RootNamespace`, `AssemblyName` and the strong-name key. Move its packages from
           `packages.config` to `PackageReference` items with the same ids and versions, as the
           instruction for packages.config says. Remove `ProjectTypeGuids`, the import of the Web
           Application targets and the IIS Express settings. A classic ASP.NET project has no supported
           SDK-style form on .NET Framework, so it is never converted to the SDK style on its own first.
        3. Keep every `[ServiceContract]`, `[OperationContract]`, `[DataContract]`, `[DataMember]` and
           `[FaultContract]` with the same names, namespaces, order and types. Change only the `using`
           directives from `System.ServiceModel` to `CoreWCF` where CoreWCF provides the type.
        4. Host the service in ASP.NET Core (`AddServiceModelServices()`, `UseServiceModel()`), with the
           same binding, security mode and credential type as each endpoint in web.config or
           app.config, at the same relative address.
        5. Keep the service's implementation classes, and the code they call, unchanged.
        6. Expose metadata (`ServiceMetadataBehavior`) where the service exposed it, and compare the new
           WSDL with the saved one: the same operations, messages and types.
        7. A binding CoreWCF does not support stays as it is: record it in the task's notes, and do not
           choose another binding.
        8. Add a test per operation that calls the service through a client generated from the saved
           WSDL.
      wcf-service-rest-rewrite: |-
        Rewrite the service as a REST API on ASP.NET Core on the target framework, retiring SOAP. Each
        operation keeps what it does and the data it takes and returns.
        1. Keep the old contract (the `[ServiceContract]` interfaces and `[DataContract]` types) in the
           repository as the reference until the cutover; do not delete it.
        2. If this project is a classic ASP.NET web project (System.Web, configured by web.config), make
           it an SDK-style ASP.NET Core project in this same task, not before:
           `<Project Sdk="Microsoft.NET.Sdk.Web">` with `<TargetFramework>` set to the target framework,
           keeping `RootNamespace`, `AssemblyName` and the strong-name key. Move its packages from
           `packages.config` to `PackageReference` items with the same ids and versions, as the
           instruction for packages.config says. Remove `ProjectTypeGuids`, the import of the Web
           Application targets and the IIS Express settings. A classic ASP.NET project has no supported
           SDK-style form on .NET Framework, so it is never converted to the SDK style on its own first.
        3. Add one HTTP endpoint per `[OperationContract]`, in controllers or minimal API endpoints,
           matching how the rest of the solution is written. Its request and response types carry the
           same data as the data contracts: the same field names, types and nullability. An operation
           that only reads is a GET; any other is a POST, PUT or DELETE as it changes data.
        4. Map each `[FaultContract]`, and each fault the service throws, to an HTTP status code (invalid
           input 400, not found 404, a conflict or broken business rule 409 or 422, anything else 500),
           with a problem-details body (`application/problem+json`, `ProblemDetails`) carrying the
           fault's message and code.
        5. Keep the service's business classes and call them from the endpoints; move no logic into
           them.
        6. Publish an OpenAPI document of the new API for its callers, describing every endpoint,
           request, response and error.
        7. Carry over the service's authentication and authorisation to every endpoint: nothing that was
           protected is left open.
        8. Add a test per operation: the same input as through the old contract gives the same output
           data, and each fault gives its status code and problem details.
      wcf-service-grpc-rewrite: |-
        Rewrite the service as a contract-first gRPC service on ASP.NET Core on the target framework.
        1. Keep the old contract in the repository as the reference until the cutover.
        2. If this project is a classic ASP.NET web project (System.Web, configured by web.config), make
           it an SDK-style ASP.NET Core project in this same task, not before:
           `<Project Sdk="Microsoft.NET.Sdk.Web">` with `<TargetFramework>` set to the target framework,
           keeping `RootNamespace`, `AssemblyName` and the strong-name key. Move its packages from
           `packages.config` to `PackageReference` items with the same ids and versions, as the
           instruction for packages.config says. Remove `ProjectTypeGuids`, the import of the Web
           Application targets and the IIS Express settings. A classic ASP.NET project has no supported
           SDK-style form on .NET Framework, so it is never converted to the SDK style on its own first.
        3. Write one `.proto` file per service contract: one `rpc` per `[OperationContract]` and one
           `message` per `[DataContract]`, carrying the same data (names and types; a nullable value as a
           wrapper type or an `optional` field).
        4. Map each fault to a gRPC status code (`InvalidArgument`, `NotFound`, `FailedPrecondition`,
           `Internal`) with the fault's message.
        5. Implement each `rpc` by calling the service's existing business classes; move no logic into
           the gRPC service class.
        6. Host it in ASP.NET Core (`AddGrpc()`, `MapGrpcService`) over HTTP/2, and carry over the
           service's authentication and authorisation.
        7. Add a test per `rpc`: the same input gives the same output data, and each fault its status
           code.
  wcf-service-host:
    guidance: |-
      This project is the process a WCF service runs in: it creates a `ServiceHost` (in a console
      application or a Windows service) or holds the service's `.svc` file for IIS. Neither a
      `ServiceHost` process nor IIS exists in a Linux container on the target framework. The service's
      implementation usually lives in another project; this one hosts it, with its endpoints, bindings
      and behaviours configured in web.config or app.config. A classic ASP.NET web project's old-style
      project file has no supported SDK-style form on .NET Framework: it becomes an SDK-style ASP.NET
      Core project in the move itself, as the instruction below says, not in a conversion of its own
      first.
    resolutions:
      wcf-host-aspnetcore-web-host: |-
        Replace the host with an ASP.NET Core application on the target framework, served by Kestrel,
        that hosts the service's new endpoints (CoreWCF, REST or gRPC, as the service's own instruction
        says).
        1. Make the project an ASP.NET Core application (`Microsoft.NET.Sdk.Web`) on the target
           framework, with a `Program.cs` that builds a `WebApplication`. The project file becomes
           SDK-style in this same task, not before: `<Project Sdk="Microsoft.NET.Sdk.Web">` with
           `<TargetFramework>` set to the target framework, keeping `RootNamespace`, `AssemblyName` and
           the strong-name key. Move its packages from `packages.config` to `PackageReference` items
           with the same ids and versions, as the instruction for packages.config says. Remove
           `ProjectTypeGuids`, the import of the Web Application targets and the IIS Express settings. A
           classic ASP.NET project has no supported SDK-style form on .NET Framework, so it is never
           converted to the SDK style on its own first.
        2. Move each endpoint's address, binding settings, behaviours and limits from web.config or
           app.config to the new host's configuration (`appsettings.json` and environment variables),
           environment by environment, keeping every value. A value that differs per environment
           becomes a configuration name, never a value in code.
        3. Register the service as its own instruction says, at the same relative addresses.
        4. Listen on port 8080: set `ASPNETCORE_HTTP_PORTS=8080` in the container image, not in code.
        5. Remove the `ServiceHost` code and the `system.serviceModel` configuration once the new host
           serves every endpoint. Keep a `.svc` file's address as a route if callers use it.
        6. Keep the host's logging, now through `ILogger` to standard output.
        7. Build, start the host in a test, and call each endpoint once.
      wcf-host-retire: |-
        Remove this host: each service it hosted gets an ASP.NET Core host of its own in this
        conversion.
        1. Check that every service this project hosts has its own new host in this conversion. If one
           does not, leave this host as it is and record why in the task's notes.
        2. Remove the project, its configuration and every reference to it from the solution and the
           repository.
        3. Move nothing of its configuration into another project unless a service's new host needs it,
           as that host's instruction says.
        4. Build the solution and run its tests.

  asmx-service:
    guidance: |-
      This project exposes an ASP.NET web service through `.asmx` files: classes with `[WebService]` and
      `[WebMethod]` methods, served by IIS through System.Web. ASMX does not exist on the target
      framework. Its callers depend on its SOAP contract: the operations, the data they take and return,
      and the service's namespace. A classic ASP.NET web project's old-style project file has no
      supported SDK-style form on .NET Framework: it becomes an SDK-style ASP.NET Core project in the
      move itself, as the instruction below says, not in a conversion of its own first.
    resolutions:
      corewcf-basichttp: |-
        Re-host the operations on CoreWCF with `BasicHttpBinding` on the target framework, keeping the
        SOAP contract, so its callers keep working unchanged.
        1. Before changing anything, save the service's current WSDL contract in the repository beside
           the service, as the reference.
        2. If this project is a classic ASP.NET web project (System.Web, configured by web.config), make
           it an SDK-style ASP.NET Core project in this same task, not before:
           `<Project Sdk="Microsoft.NET.Sdk.Web">` with `<TargetFramework>` set to the target framework,
           keeping `RootNamespace`, `AssemblyName` and the strong-name key. Move its packages from
           `packages.config` to `PackageReference` items with the same ids and versions, as the
           instruction for packages.config says. Remove `ProjectTypeGuids`, the import of the Web
           Application targets and the IIS Express settings. A classic ASP.NET project has no supported
           SDK-style form on .NET Framework, so it is never converted to the SDK style on its own first.
        3. For each class with `[WebService]`, write a `[ServiceContract]` interface with the same
           namespace (the `[WebService(Namespace = ...)]` value) and one `[OperationContract]` per
           `[WebMethod]`, with the same operation name and SOAP action, and make the class implement it.
           Mark the contract `[XmlSerializerFormat]`, so messages serialise as ASMX serialised them.
        4. Keep every parameter and return type, and the classes' logic, unchanged.
        5. Host it in ASP.NET Core with CoreWCF (`AddServiceModelServices()`, `UseServiceModel()`) and
           `BasicHttpBinding`, at the same relative address as the `.asmx` file.
        6. Compare the new WSDL with the saved one: the same operations, messages and types.
        7. Remove the `.asmx` files and their System.Web registration once the new endpoint serves every
           operation.
        8. Add a test per operation that calls it through a client generated from the saved WSDL.
      rest-api-rewrite: |-
        Rewrite the service as a REST API on ASP.NET Core on the target framework, retiring SOAP. Each
        operation keeps what it does and the data it takes and returns.
        1. Keep the `.asmx` classes in the repository as the reference until the cutover; do not delete
           them.
        2. If this project is a classic ASP.NET web project (System.Web, configured by web.config), make
           it an SDK-style ASP.NET Core project in this same task, not before:
           `<Project Sdk="Microsoft.NET.Sdk.Web">` with `<TargetFramework>` set to the target framework,
           keeping `RootNamespace`, `AssemblyName` and the strong-name key. Move its packages from
           `packages.config` to `PackageReference` items with the same ids and versions, as the
           instruction for packages.config says. Remove `ProjectTypeGuids`, the import of the Web
           Application targets and the IIS Express settings. A classic ASP.NET project has no supported
           SDK-style form on .NET Framework, so it is never converted to the SDK style on its own first.
        3. Add one HTTP endpoint per `[WebMethod]`, in controllers or minimal API endpoints, matching how
           the rest of the solution is written. Its request and response types carry the same data as the
           method's parameters and return type: the same names, types and nullability. A method that
           only reads is a GET; any other is a POST, PUT or DELETE as it changes data.
        4. Map each `SoapException` the service throws, and each error it reports, to an HTTP status code
           (invalid input 400, not found 404, a conflict or broken business rule 409 or 422, anything
           else 500), with a problem-details body (`application/problem+json`, `ProblemDetails`)
           carrying the message and code.
        5. Keep the service's business code and call it from the endpoints; move no logic into them.
        6. Publish an OpenAPI document of the new API for its callers, describing every endpoint,
           request, response and error.
        7. Carry over the service's authentication and authorisation to every endpoint: nothing that was
           protected is left open.
        8. Add a test per operation: the same input as through the old service gives the same output
           data, and each error gives its status code and problem details.

  directory-services-usage:
    resolutions:
      identity-provider-claims: |-
        Stop querying the directory at run time: take the user's identity and group memberships from the
        claims in the token the identity provider issues (OpenID Connect, or an OAuth 2.0 bearer token),
        and remove the directory lookups.
        1. Configure authentication with the identity provider: `AddJwtBearer()` for an API,
           `AddOpenIdConnect()` for an interactive web application. The authority, client id and
           audience are configuration names, never values in code.
        2. Replace each listed place: the signed-in user's identity and group checks. A user's name, e-mail
           address or identifier comes from the matching claim of the signed-in `ClaimsPrincipal`; a group
           membership check becomes a claim check (`User.IsInRole`, or an authorization policy with
           `RequireClaim`).
        3. Name the claim each check reads in configuration, so it follows the identity provider's claim
           names; never hard-code a group's name, distinguished name or identifier in code.
        4. Where the code needs directory data a token cannot carry (another user's details, a group's
           members), do not invent a source: those places are listed under "Leave unchanged". Leave each
           as it is and record it in the task's notes.
        5. Remove `System.DirectoryServices` and `System.DirectoryServices.AccountManagement` once nothing
           uses them.
        6. Add a test per replaced check with a made-up `ClaimsPrincipal`: with the claim and without it.

  encoding-default:
    resolutions:
      explicit-legacy-code-page: |-
        Keep the bytes exactly as the Windows servers produced them: use their legacy code page
        explicitly instead of `Encoding.Default`, which is UTF-8 on the target framework.
        1. Add the `System.Text.Encoding.CodePages` package if the target framework does not provide it,
           and register the provider once at startup:
           `Encoding.RegisterProvider(CodePagesEncodingProvider.Instance)`.
        2. Replace each listed use of `Encoding.Default` with one encoding,
           `Encoding.GetEncoding(codePage)`, whose code page is read from configuration under a single
           name for the whole application; never a number in code.
        3. Change only the encoding: keep how each place reads and writes.
        4. Before changing a place, add a characterization test that writes and reads a string with
           non-ASCII characters through it (skill `writing-characterization-tests`), and keep it passing
           with the configured code page.

  fx-aspnet-mvc:
    resolutions:
      aspnetcore-incremental-adapters: |-
        Move the application to ASP.NET Core on the target framework step by step, keeping the existing
        application running behind it: a new ASP.NET Core application in front serves the routes
        already moved and forwards every other request to the existing application through a reverse
        proxy (YARP), and the System.Web adapters share session state and the signed-in user between
        the two.
        1. Add a new ASP.NET Core project on the target framework beside the existing one, with YARP
           forwarding every route it does not serve to the existing application, whose address is a
           configuration name. The new project is SDK-style (`<Project Sdk="Microsoft.NET.Sdk.Web">`),
           with its packages as `PackageReference` items. Leave the existing application's project file
           and its `packages.config` as they are: a classic ASP.NET project has no supported SDK-style
           form on .NET Framework, so it is not converted to the SDK style; its routes reach an
           SDK-style project as they move.
        2. Add the System.Web adapters (`Microsoft.AspNetCore.SystemWebAdapters`) to both: the remote
           application side to the existing application, the client side to the new one. Their shared
           key is a Secret named in configuration, never a value in code.
        3. Move code both need (models, services, data access) into a library both reference, retargeted
           as that library's own instruction says; never copy it.
        4. Move controllers one at a time, starting with those that depend least on `HttpContext` and
           System.Web: each with its views and filters, rewritten for ASP.NET Core MVC with the same
           routes, parameters, responses and status codes. Every other route stays in the existing
           application.
        5. Move each setting a moved route uses from web.config to the new project's configuration, with
           the same value.
        6. Leave the existing application working for every route not moved; do not remove it.
        7. Add a test per moved route: the same request gives the same response through the new
           application as through the old one.

  windows-only-assembly-reference:
    guidance: |-
      This project references an assembly that only loads on Windows, or only on .NET Framework, by a
      path to a DLL or from the Global Assembly Cache rather than through a NuGet package: a database
      provider that loads native Windows libraries, or the SQL Server Integration Services runtime, for
      example. It will not load in a Linux container on the target framework. The build may still
      succeed: the failure comes when the code first runs. The assemblies are named in the assessment
      addendum's section on assembly references no package declares.
    resolutions:
      decide-windows-only-replacement: |-
        No replacement has been chosen for these assemblies yet. Do not replace or remove the
        references, and do not choose a replacement yourself: leave each reference, and the code that
        uses it, exactly as it is, and record each in the task's notes as left unchanged because its
        replacement is not chosen. Convert the rest of the project as its other instructions say.
      replace-windows-only-assembly: |-
        Replace each Windows-only assembly with a cross-platform library that runs on the target
        framework, declared as a NuGet package.
        1. Remove the `<Reference>` to the assembly, with its `HintPath`, and add a package reference to
           the replacement at a version that supports the target framework.
        2. Rewrite each use of the old assembly's types against the replacement, keeping the behaviour:
           the same operations, the same results, the same error handling.
        3. Keep connection strings and other settings as configuration names. If the replacement needs a
           value in a different format, record the format it needs in the task's notes, never a value.
        4. Add tests of each rewritten use that need no external system; where one needs a database or
           another service, record it in the task's notes.
  legacy-project-format:
    guidance: |-
      This project file is in the old, non-SDK format: a `<Project ToolsVersion="...">` root in the
      MSBuild namespace, a `TargetFrameworkVersion` property, and every compiled file listed one by
      one. A project in this format cannot target the target framework: it must become an SDK-style
      project (`<Project Sdk="Microsoft.NET.Sdk">`) first. The conversion must change neither what is
      compiled nor the assembly's identity.
    resolutions:
      sdk-style-project-conversion: |-
        Convert the project file to the SDK style, keeping what it builds exactly. This task does not
        retarget: a later one does.
        1. Replace the root with `<Project Sdk="Microsoft.NET.Sdk">`. Remove the MSBuild namespace,
           `ToolsVersion`, the imports of `Microsoft.Common.props` and `Microsoft.CSharp.targets`, and
           the properties the SDK sets by default.
        2. Keep `RootNamespace`, `AssemblyName`, `OutputType` and the strong-name key (`SignAssembly`,
           `AssemblyOriginatorKeyFile`) exactly as they are.
        3. Set `<TargetFramework>` to the project's current framework, in its SDK-style short form.
        4. If `Properties/AssemblyInfo.cs` exists, keep it and set
           `<GenerateAssemblyInfo>false</GenerateAssemblyInfo>`.
        5. Compile exactly the files the old project compiled. The SDK compiles every `.cs` file under
           the project's folder, so exclude with `<Compile Remove="..." />` each file the old project did
           not list. Keep `Content`, `EmbeddedResource` and `None` items with their copy settings.
        6. Keep each `ProjectReference`, and each `<Reference>` to a .NET Framework assembly the project
           needs. Move its NuGet packages as the instruction for packages.config says, in this same task.
        7. Build the project and every project that references it, and run their tests. The output
           assembly keeps its name, version and public key token.

  packages-config:
    guidance: |-
      This project lists its NuGet packages in `packages.config`: they are restored into a `packages`
      folder and referenced through `HintPath` elements. An SDK-style project, which the target
      framework needs, does not restore `packages.config`: its packages must become `PackageReference`
      items.
    resolutions:
      packagereference-migration: |-
        Move the project's packages from `packages.config` to `PackageReference` items, in the same task
        as the project's conversion to the SDK style.
        1. For each package in `packages.config`, add `<PackageReference Include="..." Version="..." />`
           with the same id and the same version. Version upgrades other instructions ask for come
           afterwards, in their own tasks.
        2. A package that is there only because another package depends on it: leave it out only when
           restore then resolves the same version `packages.config` pinned. Otherwise keep it as a
           direct `PackageReference` at the pinned version: restore takes the lowest version the
           depending package allows, and a pinned, higher version is often a security fix. Keep it too
           when this project's own code uses its types directly.
        3. Remove each `<Reference>` whose `HintPath` points into the `packages` folder: the package
           reference replaces it. Remove the imports of `.props` and `.targets` files from the `packages`
           folder, and the `EnsureNuGetPackageBuildImports` target: restore supplies them now.
        4. Delete `packages.config`.
        5. Restore and build the project and every project that references it, and run their tests.

  # ---- 2026-11-25: what a conversion review found on Linux that no item raised.

  event-log-usage:
    guidance: |-
      This code writes to or manages the Windows Event Log (`System.Diagnostics.EventLog`: `WriteEntry`,
      `SourceExists`, `CreateEventSource`, or an `EventLog` instance). The Event Log exists only on
      Windows: on Linux these calls throw `PlatformNotSupportedException`, often at startup, so the
      program fails before it does any work. In a container, what a program writes to standard error is
      what the platform collects.
    resolutions:
      event-log-to-standard-error: |-
        Write the same text to standard error instead of the Event Log, and keep the program's behaviour
        and exit codes as they are.
        1. Replace each `EventLog.WriteEntry` (static or on an instance) with one line on standard error
           (`Console.Error.WriteLine`), or with the application's logger where it already has one that
           writes to standard output or standard error. Keep the message text, and put the entry's type
           first: `Error:`, `Warning:` or `Information:`.
        2. Remove `EventLog.SourceExists`, `EventLog.CreateEventSource`, `EventLog.DeleteEventSource`
           and the creation of `EventLog` instances: there is no source to create. Keep every branch
           around them that does other work.
        3. Keep every exit code and every exception the program throws or catches: only where the text
           goes changes.
        4. Remove the reference to `System.Diagnostics.EventLog` once nothing uses it.
        5. Add a test per replaced write that captures standard error (`Console.SetError`) and asserts
           the same text and type.

  backslash-path-building:
    guidance: |-
      This code builds a path by joining its parts with a backslash (`dir + "\\" + name`,
      `string.Concat(dir, @"\", name)`, `$"{dir}\\{name}"`). On Linux the separator is `/` and a
      backslash is an ordinary character of a file name, so the file is written to, or looked for in, a
      different place, with no error. File names are also case-sensitive on Linux.
    resolutions:
      path-combine: |-
        1. Replace each path joined with a backslash by `Path.Combine(dir, name)` (several parts:
           `Path.Combine(dir, sub, name)`). Where a separator is needed on its own, use
           `Path.DirectorySeparatorChar`; never a backslash or a slash written in the code.
        2. A literal that holds several segments (`"logs\\archive"`) becomes separate arguments of
           `Path.Combine`.
        3. Keep the path's meaning: the same folder and file names, in the same order. File names are
           case-sensitive on Linux: each name must match the file's real case, letter for letter; where
           the code and the file on disk differ, use the file's case and record it in the task's notes.
        4. Keep how each place reads and writes the file.
        5. Add a test per changed place that builds the path from made-up parts and asserts it equals
           `Path.Combine` of those parts, with no backslash in it.

  # ---- 2026-11-26: the image of an application converted to the target framework on Linux, .NET Framework ones
  # included (gap 5).

  missing-dockerfile:
    guidance: |-
      This application has no Dockerfile, in its folder or anywhere else in the repository. On OpenShift it runs as a
      container image, so once it builds for the target framework it needs one: built by the pipeline, run as an
      arbitrary user, listening on an unprivileged port.
    resolutions:
      multistage-dockerfile: |-
        Add a multi-stage Dockerfile beside the project, so the pipeline builds one image of this application.
        1. If the repository already has a Dockerfile for another application, follow its conventions: the same
           base image registry and tags, build arguments and layout. Never add a second Dockerfile for a project
           that has one.
        2. Build stage: the .NET SDK image for the target framework. Copy the project files and restore first
           (`dotnet restore`), then copy the sources and `dotnet publish -c Release -o /app/publish` for this
           project only.
        3. Run stage: the ASP.NET Core runtime image for a web application, or the .NET runtime image otherwise, for
           the target framework; copy only the published output.
        4. Run as a non-root user with a numeric id (`USER 1001`), and make every path the application writes to
           writable by group 0: OpenShift runs the container as an arbitrary user in group 0.
        5. Listen on an unprivileged port (8080), set with `ASPNETCORE_HTTP_PORTS` for a web application, and
           `EXPOSE` it.
        6. Take the base images' registry from a build argument (`ARG BASE_REGISTRY`), so the pipeline can use its
           own mirror; never a credential in the file.
        7. Add a `.dockerignore` that leaves out `bin/`, `obj/` and test output.
        8. Build the image if a container engine is available here; otherwise record in the task's notes that it was
           not built.

  # ---- 2026-11-26: framework-only APIs in class libraries, which no instruction named.

  linq-to-sql-usage:
    guidance: |-
      This code uses LINQ to SQL (`System.Data.Linq`): a `DataContext` subclass, `Table<T>`, queries against
      them, and the `.dbml` files that map classes to tables. LINQ to SQL exists only on .NET Framework: there
      is no implementation for the target framework or for .NET Standard 2.0, and no package provides one. The
      project builds neither for the target framework nor for `netstandard2.0` until nothing uses it.
    resolutions:
      rewrite-to-ef-core: |-
        Rewrite the data access to EF Core, keeping what every query returns.
        Current EF Core runs only on the target framework, not on .NET Framework or .NET Standard 2.0. So this
        rewrite is made in the same task as this library's retarget to the target framework alone (the
        direct retarget, named in Prerequisites), together with every project that references the library. If
        the library is to keep building for its current framework or for `netstandard2.0` (the bridge), do not
        make this rewrite: leave the LINQ to SQL code unchanged and record in the task's notes that EF Core
        cannot build for those frameworks.
        1. Map each table and association in each listed `.dbml` file to an entity class and a `DbContext`,
           with the same table, column, key and relationship names; configure each one explicitly where it
           differs from EF Core's conventions.
        2. Keep each public method of the data-access classes, with the same signature and results. Translate
           each query so it reads the same rows in the same order (an explicit `OrderBy` where the old query
           relied on one), and keep each transaction boundary: `SubmitChanges` becomes `SaveChanges` at the
           same point.
        3. Read each connection string by its existing name from configuration; never a value in code.
        4. Remove the `.dbml` files, their generated designer files and the `System.Data.Linq` reference once
           nothing uses them.
        5. Add tests that need no database: each entity's mapping (table, columns, keys) and each query's shape
           (`ToQueryString()`). Record in the task's notes that the same queries must be run against a copy of
           the real database to confirm they return the same rows.
      rewrite-to-ado-or-dapper: |-
        Rewrite the data access against `Microsoft.Data.SqlClient`, keeping what every query does in the
        database.
        1. Replace each LINQ to SQL query with the SQL it ran, parameterised (never a value concatenated into
           SQL), executed with `SqlCommand`, or with Dapper where the repository already uses it. Read the rows
           in the same order and map them to the same classes.
        2. Keep each public method of the data-access classes, with the same signature and results, and each
           transaction boundary: `SubmitChanges` becomes a `SqlTransaction` committed at the same point.
        3. Read each connection string by its existing name from configuration; never a value in code.
        4. If this project builds for its current framework and `netstandard2.0` (the bridge), keep every
           replacement compatible with both: only APIs and package versions available to both.
        5. Remove the `.dbml` files, their generated designer files and the `System.Data.Linq` reference once
           nothing uses them.
        6. Add tests that need no database for how rows map to classes. Record in the task's notes that the
           queries must be run against a copy of the real database to confirm they return the same rows.

  system-web-in-library:
    guidance: |-
      This class library uses System.Web: `HttpContext`, `HttpRequest`, `HttpResponse`, `HttpRuntime.Cache`,
      session state, an `IHttpModule`, `System.Web.Configuration`, `JavaScriptSerializer`, `System.Web.UI` or
      `System.Web.Security`. System.Web exists only on .NET Framework, inside IIS: there is no implementation for
      the target framework or for .NET Standard 2.0. The library builds neither for the target framework nor for
      `netstandard2.0` until each use is replaced. On the target framework its host is an ASP.NET Core
      application.
    resolutions:
      compile-against-system-web-adapters: |-
        Compile the library's request, response, cache and session code against the System.Web adapters, which
        provide those System.Web types for ASP.NET Core and have a `netstandard2.0` build.
        1. Add a package reference to `Microsoft.AspNetCore.SystemWebAdapters`, at a version that supports the
           target framework and has a `netstandard2.0` build, for every framework the library builds for except
           its current .NET Framework one, which keeps its `System.Web` reference (a `Condition` on
           `$(TargetFramework)`).
        2. At each listed place, check that every System.Web type it uses is one the package provides
           (`HttpContext`, `HttpRequest`, `HttpResponse`, `HttpRuntime.Cache`, session state). Keep that code as
           it is.
        3. A type the package does not provide (`IHttpModule`, `System.Web.Configuration`,
           `JavaScriptSerializer`, `System.Web.UI`, `System.Web.Security`): do not stub it. Leave that place
           unchanged and record it in the task's notes as needing to move behind an interface the host
           implements.
        4. Record in the task's notes that each ASP.NET Core application referencing the library must register
           the adapters (`AddSystemWebAdapters()` and `UseSystemWebAdapters()`); change no application here.
        5. Build the library for every framework it targets, and every project that references it, and run
           their tests.
      move-behind-an-interface: |-
        Move each System.Web dependency out of the library, behind something its host on the target framework
        provides.
        1. An `IHttpModule`: move its logic into a class with no System.Web dependency, and record in the task's
           notes that the host registers it as ASP.NET Core middleware at the same point of the pipeline (before
           or after authentication, as the module's events were). Keep the module for the .NET Framework
           applications that still load it, calling the new class.
        2. `System.Web.Configuration` (`WebConfigurationManager`): read the same settings, by the same names,
           with `System.Configuration.ConfigurationManager`.
        3. `JavaScriptSerializer`: use the serializer the library already uses elsewhere (or `System.Text.Json`),
           and add tests that pin what callers see: date format, property name casing, null handling and enums,
           exactly as before.
        4. `System.Web.Security` (membership, forms authentication, roles): define an interface for what the
           library asks (the current user's name, a role check), and record in the task's notes that the host
           implements it from the identity provider's claims. Never keep a password or a user store in the
           library.
        5. `System.Web.UI` code (controls, pages, view state) in a library: do not convert it. Ask how before
           changing it, as the design questions say; until then leave it unchanged and record it.
        6. If this project builds for its current framework and `netstandard2.0` (the bridge), keep every
           replacement compatible with both: only APIs and package versions available to both.
        7. Remove the `System.Web` reference for every framework but the library's current .NET Framework one,
           once nothing uses it there.
        8. Add a test per moved behaviour with made-up input; build the library and every project that
           references it, and run their tests.

  wif-usage:
    guidance: |-
      This code uses Windows Identity Foundation (`System.IdentityModel.Services`: `FederatedAuthentication`,
      `SessionAuthenticationModule`, `WSFederationAuthenticationModule`, or a `ClaimsAuthenticationManager` or
      `ClaimsAuthorizationManager` subclass). It exists only on .NET Framework, as modules in IIS's System.Web
      pipeline: there is no implementation for the target framework or for .NET Standard 2.0. Sign-in, the
      session cookie and claims transformation move to ASP.NET Core authentication in the host.
    resolutions:
      move-to-aspnetcore-authentication: |-
        Move authentication from Windows Identity Foundation to ASP.NET Core authentication with the identity
        provider, keeping who may do what.
        1. In the ASP.NET Core application that hosts this code, configure authentication with the identity
           provider: `AddJwtBearer()` for an API, `AddOpenIdConnect()` with a cookie for an interactive web
           application. The authority, client id and audience are configuration names, never values in code.
           Validate the issuer, audience, lifetime and signing key of every token (`Microsoft.IdentityModel`).
        2. Replace each `FederatedAuthentication` and session module use: the signed-in user is the request's
           `ClaimsPrincipal`, and signing out is `SignOutAsync`.
        3. A `ClaimsAuthenticationManager` subclass becomes an `IClaimsTransformation` that adds or changes the
           same claims; a `ClaimsAuthorizationManager` becomes authorization policies with the same rules.
        4. Read each claim by a name in configuration, so it follows the identity provider's claim names; never
           hard-code a claim type or a group's name in code. Where this repository's instruction for directory
           lookups also moves checks to claims, use the same claim names.
        5. In a library, depend only on `ClaimsPrincipal` (or an interface the host implements), never on the
           authentication middleware. If the library builds for its current framework and `netstandard2.0` (the
           bridge), keep every replacement compatible with both.
        6. Remove the `System.IdentityModel.Services` reference once nothing uses it.
        7. Add a test per rule with a made-up `ClaimsPrincipal`: with the claim and without it.

  windows-workflow-usage:
    guidance: |-
      This code uses Windows Workflow Foundation (`System.Activities`): activities, a workflow host
      (`WorkflowInvoker`, `WorkflowApplication`), or a `.xaml` or `.xamlx` workflow definition. It exists only
      on .NET Framework: there is no implementation for the target framework or for .NET Standard 2.0.
    resolutions:
      rewrite-as-plain-code: |-
        Rewrite each workflow as plain code, keeping what it does.
        1. For each listed workflow, write a class whose methods perform its activities in the same order, with
           the same branches (each `If`, `Switch` and `FlowDecision` becomes the same condition), the same loops,
           the same inputs and outputs, and the same error handling (`TryCatch` and compensation become
           `try`/`catch` with the same handling).
        2. Where a workflow waits and resumes (a bookmark, a delay, persistence to a store), do not invent a
           mechanism: ask how before changing it, as the design questions say; until then leave that workflow
           unchanged and record it.
        3. Replace each place that runs a workflow (`WorkflowInvoker.Invoke`, `WorkflowApplication`) with a call
           to the new class, with the same inputs and outputs.
        4. If this project builds for its current framework and `netstandard2.0` (the bridge), keep the new code
           compatible with both.
        5. Remove the workflow definitions and the `System.Activities` reference once nothing uses them.
        6. Add a test per branch of each workflow, with made-up inputs, asserting the same outputs.
      workflow-third-party-port: |-
        Port each workflow to the third-party workflow library chosen for this repository, keeping what it does.
        1. The library is named in the note after these steps. If no note names one, change nothing: leave each
           workflow unchanged and record in the task's notes that no library is named.
        2. Add a package reference to that library, at a version that supports the target framework (and
           `netstandard2.0`, if this project builds for it too).
        3. Rebuild each workflow in it with the same activities in the same order, and the same branches,
           inputs, outputs, persistence and error handling.
        4. Replace each place that runs a workflow with the library's equivalent.
        5. Remove the workflow definitions and the `System.Activities` reference once nothing uses them.
        6. Add a test per branch of each workflow, with made-up inputs, asserting the same outputs.

# One text for every resolution that keeps something unchanged on Windows or .NET Framework, or keeps it
# out of the move (2026-11-25): the loader (app/items/baseline.py) puts it in each listed resolution's
# guidance with that resolution's reason, so the database row and the export carry the whole text and an
# admin may still edit one. A resolution is listed here or above, never both. Retirements are not
# listed: removing something is a person's change, so they stay on the allow-list.
unchanged:
  text: >-
    Leave this exactly as it is: {reason}. Change nothing this instruction is about: not its code, its
    project file, its references or its configuration. Record it in the task's notes as left
    unchanged, with that reason.
  resolutions:
    backslash-path-building:
      backslash-path-remain-windows-hosted: "the application stays on Windows, outside the Linux move"
    directory-services-usage:
      directory-services-usage-remain-windows-hosted: "the application stays on Windows, outside the Linux move"
    linq-to-sql-usage:
      linq-to-sql-remain-windows-hosted: "the library and its applications stay on .NET Framework on Windows, outside the move"
    system-web-in-library:
      system-web-in-library-remain-windows-hosted: "the library and its applications stay on .NET Framework on Windows, outside the move"
    wif-usage:
      wif-remain-windows-hosted: "the code and its applications stay on .NET Framework on Windows, outside the move"
    windows-workflow-usage:
      windows-workflow-remain-windows-hosted: "the workflow and its applications stay on .NET Framework on Windows, outside the move"
    event-log-usage:
      event-log-remain-windows-hosted: "the application stays on Windows, outside the Linux move"
    interactive-console-tool:
      interactive-tool-keep-not-deployed: "the tool stays in the repository as one a person runs by hand, outside the deployment"
    legacy-project-format:
      keep-old-style-project: "the project stays on .NET Framework, outside the move to the target framework"
    msmq-usage:
      msmq-usage-remain-windows-hosted: "the application stays on Windows, outside the Linux move"
    package-replacement-required:
      package-replacement-remain-windows-hosted: "the project stays on .NET Framework on Windows, and so does the package it needs"
    packages-config:
      keep-packages-config: "the project stays on .NET Framework with its old-style project file"
    registry-access:
      registry-access-remain-windows-hosted: "the application stays on Windows, outside the Linux move"
    system-drawing-common:
      system-drawing-common-remain-windows-hosted: "the application stays on Windows, outside the Linux move"
    target-framework-retarget:
      stay-on-current-framework: "the project stays on its current framework for now, outside the move to the target framework"
    wcf-nettcp-client:
      wcf-nettcp-client-remain-windows-hosted: "the caller stays on Windows, outside the Linux move"
    wcf-service:
      wcf-service-remain-windows-hosted: "the service stays on .NET Framework WCF on its Windows hosts, outside the Linux move"
    wcf-service-host:
      wcf-host-remain-windows-hosted: "the host stays on Windows, outside the Linux move"
    windows-only-assembly-reference:
      keep-project-on-windows: "the project stays on Windows, outside the Linux move"
    windows-service:
      windows-service-remain-windows-hosted: "the service stays on Windows, outside the Linux move"
    windows-service-hosting:
      windows-service-hosting-remain-windows-hosted: "the service stays on Windows, outside the Linux move"
