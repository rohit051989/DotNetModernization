job_name: phase0-repository-discovery
version: 11
description: "Per-repository discovery and analysis. Lifecycle steps 1-9 (17-LIFECYCLE-STEPS.md v2.1)."

parameters:
  - name: engagement_id
    type: string
    required: true
    description: "The engagement this run belongs to."
  - name: repository_id
    type: string
    required: true
    description: "UUID of the registered repository to analyse."
  - name: ingest_token
    type: string
    required: true
    description: "UUID generated per registration or rescan. Makes each rescan a distinct job instance rather than a restart of the previous one."

stub_policy: continue

flow:
  - step: repository-ingest
  - step: solution-discovery
    inputs:
      repository-inventory: "${artifacts.repository-inventory}"
    restart:
      allow_start_if_complete: false
      start_limit: 3
  - step: application-fingerprinting
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
  # v7: step 4 is implemented and consumes both upstream artifacts, so both
  # are wired here.
  - step: entry-point-inventory
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
  # v8: step 5 is implemented. It consumes the same two artifacts, both
  # required: step 2's project list and step 3's skip verdicts and
  # UNC_PATH_LITERAL signals.
  # v10: step 5 1.3.0 also reads step 4's entry points, to record which
  # backend calls each inbound operation reaches (29-STEPS Part C9).
  - step: outbound-invocation-inventory
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
      entry-point-inventory: "${artifacts.entry-point-inventory}"
  # v9: step 6, dependency-assessment, inserted before item detection
  # (30-STEP-006-DEPENDENCY-ASSESSMENT.md). It needs step 2's direct
  # packages and step 3's skip verdicts, and its PACKAGE_* signals must be
  # in fingerprint_signals before step 7 reads them. Config is Part B6/E:
  # the lookup-cache TTL, and the advisory explanation, off (not built).
  - step: dependency-assessment
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
    config:
      compare_public_feed: true
      lookup_cache_ttl_hours: 24
      force_refresh: false
      include_transitive: false
      enable_change_explanation: false
  # Step 7 replaces pattern-classification: it matches catalog items against
  # the fingerprint's signals (step 3's and step 6's) and emits occurrences,
  # not a classification.
  - step: item-detection
    inputs:
      application-fingerprint: "${artifacts.application-fingerprint}"
  # v11: step 8, test-coverage-assessment, phase 1 (32-STEP-008 Part L):
  # test discovery and classification, mapping, buckets, existing coverage
  # reports, CI maturity. Both inputs required from the start: step 2's
  # projects and packages, step 3's test signals. coverage_report_locations
  # adds CI output directories to search beside the repository (none here).
  # No LLM and no test execution in this phase.
  - step: test-coverage-assessment
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
    config:
      coverage_report_locations: []
  - step: risk-scoring-tier-assignment
