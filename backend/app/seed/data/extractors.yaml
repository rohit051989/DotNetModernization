# Step 3 extractor declarations — 28-ITEM-AND-CONVERSION-MODEL.md Part C
# "Extractor declarations". Each extractor declares every signal it can emit.
#
# This is deliberately a second, independent declaration alongside the
# `extractor` field in steps/step-003-fingerprinting/schemas/signal-registry-*.json:
# the seed cross-checks the two, and a registered signal whose extractor does
# not list it here is a HARD ERROR (the seed fails). That is the check that
# catches a signal added to the registry in anticipation with its extractor
# forgotten.
#
# status: implemented — the extractor ships in step 3 today; its signals are ready.
# status: planned     — declared ahead of the code; its signals are not_ready
#                        (extractor_not_implemented) until this flips to implemented.
#
# planned_emits        — on an implemented extractor: signals it will gain but does
#                        not emit yet. Claimed (not a hard error), not ready. Move a
#                        name to emits in the same change that ships its code.
#
# Registry 1.4.0 (step 3 extractor batch 2): ApiUsageExtractor and
# PathLiteralExtractor shipped, and every planned_emits entry moved to emits.
# Registry 1.5.0 added WCF_CLIENT_BINDING_CONFIG and WCF_CLIENT_BINDING_USAGE.
# Registry 1.6.0 added the six PACKAGE_* signals. Their producer is
# DependencyAssessment — lifecycle step 6, a separate step that writes into
# fingerprint_signals under its own extractor name — so a producer here is any
# step that emits registered signals, not only a step 3 extractor.
# Nothing is planned at the moment.

extractors:
  - name: ApiUsageExtractor
    status: implemented
    owner_team: platform
    description: "Member access on framework APIs whose behaviour differs on Linux (semantic, symbol-resolved)."
    emits:
      - ADD_HEALTH_CHECKS_INVOCATION
      - DATETIME_NOW_USAGE
      - DIRECTORY_SERVICES_USAGE
      - ENCODING_DEFAULT_USAGE
      - MAP_HEALTH_CHECKS_INVOCATION
      - PROCESS_START_USAGE
      - REGISTRY_ACCESS_USAGE
      - SYSTEM_DRAWING_USAGE
      - USE_WINDOWS_SERVICE_INVOCATION
      - WCF_CLIENT_BINDING_USAGE
  - name: AttributeExtractor
    status: implemented
    owner_team: platform
    description: "C# attribute usages (e.g. [ServiceContract], [ApiController], test attributes)."
    emits:
      - API_CONTROLLER_ATTRIBUTE
      - DATA_CONTRACT_ATTRIBUTE
      - FACT_ATTRIBUTE
      - FUNCTION_NAME_ATTRIBUTE
      - HTTP_DELETE_ATTRIBUTE
