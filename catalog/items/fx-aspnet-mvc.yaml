category: framework
deleted: false
description: |-
  System.Web-based MVC or Web API application with Global.asax, App_Start
  configuration classes and web.config. Tightly coupled to IIS and the
  System.Web pipeline.
detection:
  match:
    all: []
    any:
    - id: mvc-controller
      signal:
        name: CONTROLLER_BASE_CLASS
    - id: webapi-controller
      signal:
        name: API_CONTROLLER_BASE_CLASS
    - id: mvc-namespace
      signal:
        name: SYSTEM_WEB_MVC_NAMESPACE
    - id: webapi-namespace
      signal:
        name: SYSTEM_WEB_HTTP_NAMESPACE
    - id: exposes-http-api
      signal:
        name: EXPOSES_HTTP_API
    atLeast: []
    metadata:
    - equals: net-framework
      field: frameworkFamily
      id: legacy-framework
    none:
    - id: not-startup-class
      signal:
        name: STARTUP_CLASS_ENTRY_POINT
    - id: not-webhost-builder
      signal:
        name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
    - id: not-host-builder
      signal:
        name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
excluded_roles: []
id: fx-aspnet-mvc
name: Classic ASP.NET MVC / Web API on .NET Framework
owner_team: null
resolutions:
- confirm_design: true
  consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: Run ASP.NET Core alongside the existing app using System.Web adapters and a YARP strangler proxy, migrating routes progressively.
  effort: medium
  engine_guidance: |-
    Move the application to ASP.NET Core on the target framework step by step, keeping the existing
    application running behind it: a new ASP.NET Core application in front serves the routes
    already moved and forwards every other request to the existing application through a reverse
    proxy (YARP), and the System.Web adapters share session state and the signed-in user between
    the two.
    1. Add a new ASP.NET Core project on the target framework beside the existing one, with YARP
       forwarding every route it does not serve to the existing application, whose address is a
       configuration name. The new project is SDK-style (`<Project Sdk="Microsoft.NET.Sdk.Web">`),
       with its packages as `PackageReference` items. Leave the existing application's project file
       and its `packages.config` as they are: a classic ASP.NET project has no supported SDK-style
       form on .NET Framework, so it is not converted to the SDK style; its routes reach an
       SDK-style project as they move.
    2. Add the System.Web adapters (`Microsoft.AspNetCore.SystemWebAdapters`) to both: the remote
       application side to the existing application, the client side to the new one. Their shared
       key is a Secret named in configuration, never a value in code.
    3. Move code both need (models, services, data access) into a library both reference, retargeted
       as that library's own instruction says; never copy it.
    4. Move controllers one at a time, starting with those that depend least on `HttpContext` and
       System.Web: each with its views and filters, rewritten for ASP.NET Core MVC with the same
       routes, parameters, responses and status codes. Every other route stays in the existing
       application.
    5. Move each setting a moved route uses from web.config to the new project's configuration, with
       the same value.
    6. Leave the existing application working for every route not moved; do not remove it.
    7. Add a test per moved route: the same request gives the same response through the new
       application as through the old one.
  id: aspnetcore-incremental-adapters
  is_default: true
  linux_compatible: true
  name: Incremental migration with System.Web adapters
  notes: |-
    Prerequisites: Ability to run two processes during transition. Route inventory captured up front.

    Known limitations: Temporarily increases operational complexity by running two applications. Requires a defined end date or the interim state becomes permanent.
  status: active
  target_description: .NET 10 + ASP.NET Core + System.Web adapters + YARP
- confirm_design: true
  consumer_impact: low
  container_ready: true
  deleted: false
  derivations: []
  description: Single-pass migration of the whole application to ASP.NET Core MVC.
  effort: high
  id: aspnetcore-mvc-net10
  is_default: false
  linux_compatible: true
  name: Direct migration to ASP.NET Core MVC on .NET 10
  notes: |-
    Prerequisites: Strong test coverage. Limited HttpContext and session sprawl.

    Known limitations: Big-bang cutover with a large review surface. Only appropriate for small or well-tested applications.
  status: active
  target_description: .NET 10 + ASP.NET Core MVC, container on OCP4
scope: application
status: active
