  # ---------------------------------------------------------- role patterns
  # 24-STEP-004-CLASSIFICATION.md Part D. Evaluated in a first pass, ahead of
  # the application patterns above, to determine project_role — which then
  # gates eligibility via each application pattern's
  # eligibility.excludedProjectRoles. No target_state_options: these exist
  # only for classification, not migration guidance.
  - id: role-test-project
    name: "Test project"
    summary: "A project whose purpose is testing another project, not shipping a runtime application."
    description: |
      Identified by test-framework attributes (MSTest, xUnit, NUnit). May
      legitimately contain ASP.NET Core, MVC, or Entity Framework signals
      because it tests those technologies — that must not make it look like a
      production web application.
    legacy_stack: "Any"
    category: library
    typical_indicators: "[TestMethod], [Fact], [Test] or [TestFixture] attributes; a test-framework package reference."
    known_risks: "None — this is a classification input, not a migration target."
    classification_role: PROJECT_ROLE
    classification_family: PROJECT_ROLE
    classification_value: TEST
    priority: 90
    compatible_with: []
    conflicts_with: []
    anchor_signals: ["TEST_METHOD_ATTRIBUTE", "FACT_ATTRIBUTE", "TEST_ATTRIBUTE", "TEST_FIXTURE_ATTRIBUTE"]
    eligibility: null
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred: {}
    thresholds:
      minimumScore: 50
      highConfidenceScore: 70
    rules_status: active
    required_signals_pending: []
    rules:
      # signal-registry 1.2.0 added XUNIT_PACKAGE/NUNIT_PACKAGE/MSTEST_PACKAGE
      # (FrameworkReferenceExtractor), closing the gap noted here through
      # 1.1.0: Part D's "test framework packages" half of the basis is now
      # expressible alongside the four attributes. Supporting weights let a
      # project with both a test-framework package reference AND a healthy
      # number of test-attribute occurrences score above one with only a
      # single weak attribute match, per 24-STEP-004-CLASSIFICATION.md Part D.
      schema: signal-rules/1.0
      all: []
      any:
        - id: test-method-attr
          signal:
            name: TEST_METHOD_ATTRIBUTE
        - id: fact-attr
          signal:
            name: FACT_ATTRIBUTE
        - id: test-attr
          signal:
            name: TEST_ATTRIBUTE
        - id: test-fixture-attr
          signal:
            name: TEST_FIXTURE_ATTRIBUTE
      atLeast: []
      supporting:
        - id: xunit-package
          signal:
            name: XUNIT_PACKAGE
          weight: 20
        - id: nunit-package
          signal:
            name: NUNIT_PACKAGE
          weight: 20
        - id: mstest-package
          signal:
            name: MSTEST_PACKAGE
          weight: 20
        - id: fact-attr-present
          signal:
            name: FACT_ATTRIBUTE
          weight: 10
        - id: test-method-attr-present
          signal:
            name: TEST_METHOD_ATTRIBUTE
          weight: 10
        - id: test-attr-present
          signal:
            name: TEST_ATTRIBUTE
          weight: 10
        - id: test-fixture-attr-present
          signal:
            name: TEST_FIXTURE_ATTRIBUTE
          weight: 10
        - id: fact-attr-substantial
          signal:
            name: FACT_ATTRIBUTE
            minimumOccurrences: 5
          weight: 10
        - id: test-method-attr-substantial
          signal:
            name: TEST_METHOD_ATTRIBUTE
            minimumOccurrences: 5
          weight: 10
        - id: test-attr-substantial
          signal:
            name: TEST_ATTRIBUTE
            minimumOccurrences: 5
          weight: 10
        - id: test-fixture-attr-substantial
          signal:
            name: TEST_FIXTURE_ATTRIBUTE
            minimumOccurrences: 5
          weight: 10
      none: []
      metadata: []

