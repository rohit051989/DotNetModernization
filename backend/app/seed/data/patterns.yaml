      minimumScore: 50
      highConfidenceScore: 70
    rules_status: active
    required_signals_pending: []
    rules:
      # Absence of entry-point evidence is what determines the role (see the
      # description above) — supporting weights below don't change that, they
      # only grade *how substantively* library-shaped the surviving evidence
      # is, so a library with a real data-access layer (a DbContext, EF Core
      # usage) scores above a library that's just a bag of DTOs.
      schema: signal-rules/1.0
      all: []
      any: []
      atLeast: []
      supporting:
        - id: db-context-class
          signal:
            name: DB_CONTEXT_BASE_CLASS
          weight: 20
        - id: ef-core-namespace
          signal:
            name: MICROSOFT_ENTITYFRAMEWORKCORE_NAMESPACE
          weight: 15
