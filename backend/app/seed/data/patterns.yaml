        - id: data-contract
          signal:
            name: DATA_CONTRACT_ATTRIBUTE
          weight: 10
        - id: wcf-endpoint-config
          signal:
            name: WCF_SERVICE_ENDPOINT_CONFIG
          weight: 10
        - id: wcf-binding-config
          signal:
            name: WCF_BINDING_CONFIG
          weight: 10
        - id: hosting-environment
