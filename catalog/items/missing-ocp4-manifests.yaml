category: packaging
deleted: false
description: 'A deployable .NET application with no Kubernetes/OpenShift manifest and no Helm chart in its project directory or anywhere else in its repository: on modern .NET, or on .NET Framework (a conversion acts on it only when the application''s chosen approach moves it to the target framework in a container). A repository-level k8s/ or charts/ folder counts for every project in the repository.'
detection:
  match:
    all: []
    any:
    - id: web-host
      signal:
        name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
    - id: generic-host
      signal:
        name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
    - id: webhost
      signal:
        name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
    - id: main-method
      signal:
        name: MAIN_METHOD_ENTRY_POINT
    - id: top-level-statements
      signal:
        name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
    - id: svc-host
      signal:
        name: SVC_FILE
    - id: asmx-host
      signal:
        name: ASMX_FILE
    - id: aspx-host
      signal:
        name: ASPX_FILE
    - id: global-asax-host
      signal:
        name: GLOBAL_ASAX_FILE
    atLeast: []
    metadata:
    - field: frameworkFamily
      id: dotnet-application
      in:
      - net
      - net-core
      - net-framework
    - field: outputType
      id: not-desktop
      notEquals: WinExe
    - field: projectSdk
      id: not-blazor-webassembly
      notEquals: Microsoft.NET.Sdk.BlazorWebAssembly
    none:
    - id: has-manifest
      signal:
        name: OCP4_MANIFEST_FILE
    - id: has-helm-chart
      signal:
        name: HELM_CHART_FILE
engine_guidance: |-
  The application has no OpenShift (Kubernetes) deployment manifests and no Helm chart, so it
  cannot be deployed to OpenShift.
excluded_roles:
- DATABASE
- DEPLOYMENT
- LIBRARY
- TEST
id: missing-ocp4-manifests
name: No OpenShift deployment manifests
owner_team: null
resolutions:
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: A Helm chart with per-environment values files.
  effort: medium
  engine_guidance: |-
    Add a Helm chart for the application: a Deployment (numeric non-root user, port 8080, probes),
    a Service, a Route and a ConfigMap, with one values file per environment. The probes call the
    application's health endpoints, `/health/live` (liveness) and `/health/ready` (readiness) on
    port 8080, as the health endpoint instruction creates them; an application with no HTTP
    endpoint gets `tcpSocket` or `exec` probes instead. The namespace, image registry and route host
    are values supplied at deployment; never write them.
  id: helm-chart
  is_default: false
  linux_compatible: true
  name: Helm chart
  notes: null
  phase: 5
  status: active
  target_description: Chart deployed by the pipeline or GitOps
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: Deployment, Service, Route and ConfigMap YAML for the application, kept beside the code.
  effort: low
  engine_guidance: |-
    For each deployable application, add OpenShift manifests kept in the repository beside the
    code: a Deployment (numeric non-root user, port 8080, liveness and readiness probes, resource
    requests and limits), a Service, a Route, and a ConfigMap for settings that are not secret.
    The probes call the application's health endpoints: the liveness probe `/health/live` and the
    readiness probe `/health/ready`, on port 8080, as the health endpoint instruction creates
    them; an application with no HTTP endpoint (a worker, a job) gets `tcpSocket` or `exec`
    probes instead, and a CronJob none. Take the namespace, image registry and route host names
    from the deployment parameters named below; never write values for them. Refer to Secrets by
    name only.
  id: plain-manifests
  is_default: true
  linux_compatible: true
  name: Plain manifests
  notes: null
  phase: 5
  status: active
  target_description: OCP4 manifests applied by the pipeline
scope: application
status: active
