      - HTTP_PUT_ATTRIBUTE
      - OPERATION_CONTRACT_ATTRIBUTE
      - ROUTE_ATTRIBUTE
      - ROUTE_PREFIX_ATTRIBUTE
      - SERVICE_CONTRACT_ATTRIBUTE
      - TEST_ATTRIBUTE
      - TEST_FIXTURE_ATTRIBUTE
      - TEST_METHOD_ATTRIBUTE
      - WEB_METHOD_ATTRIBUTE
  - name: ConfigurationExtractor
    status: implemented
    owner_team: platform
    description: "Elements and keys in web.config, app.config and appsettings*.json."
    emits:
      - ASPNETCORE_CONFIG
      - CONNECTION_STRING_CONFIG
      - CONNECTION_STRING_PROVIDER_CONFIG
      - KAFKA_BOOTSTRAP_CONFIG
      - REDIS_CONNECTION_CONFIG
      - SENSITIVE_CONFIG_KEY
      - SERILOG_FILE_SINK_CONFIG
      - SERVICE_HOSTING_ENVIRONMENT_CONFIG
      - SYSTEM_SERVICE_MODEL_CONFIG
      - SYSTEM_WEBSERVER_CONFIG
      - SYSTEM_WEB_CONFIG
      - VAULT_CONFIG
      - WCF_BINDING_CONFIG
      - WCF_CLIENT_BINDING_CONFIG
      - WCF_CLIENT_ENDPOINT_CONFIG
      - WCF_SERVICE_ENDPOINT_CONFIG
      - WINDOWS_AUTH_CONNECTION_STRING_CONFIG
  - name: DependencyAssessment
    status: implemented
    owner_team: platform
    description: "Lifecycle step 6, not a step 3 extractor: NuGet feed lookup, recommended version for the target framework, and the API diff of each upgrade (30-STEP-006-DEPENDENCY-ASSESSMENT.md)."
    emits:
      - PACKAGE_DEPRECATED
      - PACKAGE_NOT_IN_CLIENT_FEED
      - PACKAGE_NO_COMPATIBLE_VERSION
      - PACKAGE_UPGRADE_BREAKING
      - PACKAGE_UPGRADE_SAFE
      - PACKAGE_VULNERABLE
  - name: EntryPointExtractor
    status: implemented
    owner_team: platform
