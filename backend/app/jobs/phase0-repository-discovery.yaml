job_name: phase0-repository-discovery
version: 14
description: "Per-repository discovery and analysis, repository-ingest through risk-scoring-tier-assignment (17-LIFECYCLE-STEPS.md)."

parameters:
  - name: engagement_id
    type: string
    required: true
    description: "The engagement this run belongs to."
  - name: repository_id
    type: string
    required: true
    description: "UUID of the registered repository to analyse."
  - name: ingest_token
    type: string
    required: true
    description: "UUID generated per registration or rescan. Makes each rescan a distinct job instance rather than a restart of the previous one."

stub_policy: continue

flow:
  - step: repository-ingest
  - step: solution-discovery
    inputs:
      repository-inventory: "${artifacts.repository-inventory}"
    restart:
      allow_start_if_complete: false
      start_limit: 3
  - step: application-fingerprinting
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
  # v7: entry-point-inventory is implemented and consumes both upstream
  # artifacts, so both are wired here.
  - step: entry-point-inventory
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
  # v8: outbound-invocation-inventory is implemented. It consumes the same
  # two artifacts, both required: solution-discovery's project list and
  # application-fingerprinting's skip verdicts and UNC_PATH_LITERAL signals.
  # v10: outbound-invocation-inventory 1.3.0 also reads entry-point-inventory's
  # entry points, to record which backend calls each inbound operation
  # reaches (29-ENTRY-POINT-AND-OUTBOUND-INVENTORIES Part C9).
  - step: outbound-invocation-inventory
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
      entry-point-inventory: "${artifacts.entry-point-inventory}"
  # v9: dependency-assessment inserted before item-detection
  # (30-DEPENDENCY-ASSESSMENT.md). It needs solution-discovery's direct
  # packages and application-fingerprinting's skip verdicts, and its
  # PACKAGE_* signals must be in fingerprint_signals before item-detection
  # reads them. Config is Part B6/E:
  # the lookup-cache TTL, and the advisory explanation, off (not built).
  - step: dependency-assessment
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
    config:
      compare_public_feed: true
      lookup_cache_ttl_hours: 24
      force_refresh: false
      include_transitive: false
      enable_change_explanation: false
  # item-detection replaces pattern-classification: it matches catalog items
  # against the fingerprint's signals (application-fingerprinting's and
  # dependency-assessment's) and emits occurrences, not a classification.
  - step: item-detection
    inputs:
      application-fingerprint: "${artifacts.application-fingerprint}"
  # v11: test-coverage-assessment, phase 1 (32-TEST-COVERAGE-ASSESSMENT Part L):
  # test discovery and classification, mapping, buckets, existing coverage
  # reports, CI maturity. Both inputs required from the start:
  # solution-discovery's projects and packages, application-fingerprinting's
  # test signals. coverage_report_locations
  # adds CI output directories to search beside the repository (none here).
  # No LLM and no test execution in this phase.
  - step: test-coverage-assessment
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      application-fingerprint: "${artifacts.application-fingerprint}"
    config:
      coverage_report_locations: []
  # v12: impact-analysis inserted before risk-scoring-tier-assignment
  # (17-LIFECYCLE-STEPS.md v2.3; 33-IMPACT-ANALYSIS.md).
  # v13: impact-analysis is implemented. All four inputs are required:
  # solution-discovery's projects, entry-point-inventory's entry points
  # (convention files and handlers), item-detection's occurrences (the work
  # items and their seed files) and test-coverage-assessment's test mappings
  # (referencing_tests). Decisions and the catalog's impact rules are read
  # from the database at run time.
  # v14: no change to the flow. Comments and doc references name steps by
  # slug, and step specs by their renamed files (CLAUDE.md rule 12).
  - step: impact-analysis
    inputs:
      solution-project-inventory: "${artifacts.solution-project-inventory}"
      entry-point-inventory: "${artifacts.entry-point-inventory}"
      item-occurrences: "${artifacts.item-occurrences}"
      test-coverage: "${artifacts.test-coverage}"
  - step: risk-scoring-tier-assignment
