# Every disagreement, classified: what is wrong (class: rule_missing, rule_wrong,
# oracle_wrong, scope, vocabulary), the work expected to resolve it (resolved_by:
# reachability-analysis; supporting-item:<id> or recipe:<id> from
# 35-RECIPE-WCF-SERVICE-REST.md; or out-of-scope) and why. The calibration projects recall
# per resolved_by, so each discovery pick's effect is measured as it lands. A disagreement
# with no entry, or no valid resolved_by, fails the test.
classifications:
  '.host.pid':
    class: scope
    resolved_by: supporting-item:dead-code
    reason: 'A leftover runtime file (X11) — 35 Part C''s dead-code item lists it.'
  'README.md':
    class: scope
    resolved_by: out-of-scope
    reason: 'Repository documentation. No catalog item covers a README.'
  'scripts/Apply-SetParam.ps1':
    class: scope
    resolved_by: supporting-item:webdeploy-parameters
    reason: 'The script that applies SetParam files; obsolete once ASPNETCORE_ENVIRONMENT selects the settings file. 35 Part C''s webdeploy-parameters item covers Web Deploy''s files and script.'
  'scripts/New-DevCertificates.ps1':
    class: scope
    resolved_by: out-of-scope
    reason: 'A developer script. No catalog item covers developer scripts.'
  'scripts/Remove-AdminHttpBindings.ps1':
    class: scope
    resolved_by: supporting-item:dead-code
    reason: 'http.sys reservation script, dead once Kestrel hosts (X10); 35 Part C''s dead-code item lists it.'
  'scripts/Setup-AdminHttpBindings.ps1':
    class: scope
    resolved_by: supporting-item:dead-code
    reason: 'http.sys reservation script, dead once Kestrel hosts (X10); 35 Part C''s dead-code item lists it.'
  'src/Catalog.Host/CertificateLocator.cs':
    class: scope
    resolved_by: supporting-item:dead-code
    reason: 'The host''s copy of a duplicated helper (X12), replaced by Kestrel''s certificate configuration; 35 Part C''s dead-code item lists X12.'
  'src/Catalog.Host/Controllers/UtilitiesController.cs':
    class: vocabulary
    resolved_by: out-of-scope
    reason: 'Resource naming: {type.resource} pluralises (Products, Orders, Accounts, FundsTransfers all match), but the hand analysis keeps Utility singular — it is not a collection. A naming choice, not a rule.'
  'src/Catalog.Host/Controllers/UtilityController.cs':
    class: vocabulary
    resolved_by: out-of-scope
    reason: 'The same controller, proposed as UtilitiesController.'
  'src/Catalog.Host/HostSettings.cs':
    class: scope
    resolved_by: supporting-item:configmanager-appsettings-read
    reason: 'Reads App.config through ConfigurationManager.AppSettings; replaced by appsettings.json and an options class. 35 Part C''s configmanager-appsettings-read item detects the read.'
  'src/Catalog.Host/HttpCallerIdentity.cs':
    class: scope
    resolved_by: supporting-item:wcf-security-context-read
    reason: 'Exists because OrderService reads ServiceSecurityContext. 35 Part C''s wcf-security-context-read item drives it, not an item''s impact rules.'
  'src/Catalog.Services/Connected Services/FundsTransferWS/Reference.cs':
    class: scope
    resolved_by: supporting-item:wcf-service-reference
    reason: 'The outbound SOAP proxy to FundsTransferWS stays SOAP but is regenerated with dotnet-svcutil on .NET 10: the Service References folder is deleted and the proxy regenerated into Connected Services (N11). No catalog item detects a service reference today; 35-RECIPE-WCF-SERVICE-REST.md Part C''s wcf-service-reference would.'
