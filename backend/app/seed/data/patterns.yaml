  # ---------------------------------------------------------------- 6
  - id: console-batch-job
    name: "Console batch application"
    summary: "Console executable run on a schedule, typically by Windows Task Scheduler."
    description: |
      Console application with a Main entry point performing batch work — file
      processing, data loads, report generation — invoked on a schedule rather than
      run continuously.
    legacy_stack: ".NET Framework 4.x or .NET Core 2.x console"
    category: batch
    typical_indicators: "OutputType Exe, Main entry point, no web packages, app.config, frequent use of local file paths and drive letters."
    known_risks: "Hardcoded Windows paths, drive-letter mappings, UNC shares and Windows-only scheduling assumptions. Scheduling itself moves out of the application and into the platform, which is a change of operational ownership as much as a code change."
    classification_role: PRIMARY
    classification_family: APPLICATION_TYPE
    classification_value: BATCH_APPLICATION
    priority: 30
    compatible_with: []
    conflicts_with: ["windows-service"]
    anchor_signals: ["MAIN_METHOD_ENTRY_POINT", "TOP_LEVEL_STATEMENTS_ENTRY_POINT"]
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred: {}
    thresholds:
      minimumScore: 50
      highConfidenceScore: 70
    rules_status: active
    required_signals_pending: []
    rules:
      # No signal registers "runs on a schedule" (registry has no
      # SCHEDULING_INDICATOR entries at all) — this pattern can only confirm
      # "plain console entry point, not a web/service host," never the
      # scheduling half of its own name. That gap is real, not yet
      # actionable as a required_signals_pending entry (no extractor is
      # named for it anywhere in the spec), so it's noted here in prose
      # instead of invented. Threshold lowered to 50 because there is no
      # supporting evidence source strong enough to reliably clear 70 —
      # JOBS_FOLDER/TASKS_FOLDER are a convention, not a guarantee.
      schema: signal-rules/1.0
      all: []
      any:
        - id: main-entry
          signal:
            name: MAIN_METHOD_ENTRY_POINT
        - id: toplevel-entry
          signal:
            name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
      atLeast: []
      supporting:
        - id: jobs-folder
          signal:
            name: JOBS_FOLDER
          weight: 15
        - id: tasks-folder
          signal:
            name: TASKS_FOLDER
          weight: 15
      none:
        - id: not-service-base
          signal:
            name: SERVICE_BASE_BASE_CLASS
          disqualify: true
        - id: not-servicebase-run
          signal:
            name: SERVICEBASE_RUN_ENTRY_POINT
          disqualify: true
        - id: not-web-builder
          signal:
            name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          disqualify: true
        - id: not-webhost-builder
          signal:
            name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        - id: not-global-asax
          signal:
            name: GLOBAL_ASAX_ENTRY_POINT
          disqualify: true
        - id: not-startup-class
          signal:
            name: STARTUP_CLASS_ENTRY_POINT
          disqualify: true
        - id: not-razor-file
          signal:
            name: RAZOR_FILE
          disqualify: true
        - id: not-cshtml-file
          signal:
            name: CSHTML_FILE
          disqualify: true
      # No frameworkFamily condition, deliberately: a console entry point is
      # the same shape on .NET Framework and on .NET, and it migrates the same
      # way (retarget, fix breaking changes). Splitting it by family would be
      # the version error's mirror image. The `none` disqualifiers above are
      # what actually guard it — they exclude every service, web and Razor
      # hosting model — and they hold on either family. Part C.
      metadata:
        # Desktop exclusion. A WinForms/WPF application has a `Main` like any
        # console app, so MAIN_METHOD_ENTRY_POINT alone matched all three
        # eShopWinForms projects here at score 50 — and their migration path
        # is nothing like a console worker's (Windows-only .NET, or a UI
        # rewrite; never a containerised OCP4 worker). OutputType WinExe is
        # the Windows GUI subsystem, which a console app never targets.
        #
        # This is a metadata exclusion rather than a `none` entry because
        # `none` only accepts signal conditions, and the registry has no
        # System.Windows.Forms / System.Windows / STAThread signals to
        # disqualify on — see winforms-desktop's required_signals_pending.
        # When DesktopUiExtractor lands, add those as `none` disqualifiers
        # here too, so the exclusion does not rest on OutputType alone.
        - id: not-desktop-exe
          field: outputType
          notEquals: WinExe
    target_states:
      - id: ocp4-cronjob-container
        name: "OCP4 CronJob container"
        summary: "Retarget to .NET 10, containerize, and schedule as an OpenShift CronJob."
        target_stack: ".NET 10 console + OCP4 CronJob"
        consumer_impact: low
        effort: medium
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: true
        is_recommended: true
        prerequisites: "Job is idempotent and safe to retry. File paths externalized to configuration."
        known_limitations: "Scheduling moves from Windows Task Scheduler to OpenShift, changing who owns the schedule. Local file dependencies must move to a mounted volume or object storage."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: partial
          scenarios: ["dotnet-upgrade"]
          skills: ["sdk-style-conversion", "configuration-migration"]
          gaps: ["containerization", "CronJob manifest generation", "Windows path remediation"]
          custom_skills_required: ["ocp4-container-packaging", "linux-remediation", "cronjob-manifest-generation"]
        playbook_md: |
          ## Steps
          1. Retarget to net10.0 and convert to SDK-style.
          2. Replace hardcoded paths with configuration; verify path separator and
             case-sensitivity assumptions.
          3. Ensure a non-zero exit code on failure so OpenShift can detect it.
          4. Emit structured logs to stdout.
          5. Generate the CronJob manifest with the schedule previously held in
             Windows Task Scheduler.

      - id: worker-service-container
        name: ".NET Worker Service container"
        summary: "Convert to a long-running Worker Service with an internal scheduler, deployed as a Deployment rather than a CronJob."
        target_stack: ".NET 10 Worker Service + OCP4 Deployment"
        consumer_impact: low
        effort: medium
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: false
        prerequisites: "Job frequency high enough that a persistently running pod is justified."
        known_limitations: "Consumes resources continuously. Scheduling logic moves into the application, which makes it less visible to platform operators than a CronJob."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: partial
          scenarios: ["dotnet-upgrade"]
          skills: ["sdk-style-conversion"]
          gaps: ["console-to-worker restructuring", "containerization"]
          custom_skills_required: ["worker-service-conversion", "ocp4-container-packaging"]
        playbook_md: |
          Prefer the CronJob option unless the job runs very frequently or needs to
          hold warm state between executions.

  # ------------------------------------------------- 6a / 6b (desktop UI)
  # Desktop applications are common in legacy .NET estates and were falling
  # through to console-batch-job on MAIN_METHOD_ENTRY_POINT alone, which
  # would bind them to a containerised OCP4 worker accelerator. Both
  # patterns below are detectable TODAY, but only partly: step 2 records
  # OutputType WinExe, and the registry has XAML_FILE, which separates WPF
  # from WinForms. What the registry does NOT have is any
  # System.Windows.Forms / System.Windows / PresentationFramework /
  # STAThread signal — FrameworkReferenceExtractor covered web, service and
  # data namespaces only. So detection here is confident about "this is a
  # Windows desktop app" and thin on positive framework evidence, which is
  # what required_signals_pending and matchWarnings record.
  - id: winforms-desktop
    name: "Windows Forms desktop application"
    summary: "Windows Forms desktop client — a Windows GUI executable with no XAML markup."
    description: |
      A Windows Forms application: `OutputType` of `WinExe` (the Windows GUI
      subsystem) with no XAML present. WinForms and WPF are separated by XAML
      alone until DesktopUiExtractor lands — a WinForms project has designer
      code and `System.Windows.Forms` references, neither of which step 3
      currently emits a signal for.

      **Not a console application.** It has a `Main` like one, which is why
      it previously matched console-batch-job, but nothing else about it is
      comparable: the UI toolkit is Windows-only, the migration target is
      Windows-only .NET or a UI rewrite, and it cannot be containerised for
      OCP4 at all.
    legacy_stack: "Windows Forms"
    category: desktop
    typical_indicators: "OutputType WinExe, Designer.cs files, System.Windows.Forms references, Form-derived classes, STAThread on Main."
    known_risks: "Windows-only for the life of the application unless the UI is rewritten. Third-party WinForms control suites are a common blocker and are frequently unsupported on modern .NET. No containerisation path on OCP4."
    classification_role: PRIMARY
    classification_family: APPLICATION_TYPE
    classification_value: WINFORMS_DESKTOP
    priority: 55
    compatible_with: []
    conflicts_with: ["console-batch-job", "wpf-desktop"]
    anchor_signals: []
    eligibility:
      fingerprintStatuses: ["COMPLETE", "PARTIAL"]
      excludedProjectRoles: ["TEST", "DEPLOYMENT"]
    analysis_requirements:
      required:
        fileDiscovery: true
      preferred: {}
    thresholds:
      # 50: OutputType alone is the whole detection, so the score is the base
      # score with nothing to lift it. Raise this once DesktopUiExtractor
      # gives real supporting evidence.
      minimumScore: 50
      highConfidenceScore: 90
    rules_status: active
    required_signals_pending:
      - signal_name: SYSTEM_WINDOWS_FORMS_NAMESPACE
        purpose: "Anchor signal — a using System.Windows.Forms directive, the positive evidence this pattern currently lacks"
        expected_extractor: DesktopUiExtractor
        blocking: true
      - signal_name: SYSTEM_WINDOWS_FORMS_ASSEMBLY
        purpose: "Raw Reference Include=System.Windows.Forms in a non-SDK project file"
        expected_extractor: DesktopUiExtractor
        blocking: false
      - signal_name: FORM_BASE_CLASS
        purpose: "A type deriving from Form — distinguishes a UI project from a WinExe with no forms"
        expected_extractor: DesktopUiExtractor
        blocking: false
      - signal_name: STA_THREAD_ATTRIBUTE
        purpose: "STAThread on Main, required by both WinForms and WPF entry points"
        expected_extractor: DesktopUiExtractor
        blocking: false
    rules:
      schema: signal-rules/1.0
      all: []
      any: []
      atLeast: []
      supporting: []
      none:
        # XAML separates this from wpf-desktop, and the rest are the
        # both-directions exclusions Part C requires against the web,
        # service and console shapes that also have a Main.
        - id: no-xaml
          signal:
            name: XAML_FILE
          disqualify: true
        - id: no-startup-class
          signal:
            name: STARTUP_CLASS_ENTRY_POINT
          disqualify: true
        - id: no-web-builder
          signal:
            name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-webhost-builder
          signal:
            name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          disqualify: true
        - id: no-global-asax
          signal:
            name: GLOBAL_ASAX_ENTRY_POINT
          disqualify: true
        - id: no-svc-file
          signal:
            name: SVC_FILE
          disqualify: true
        - id: no-service-base
          signal:
            name: SERVICE_BASE_BASE_CLASS
          disqualify: true
      metadata:
        - id: windows-gui-exe
          field: outputType
          equals: WinExe
      matchWarnings:
        - "Detected from OutputType WinExe and the absence of XAML; System.Windows.Forms evidence not yet available from step 3."
    target_states:
      - id: winforms-net-windows-retarget
        name: "Retarget to .NET (Windows-only), UI preserved"
        summary: "Move to the current .NET Windows Desktop target with the Windows Forms UI intact. Stays Windows-only and off OCP4."
        target_stack: ".NET 8+ Windows Desktop (net8.0-windows), Windows host"
        consumer_impact: none
        effort: medium
        linux_compatible: false
        container_ready: false
        is_lift_and_shift: true
        is_recommended: true
        prerequisites: "A Windows host remains available for build and run. Third-party control suites checked for modern .NET support before starting."
        known_limitations: "Does not reach OCP4 — Windows Forms has no Linux or container story. This option keeps the application supported, not portable."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: partial
          scenarios: ["dotnet-upgrade"]
          skills: ["sdk-style-conversion"]
          gaps: ["third-party control suite replacement", "designer file migration"]
          custom_skills_required: []
        playbook_md: |
          ## Steps
          1. Convert to an SDK-style project targeting `net8.0-windows` with
             `UseWindowsForms`.
          2. Inventory third-party control suites; confirm modern .NET support
             or plan replacements before proceeding.
          3. Work the build-fix loop, then verify the UI manually — there is
             no contract-parity harness for a desktop UI.
      - id: winforms-ui-rewrite
        name: "Rewrite UI for the web (Blazor) or cross-platform (MAUI)"
        summary: "Keep the domain logic, replace the Windows Forms UI. The only route to OCP4 for a desktop application."
        target_stack: "Blazor on ASP.NET Core (container on OCP4), or .NET MAUI"
        consumer_impact: high
        effort: high
        linux_compatible: true
        container_ready: true
        is_lift_and_shift: false
        is_recommended: false
        prerequisites: "Domain logic separable from the forms. User-facing change accepted by the business, with retraining planned."
        known_limitations: "A rewrite, not a migration — no accelerator covers the UI layer. Scope this from the business case, not from the code."
        engine_support:
          engine: github-copilot-app-modernization
          coverage: none
          scenarios: []
          skills: []
          gaps: ["UI rewrite is out of scope for every current engine"]
          custom_skills_required: ["blazor-ui-rewrite"]
        playbook_md: |
          ## Steps
          1. Extract domain and data access behind interfaces, leaving the
             forms as a thin shell.
          2. Characterisation-test the extracted logic before touching the UI.
          3. Rebuild the UI on the chosen target; retire the forms last.

