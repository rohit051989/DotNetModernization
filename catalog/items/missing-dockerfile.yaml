category: packaging
deleted: false
description: 'A deployable .NET application with no Dockerfile in its project directory or anywhere else in its repository: on modern .NET, or on .NET Framework (a conversion acts on it only when the application''s chosen approach moves it to the target framework in a container). A repository-level Dockerfile counts for every project in the repository.'
detection:
  match:
    all: []
    any:
    - id: web-host
      signal:
        name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
    - id: generic-host
      signal:
        name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
    - id: webhost
      signal:
        name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
    - id: main-method
      signal:
        name: MAIN_METHOD_ENTRY_POINT
    - id: top-level-statements
      signal:
        name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
    - id: svc-host
      signal:
        name: SVC_FILE
    - id: asmx-host
      signal:
        name: ASMX_FILE
    - id: aspx-host
      signal:
        name: ASPX_FILE
    - id: global-asax-host
      signal:
        name: GLOBAL_ASAX_FILE
    atLeast: []
    metadata:
    - field: frameworkFamily
      id: dotnet-application
      in:
      - net
      - net-core
      - net-framework
    - field: outputType
      id: not-desktop
      notEquals: WinExe
    - field: projectSdk
      id: not-blazor-webassembly
      notEquals: Microsoft.NET.Sdk.BlazorWebAssembly
    none:
    - id: has-dockerfile
      signal:
        name: DOCKERFILE_FILE
engine_guidance: |-
  This application has no Dockerfile, in its folder or anywhere else in the repository. On OpenShift it runs as a
  container image, so once it builds for the target framework it needs one: built by the pipeline, run as an
  arbitrary user, listening on an unprivileged port.
excluded_roles:
- DATABASE
- DEPLOYMENT
- LIBRARY
- TEST
id: missing-dockerfile
name: No Dockerfile
owner_team: null
resolutions:
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: 'Add a multi-stage Dockerfile: SDK image to build and publish, aspnet or runtime image to run, non-root user.'
  effort: low
  engine_guidance: |-
    Add a multi-stage Dockerfile beside the project, so the pipeline builds one image of this application.
    1. If the repository already has a Dockerfile for another application, follow its conventions: the same
       base image registry and tags, build arguments and layout. Never add a second Dockerfile for a project
       that has one.
    2. Build stage: the .NET SDK image for the target framework. Copy the project files and restore first
       (`dotnet restore`), then copy the sources and `dotnet publish -c Release -o /app/publish` for this
       project only.
    3. Run stage: the ASP.NET Core runtime image for a web application, or the .NET runtime image otherwise, for
       the target framework; copy only the published output.
    4. Run as a non-root user with a numeric id (`USER 1001`), and make every path the application writes to
       writable by group 0: OpenShift runs the container as an arbitrary user in group 0.
    5. Listen on an unprivileged port (8080), set with `ASPNETCORE_HTTP_PORTS` for a web application, and
       `EXPOSE` it.
    6. Take the base images' registry from a build argument (`ARG BASE_REGISTRY`), so the pipeline can use its
       own mirror; never a credential in the file.
    7. Add a `.dockerignore` that leaves out `bin/`, `obj/` and test output.
    8. Build the image if a container engine is available here; otherwise record in the task's notes that it was
       not built.
  id: multistage-dockerfile
  is_default: true
  linux_compatible: true
  name: Multi-stage Dockerfile
  notes: null
  phase: 5
  status: active
  target_description: Dockerfile beside the project, built by the pipeline
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: Build the image with dotnet publish /t:PublishContainer; no Dockerfile to maintain.
  effort: low
  id: sdk-container-publish
  is_default: false
  linux_compatible: true
  name: SDK container publish
  notes: Less control over the image layers; check it meets the platform's base-image policy.
  phase: 5
  status: active
  target_description: Container image from MSBuild properties in the project file
scope: application
status: active
