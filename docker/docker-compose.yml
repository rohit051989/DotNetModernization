# The local development database (01-ENVIRONMENT-SETUP.md section 2). PostgreSQL 17, the version the client runs.
# The credentials here are for this local container only; the platform reads DB_USER and DB_PASSWORD from its own
# environment (backend/.env, gitignored), never from this file.
services:
  catalog-db:
    image: postgres:17
    container_name: modernization-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog_dev_pw
      POSTGRES_DB: modernization_catalog
    ports:
      - "5433:5432"
    volumes:
      - catalog_pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d modernization_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # PostgreSQL 17. The PostgreSQL 16 volume, catalog_pgdata, is no longer used: it was kept, untouched, as the
  # backup of the move to 17 (2026-10-15).
  catalog_pgdata17:
