# Authored catalog items — 28-ITEM-AND-CONVERSION-MODEL.md Parts D to F.
# Client-agnostic master catalog IP. Items migrated from the pattern catalog
# are NOT here: app/items/pattern_migration.py moves those (Part Q).
#
# The first five are occurrence-scope items: patterns common in legacy .NET estates.
# Each can occur many times in one project (the Part O scope test), so each
# declares occurrence_source: which signal's evidence becomes one occurrence
# row per file. They were authored while their signals were still planned and
# promoted to ready on their own when step 3 batch 2 (registry 1.4.0) shipped
# the extractors.
#
# Three are absence items (missing-dockerfile, missing-health-endpoint,
# missing-ocp4-manifests): application scope, detected by a `none`
# condition over presence signals rather than by any "missing X" signal —
# step 3 emits no absence signals. They are also the test that
# repository-level signals reach per-project evaluation (28-ITEM-AND-
# CONVERSION-MODEL.md Part E): a Dockerfile or manifest at the repository
# root must count for every project in that repository.
#
# The last five are the generic package items (30-DEPENDENCY-ASSESSMENT.md Part D2), detected on the signals lifecycle step 6 emits.
#
# `state` is computed and must not appear in this file.

items:

  - id: serilog-file-sink
    name: "Serilog file sink writing to a Windows path"
    scope: occurrence
    category: logging
    description: >-
      A Serilog File sink configured with a Windows drive-letter or UNC path.
      On OCP4 the path does not exist and logs belong on stdout for EFK. A
      repository often repeats the same path across many appsettings files, one
      per environment or host. One occurrence per appsettings file, so a batching:
      all approach can treat the set as one coherent change.

      Conversion ordering (docs/28 Part E): runs BEFORE hardcoded-windows-path.
      Removing the sink removes its path; reversed, a path about to be deleted
      gets externalised first and the work list carries a spurious occurrence.
      Becomes a depends_on entry.
    detection:
      match:
        all:
          - id: file-sink-windows-path
            signal:
              name: SERILOG_FILE_SINK_CONFIG
              value:
                regex: '^([A-Za-z]:[\\/]|\\\\)'
      occurrence_source:
        signal: SERILOG_FILE_SINK_CONFIG
        group_by: source_path
    resolutions:
      - id: console-json-only
        name: "Console JSON only"
        description: "Remove the file sink; keep the console sink with CompactJsonFormatter for EFK."
        target_description: "Serilog console sink, CompactJsonFormatter, stdout collected by EFK"
        consumer_impact: low
        effort: low
        is_default: true
      - id: otlp-exporter
        name: "OpenTelemetry exporter"
        description: "Replace the file sink with an OpenTelemetry log exporter."
        target_description: "Serilog.Sinks.OpenTelemetry to the platform collector"
        consumer_impact: medium
        effort: medium

  - id: hardcoded-windows-path
    name: "Hardcoded Windows path literal"
    scope: occurrence
    category: configuration
    description: >-
      A C:\, G:\ or UNC path literal in C# source or a configuration value.
      None of these exist in a Linux container. Overlaps serilog-file-sink by
      design: a Serilog sink path is also a path literal. Conversion ordering
      (depends_on) resolves the overlap, detection does not.

      Conversion ordering (docs/28 Part E): runs AFTER serilog-file-sink, whose
      removal takes the sink's path with it; its occurrences here are then gone
      rather than externalised. Becomes a depends_on entry. Also runs AFTER
      wcf-service-host's move to an ASP.NET Core web host where that applies:
      a path in a Web Deploy SetParam file is fixed in the
      appsettings.{Environment}.json the host conversion moved it to.
    detection:
      match:
        all:
          - id: windows-path-literal
            signal:
              name: WINDOWS_PATH_LITERAL
      occurrence_source:
        signal: WINDOWS_PATH_LITERAL
        group_by: source_path
    resolutions:
      - id: externalize-path-setting
        name: "Externalize to configuration"
        description: "Replace the literal with a configuration key; the environment supplies a Linux path (ConfigMap or env var)."
        target_description: "IConfiguration / IOptions setting, value set per environment"
        consumer_impact: low
        effort: medium
        is_default: true
      - id: rewrite-linux-mount-path
        name: "Rewrite to a mounted Linux path"
        description: "Rewrite the literal to a fixed path under a volume mounted into the pod."
        target_description: "Literal /mnt/<volume>/... backed by a PVC"
        consumer_impact: low
        effort: low
        notes: "Faster, but leaves a literal behind; the path is now fixed to the deployment manifest."

  - id: encoding-default
    name: "Encoding.Default, which differs on Linux"
    scope: occurrence
    category: framework
    description: >-
      Encoding.Default is the machine's ANSI code page on .NET Framework but
      always UTF-8 on .NET Core and later, on every OS. Code that reads or
      writes files, sockets or byte arrays through it changes behaviour for
      any non-ASCII character after migration.
    detection:
      match:
        all:
          - id: encoding-default
            signal:
              name: ENCODING_DEFAULT_USAGE
      occurrence_source:
        signal: ENCODING_DEFAULT_USAGE
        group_by: source_path
    resolutions:
      - id: explicit-legacy-code-page
        name: "Explicit legacy code page"
        description: "Register CodePagesEncodingProvider and use Encoding.GetEncoding(<code page>) so bytes match the Windows servers exactly."
        target_description: "System.Text.Encoding.CodePages, code page from the source servers (typically 1252)"
        consumer_impact: none
        effort: low
        is_default: true
      - id: explicit-utf8
        name: "Explicit UTF-8"
        description: "Replace with Encoding.UTF8 (or UTF8Encoding without BOM) and migrate any stored data that depends on the old code page."
        target_description: "UTF-8 everywhere"
        consumer_impact: medium
        effort: medium

  - id: datetime-now-usage
    name: "DateTime.Now rather than UtcNow"
    scope: occurrence
    category: framework
    description: >-
      DateTime.Now and DateTime.Today return host-local time. On the Windows
      servers that is the site time zone; in a default Linux container it is
      UTC, so timestamps, schedules and date boundaries shift silently after
      migration.
    detection:
      match:
        all:
          - id: datetime-now
            signal:
              name: DATETIME_NOW_USAGE
      occurrence_source:
        signal: DATETIME_NOW_USAGE
        group_by: source_path
    resolutions:
      - id: container-local-timezone
        name: "Set the container time zone"
        description: "Keep the code; set TZ in the container to the source servers' zone so Now means what it did."
        target_description: "TZ environment variable plus tzdata in the image"
        consumer_impact: none
        effort: low
        is_default: true
        notes: "Lift-and-shift. Leaves the underlying local-time dependency in place."
      - id: utc-at-boundaries
        name: "UtcNow internally, convert at the edges"
        description: "Replace with DateTime.UtcNow (or an injected TimeProvider) and convert to local time only for display."
        target_description: "UTC throughout; TimeProvider for testability"
        consumer_impact: medium
        effort: high

  - id: system-drawing-common
    name: "System.Drawing, unsupported on Linux"
    scope: occurrence
    category: dependencies
    description: >-
      System.Drawing.Common is Windows-only from .NET 6 (the Unix support
      switch was removed in .NET 7). On .NET Framework the same types come
      from the in-box System.Drawing assembly, so there may be no package at
      all; detection keys on the Windows-only GDI+ types used in code, or the
      package. Deliberately not on SYSTEM_DRAWING_NAMESPACE: that namespace
      also holds the cross-platform Color, Point and Size types, so it flags
      files that are fine on Linux. One occurrence per file using a GDI+
      type. A project with only the package and no usage matches but has no
      located occurrence: the fix there is removing a dead reference.
    detection:
      match:
        any:
          - id: gdi-type-usage
            signal:
              name: SYSTEM_DRAWING_USAGE
          - id: system-drawing-common-package
            signal:
              name: SYSTEM_DRAWING_COMMON_PACKAGE
      occurrence_source:
        signal: SYSTEM_DRAWING_USAGE
        group_by: source_path
    resolutions:
      - id: imagesharp-replacement
        name: "Replace with ImageSharp"
        description: "Port imaging code to SixLabors.ImageSharp."
        target_description: "SixLabors.ImageSharp (cross-platform, managed)"
        consumer_impact: low
        effort: medium
        is_default: true
        notes: "Check the Six Labors split licence for commercial use before adopting."
      - id: skiasharp-replacement
        name: "Replace with SkiaSharp"
        description: "Port imaging and drawing code to SkiaSharp."
        target_description: "SkiaSharp with native Linux assets in the image"
        consumer_impact: low
        effort: high
      - id: system-drawing-common-remain-windows-hosted
        name: "Remain Windows-hosted"
        description: "Out of scope for the Linux move; the application stays on Windows."
        target_description: ".NET on Windows Server"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false

  # ---- Hosting shape (application scope) ----
  #
  # Four items describe how a .NET host runs, from most to least specific:
  # windows-service-hosting > modern-worker-service > interactive-console-tool
  # > console-batch-job. Each
  # less specific item carries `none` conditions over the more specific
  # items' positive signals, so a project matches exactly one of them
  # (28-ITEM-AND-CONVERSION-MODEL.md Part E "Overlapping items").
  # console-batch-job is migrated, so its exclusions live in
  # app/items/pattern_migration.py AMENDMENTS.

  - id: windows-service-hosting
    name: "Application hosts as a Windows Service"
    scope: application
    category: hosting
    description: >-
      A .NET generic host that runs as a Windows Service through
      Microsoft.Extensions.Hosting.WindowsServices: UseWindowsService() or
      AddWindowsService(), or the package referenced. The Service Control
      Manager does not exist in a container. The docs/28 Part O J2 worked
      example. The .NET Framework ServiceBase shape is the migrated
      windows-service item instead.
    excluded_roles: [TEST, LIBRARY, DATABASE, DEPLOYMENT]
    detection:
      match:
        any:
          - id: uses-windows-service
            signal:
              name: USE_WINDOWS_SERVICE_INVOCATION
          - id: windowsservices-package
            signal:
              name: MICROSOFT_EXTENSIONS_HOSTING_WINDOWSSERVICES_PACKAGE
    resolutions:
      - id: generic-host-deployment
        name: "Generic host as an OCP4 Deployment"
        description: "Remove UseWindowsService() and the WindowsServices package; keep the generic host and run it as a Deployment (replicas=1 for a single-consumer processor)."
        target_description: "Generic host in a container, OCP4 Deployment"
        consumer_impact: low
        effort: low
        is_default: true
      - id: generic-host-cronjob
        name: "Generic host as an OCP4 CronJob"
        description: "For a service that only does timed work: run the host to completion on a schedule instead of continuously."
        target_description: "Generic host in a container, OCP4 CronJob"
        consumer_impact: medium
        effort: medium
      - id: windows-service-hosting-remain-windows-hosted
        name: "Remain Windows-hosted"
        description: "Out of scope for the Linux move; the service stays on Windows."
        target_description: ".NET on Windows Server, as a Windows Service"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false

  - id: modern-worker-service
    name: "Worker service built on hosted services"
    scope: application
    category: hosting
    description: >-
      A .NET worker whose work runs in BackgroundService / IHostedService
      implementations registered with AddHostedService, and which is not
      hosted as a Windows Service. It still needs containerising, and without
      this item it was indistinguishable from a console app. Web hosts are
      excluded: an ASP.NET Core application running a background task is a
      web application, not a worker.
    excluded_roles: [TEST, LIBRARY, DATABASE, DEPLOYMENT]
    detection:
      match:
        any:
          - id: background-service
            signal:
              name: BACKGROUND_SERVICE_BASE_CLASS
          - id: ihosted-service
            signal:
              name: IHOSTED_SERVICE_BASE_CLASS
          - id: add-hosted-service
            signal:
              name: ADD_HOSTED_SERVICE_ENTRY_POINT
        none:
          # windows-service-hosting takes precedence: both of its signals.
          - id: not-use-windows-service
            signal:
              name: USE_WINDOWS_SERVICE_INVOCATION
          - id: not-windowsservices-package
            signal:
              name: MICROSOFT_EXTENSIONS_HOSTING_WINDOWSSERVICES_PACKAGE
          - id: not-web-builder
            signal:
              name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          - id: not-webhost-builder
            signal:
              name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          - id: not-startup-class
            signal:
              name: STARTUP_CLASS_ENTRY_POINT
    resolutions:
      - id: ocp4-deployment
        name: "OCP4 Deployment (continuous)"
        description: "Containerise the worker and run it continuously as a Deployment; for queue and stream consumers such as Kafka processors."
        target_description: "Worker in a container, OCP4 Deployment"
        consumer_impact: none
        effort: low
        is_default: true
      - id: ocp4-cronjob
        name: "OCP4 CronJob (scheduled)"
        description: "For a worker that polls on a timer: run it to completion on a schedule instead of looping in-process."
        target_description: "Worker in a container, OCP4 CronJob"
        consumer_impact: medium
        effort: medium

  # interactive-console-tool sits between modern-worker-service and
  # console-batch-job: a console application that needs a person at the
  # keyboard is a tool, not a batch job. Keyboard input that needs a person
  # (INTERACTIVE_CONSOLE_INPUT) is definitive — a scheduled job has no one to
  # answer it, and Console.ReadKey throws without a console. A discarded
  # "Press ENTER to exit" read (CONSOLE_PAUSE_FOR_INPUT) is not: it returns at
  # once without a console, so it does not move a project off
  # console-batch-job.

  - id: interactive-console-tool
    name: "Interactive console tool"
    scope: application
    category: hosting
    description: >-
      A console application that needs a person at the keyboard: it reads a
      key (Console.ReadKey), uses what is typed (Console.ReadLine or Read
      whose result is used), or prompts with a library such as
      Spectre.Console or Sharprompt. It is a developer, test or operations
      tool, not a deployable workload — a CronJob or a worker Deployment has
      no one to answer it. A console application that only pauses ("Press
      ENTER to exit") and otherwise runs unattended is console-batch-job,
      whose "Not a deployable workload" resolution covers a tool detection
      cannot tell apart.
    excluded_roles: [TEST]
    detection:
      match:
        all:
          - id: interactive-input
            signal:
              name: INTERACTIVE_CONSOLE_INPUT
        any:
          - id: main-entry
            signal:
              name: MAIN_METHOD_ENTRY_POINT
          - id: toplevel-entry
            signal:
              name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
        metadata:
          - id: not-desktop-exe
            field: outputType
            notEquals: WinExe
        none:
          # Every more specific hosting shape takes precedence, exactly as
          # for console-batch-job: services, workers, web and WCF hosts, and
          # anything step 4 says the project exposes.
          - id: not-service-base
            signal:
              name: SERVICE_BASE_BASE_CLASS
          - id: not-servicebase-run
            signal:
              name: SERVICEBASE_RUN_ENTRY_POINT
          - id: not-web-builder
            signal:
              name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          - id: not-webhost-builder
            signal:
              name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          - id: not-global-asax
            signal:
              name: GLOBAL_ASAX_ENTRY_POINT
          - id: not-startup-class
            signal:
              name: STARTUP_CLASS_ENTRY_POINT
          - id: not-razor-file
            signal:
              name: RAZOR_FILE
          - id: not-cshtml-file
            signal:
              name: CSHTML_FILE
          - id: not-background-service
            signal:
              name: BACKGROUND_SERVICE_BASE_CLASS
          - id: not-ihosted-service
            signal:
              name: IHOSTED_SERVICE_BASE_CLASS
          - id: not-add-hosted-service
            signal:
              name: ADD_HOSTED_SERVICE_ENTRY_POINT
          - id: not-use-windows-service
            signal:
              name: USE_WINDOWS_SERVICE_INVOCATION
          - id: not-windowsservices-package
            signal:
              name: MICROSOFT_EXTENSIONS_HOSTING_WINDOWSSERVICES_PACKAGE
          - id: not-wcf-host
            signal:
              name: HOSTS_WCF_SERVICE
          - id: not-exposes-wcf-service
            signal:
              name: EXPOSES_WCF_SERVICE
          - id: not-exposes-http-api
            signal:
              name: EXPOSES_HTTP_API
          - id: not-exposes-asmx-service
            signal:
              name: EXPOSES_ASMX_SERVICE
          - id: not-exposes-grpc-service
            signal:
              name: EXPOSES_GRPC_SERVICE
          - id: not-exposes-webforms-ui
            signal:
              name: EXPOSES_WEBFORMS_UI
    resolutions:
      - id: interactive-tool-keep-not-deployed
        name: "Keep as a developer or operations tool, not deployed"
        description: "The tool stays in the repository, built and run by hand by developers or operators. It is not part of the OCP4 deployment."
        target_description: "Run by hand outside OCP4; retargeted only if its own build needs it"
        consumer_impact: none
        effort: low
        is_default: true
      - id: interactive-tool-retire
        name: "Retire"
        description: "Nobody needs the tool after the migration: remove it from the repository and the build."
        target_description: "Removed"
        consumer_impact: none
        effort: low
      - id: interactive-tool-automated-test
        name: "Convert to an automated test"
        description: "What a person checks by running the tool becomes an automated integration or smoke test that runs in the pipeline, with no keyboard input."
        target_description: "Automated test in the CI pipeline"
        consumer_impact: none
        effort: medium
      - id: interactive-tool-ops-container
        name: "Containerise as an operations tool"
        description: "Build an image operators run on demand inside the cluster, attached to a terminal (oc run -it, or a debug pod), for tasks that must run next to the services."
        target_description: "On-demand image run with stdin and a TTY; never a Deployment or CronJob"
        consumer_impact: none
        effort: medium
        notes: "The pod needs stdin: true and tty: true, or every read sees end of input."

  # ---- Absence items (application scope, `none` over presence signals) ----
  #
  # "Deployable application" is expressed with entry-point signals, since
  # step 2 records no project SDK. .NET Framework projects are excluded by
  # metadata: they cannot run in a Linux container at all, and their
  # framework item comes first; the absence items apply after conversion,
  # on the next scan. excluded_roles records intent for step 6, which
  # computes roles (Part D).

  - id: missing-dockerfile
    name: "No Dockerfile"
    scope: application
    category: packaging
    description: >-
      A deployable .NET (Core) application with no Dockerfile in its project
      directory or anywhere else in its repository. A repository-level
      Dockerfile counts for every project in the repository.
    excluded_roles: [TEST, LIBRARY, DATABASE, DEPLOYMENT]
    detection:
      match:
        any:
          - id: web-host
            signal:
              name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          - id: generic-host
            signal:
              name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          - id: webhost
            signal:
              name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          - id: main-method
            signal:
              name: MAIN_METHOD_ENTRY_POINT
          - id: top-level-statements
            signal:
              name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
        none:
          - id: has-dockerfile
            signal:
              name: DOCKERFILE_FILE
        metadata:
          - id: modern-dotnet
            field: frameworkFamily
            in: [net, net-core]
          # A desktop application needs no Dockerfile, health endpoint or
          # OCP4 manifest: it does not run on the platform.
          - id: not-desktop
            field: outputType
            notEquals: WinExe
          # A Blazor WebAssembly client is static files served by another host:
          # it needs no container, manifests or health endpoint of its own.
          - id: not-blazor-webassembly
            field: projectSdk
            notEquals: Microsoft.NET.Sdk.BlazorWebAssembly
    resolutions:
      - id: multistage-dockerfile
        name: "Multi-stage Dockerfile"
        description: "Add a multi-stage Dockerfile: SDK image to build and publish, aspnet or runtime image to run, non-root user."
        target_description: "Dockerfile beside the project, built by the pipeline"
        consumer_impact: none
        effort: low
        is_default: true
      - id: sdk-container-publish
        name: "SDK container publish"
        description: "Build the image with dotnet publish /t:PublishContainer; no Dockerfile to maintain."
        target_description: "Container image from MSBuild properties in the project file"
        consumer_impact: none
        effort: low
        notes: "Less control over the image layers; check it meets the platform's base-image policy."

  - id: missing-health-endpoint
    name: "No health endpoint"
    scope: application
    category: hosting
    description: >-
      An ASP.NET Core application that exposes no health check endpoint, so
      OCP4 liveness and readiness probes have nothing meaningful to call.
      Keyed on ASP.NET Core host builders; a worker with no HTTP surface
      needs a different probe and is not this item.
    excluded_roles: [TEST, LIBRARY, DATABASE, DEPLOYMENT]
    detection:
      match:
        any:
          - id: web-host
            signal:
              name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          - id: webhost
            signal:
              name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          - id: startup-class
            signal:
              name: STARTUP_CLASS_ENTRY_POINT
        none:
          - id: has-health-endpoint
            signal:
              name: MAP_HEALTH_CHECKS_INVOCATION
        metadata:
          - id: modern-dotnet
            field: frameworkFamily
            in: [net, net-core]
          # A desktop application needs no Dockerfile, health endpoint or
          # OCP4 manifest: it does not run on the platform.
          - id: not-desktop
            field: outputType
            notEquals: WinExe
          # A Blazor WebAssembly client is static files served by another host:
          # it needs no container, manifests or health endpoint of its own.
          - id: not-blazor-webassembly
            field: projectSdk
            notEquals: Microsoft.NET.Sdk.BlazorWebAssembly
    resolutions:
      - id: aspnetcore-health-checks
        name: "ASP.NET Core health checks"
        description: "AddHealthChecks() plus separate liveness and readiness endpoints (MapHealthChecks), readiness checking the application's dependencies."
        target_description: "/health/live and /health/ready, wired to the OCP4 probes"
        consumer_impact: low
        effort: low
        is_default: true
      - id: tcp-socket-probe
        name: "TCP socket probe only"
        description: "No code change; the OCP4 probe checks that the port accepts connections."
        target_description: "tcpSocket liveness and readiness probes"
        consumer_impact: none
        effort: low
        notes: "Proves the process is listening, not that it can serve requests. Choosing health checks over this needs a forcing perspective (AVAILABILITY_RESILIENCE)."

  - id: missing-ocp4-manifests
    name: "No OpenShift deployment manifests"
    scope: application
    category: packaging
    description: >-
      A deployable .NET (Core) application with no Kubernetes/OpenShift
      manifest and no Helm chart in its project directory or anywhere else
      in its repository. A repository-level k8s/ or charts/ folder counts for
      every project in the repository.
    excluded_roles: [TEST, LIBRARY, DATABASE, DEPLOYMENT]
    detection:
      match:
        any:
          - id: web-host
            signal:
              name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
          - id: generic-host
            signal:
              name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          - id: webhost
            signal:
              name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
          - id: main-method
            signal:
              name: MAIN_METHOD_ENTRY_POINT
          - id: top-level-statements
            signal:
              name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
        none:
          - id: has-manifest
            signal:
              name: OCP4_MANIFEST_FILE
          - id: has-helm-chart
            signal:
              name: HELM_CHART_FILE
        metadata:
          - id: modern-dotnet
            field: frameworkFamily
            in: [net, net-core]
          # A desktop application needs no Dockerfile, health endpoint or
          # OCP4 manifest: it does not run on the platform.
          - id: not-desktop
            field: outputType
            notEquals: WinExe
          # A Blazor WebAssembly client is static files served by another host:
          # it needs no container, manifests or health endpoint of its own.
          - id: not-blazor-webassembly
            field: projectSdk
            notEquals: Microsoft.NET.Sdk.BlazorWebAssembly
    resolutions:
      - id: plain-manifests
        name: "Plain manifests"
        description: "Deployment, Service, Route and ConfigMap YAML for the application, kept beside the code."
        target_description: "OCP4 manifests applied by the pipeline"
        consumer_impact: none
        effort: low
        is_default: true
      - id: helm-chart
        name: "Helm chart"
        description: "A Helm chart with per-environment values files."
        target_description: "Chart deployed by the pipeline or GitOps"
        consumer_impact: none
        effort: medium

  # ---- Linux blockers and legacy service shapes ----
  #
  # From the signal-coverage review after step 3 batch 2. The three hard
  # blockers (registry, directory services, MSMQ) each offer
  # remain-windows-hosted with linux_compatible false: a legitimate client
  # answer, and choosing it on a Linux-targeted engagement raises the
  # decision warning by design.

  - id: wcf-nettcp-client
    name: "WCF client over NetTcp"
    scope: application
    category: integration
    description: >-
      The project calls a WCF service over NetTcp. NetTcp with Windows
      transport security has no Kerberos identity in a Linux container; it
      is the canonical Linux blocker. Exact, from the caller's own binding:
      a <client> endpoint whose binding is netTcpBinding, or a
      NetTcpBinding constructed in client code (a ClientBase<T> or
      ChannelFactory<T> file, including svcutil's generated Reference.cs).
      Deliberately not keyed on the System.ServiceModel.NetTcp package:
      Visual Studio and dotnet-svcutil add it to every WCF client whatever
      the binding, so it proves nothing. A project implementing a NetTcp
      service is wcf-service, and its host wcf-service-host, not this one; a
      project doing both matches both, correctly.

      An internal client — one calling a service inside this migration
      (dependency-and-context-map's integration edges) — follows that service's
      wcf-service decision where the decision settles it: a REST or gRPC
      rewrite derives "Migrate to the service's new protocol". CoreWCF keeps
      WCF and SOAP, so it settles nothing here: the client still needs a
      Linux-compatible binding, decided on its own. The derivations are
      declared on wcf-service's resolutions.
    excluded_roles: [TEST]
    detection:
      match:
        any:
          - id: client-endpoint-nettcp
            signal:
              name: WCF_CLIENT_BINDING_CONFIG
              value:
                equals: netTcpBinding
          - id: client-code-nettcp
            signal:
              name: WCF_CLIENT_BINDING_USAGE
              value:
                equals: System.ServiceModel.NetTcpBinding
    resolutions:
      - id: call-http-binding
        name: "Call an HTTP binding of the service"
        description: "Switch the client to a BasicHttp/WSHttp endpoint of the same service, which the service owner exposes if it does not already."
        target_description: "System.ServiceModel.Http client over HTTPS"
        consumer_impact: none
        effort: medium
        is_default: true
        notes: "Usually needs the backend team; the endpoint register (lifecycle step 10) groups the callers into one conversation."
        impact:
        - {id: client-code, from: seed, select: self, action: update, reason: A NetTcpBinding constructed in code becomes an HTTP binding}
        - {id: client-config, from: seed, traverse: config_elements, path: system.serviceModel/client, action: update, reason: The <client> endpoint switches to the service's HTTP address and binding}
        - {id: bindings-config, from: seed, traverse: config_elements, path: system.serviceModel/bindings, action: update, reason: netTcpBinding configuration becomes basicHttpsBinding or wsHttpBinding}
      - id: keep-nettcp-certificate-security
        name: "Keep NetTcp with non-Windows security"
        description: "Keep the NetTcp client on Linux with certificate or no transport security instead of Windows authentication."
        target_description: "System.ServiceModel.NetTcp client, certificate transport security"
        consumer_impact: none
        effort: low
        notes: "Only if the service accepts non-Windows credentials; verify before choosing."
      - id: wcf-nettcp-client-remain-windows-hosted
        name: "Remain Windows-hosted"
        description: "Out of scope for the Linux move; the application stays on Windows."
        target_description: ".NET on Windows Server"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false
        impact:
        - {id: evidence, from: seed, select: self, action: review, reason: 'Stays on Windows: nothing structural changes. Listed so the work item stays visible, not to imply edits'}
      - id: migrate-to-service-protocol
        name: "Migrate to the service's new protocol"
        description: "The service is inside this migration and is being rewritten to a new protocol (REST or gRPC): move the client to the new protocol, in the same coordinated change."
        target_description: "A REST or gRPC client of the rewritten service"
        consumer_impact: low
        effort: medium
        notes: "For internal clients only — a service owned outside the migration is a conversation, not a coordinated change (call-http-binding). Derived from the service's wcf-service decision."
        impact:
        - {id: client-code, from: seed, select: self, action: rewrite, reason: The WCF client is replaced by a client of the service's new protocol}
        - {id: proxy, from: seed, traverse: convention_files, kind: reference, action: delete, reason: The svcutil-generated proxy goes with the WCF client}
        - {id: client-config, from: seed, traverse: config_elements, path: system.serviceModel/client, action: update, reason: 'Remove the <client> endpoints: they go with the WCF client'}
        - {id: project, from: seed, traverse: project_file, action: update, reason: WCF client packages are replaced by the new protocol's client packages}

  # ---- Architecture: what a project exposes and hosts (lifecycle step 4) ----
  #
  # Detected on step 4's architecture signals (registry 1.8.0), which put a
  # service together across projects: contracts, implementation, ServiceHost
  # and .svc files usually live in different projects, so no single project's
  # step 3 signals ever showed the whole service. wcf-service replaces the
  # migrated wcf-iis-servicemodel (app/items/architecture_items.py repoints its
  # decisions and soft-deletes it), and wcf-service-host is the process side.

  - id: wcf-service
    name: "WCF service"
    scope: application
    category: integration
    description: >-
      The project implements a WCF service contract (System.ServiceModel),
      wherever the contract is declared and however the service is hosted —
      ServiceHost in a console or Windows Service, IIS .svc files (including a
      folder with no project file), or both. The hosting is recorded as the
      occurrence's attribute; the host project carries wcf-service-host.
      Frequently consumed by callers whose contracts cannot change, so the
      lowest-impact option, CoreWCF, is the default; the rewrites change every
      caller. Each resolution declares what it means for the dependent items
      (`derivations`, 28-ITEM Part U): the host (wcf-service-host), internal
      clients (wcf-nettcp-client) and a framework retarget on the same
      project (fx47-class-library).
    excluded_roles: [TEST]
    detection:
      match:
        any:
          - id: implements-wcf-service
            signal:
              name: EXPOSES_WCF_SERVICE
        metadata:
          - id: legacy-framework
            field: frameworkFamily
            equals: net-framework
      attribute:
        signal: WCF_SERVICE_HOSTING
        label: hosting
    resolutions:
      - id: wcf-service-corewcf
        name: "CoreWCF on .NET 10"
        description: "Port to CoreWCF, preserving service contracts, bindings and the published WSDL."
        target_description: ".NET 10 + CoreWCF, container on OCP4"
        consumer_impact: none
        effort: medium
        is_default: true
        notes: "Prerequisites: bindings in use must be supported by CoreWCF; capture a WSDL snapshot before migrating. Known limitations: not every WCF binding is supported — WS-* protocols, MSMQ transport and some Windows-integrated security modes need case-by-case assessment; Windows authentication needs an alternative on Linux."
        derivations:
          - item: wcf-service-host
            action: derive
            resolution: wcf-host-aspnetcore-web-host
            reason: "CoreWCF runs inside ASP.NET Core: the process hosting the service becomes an ASP.NET Core web host."
          - item: wcf-nettcp-client
            action: not_derived
            reason: "CoreWCF keeps WCF and SOAP, so the client keeps calling WCF: it still needs a Linux-compatible binding (an HTTP binding, or NetTcp without Windows security). Decide it on its own."
          - item: fx47-class-library
            action: subsume
            reason: "CoreWCF on .NET 10 moves this project to the engagement framework: a separate framework retarget is no further work."
        impact:
        - {id: impl, from: seed, select: self, action: update, reason: 'Retargeted to CoreWCF: the implementation is kept; namespaces and the host change'}
        - id: contracts
          from: impl
          traverse: implemented_interfaces
          filter: {has_attribute: ServiceContract}
          action: update
          reason: Service contract kept; System.ServiceModel attributes resolve from CoreWCF
        - id: data-contracts
          from: contracts
          traverse: signature_types
          filter: {has_attribute: DataContract}
          action: review
          reason: DataContract serialization is kept; check for types or behaviours CoreWCF does not support
        - {id: svc, from: impl, traverse: convention_files, kind: svc, action: delete, reason: '.svc activation does not exist in CoreWCF: services are registered in the ASP.NET Core host'}
        - {id: service-config, from: impl, traverse: config_elements, path: system.serviceModel/services, action: update, reason: <service> registration moves into the ASP.NET Core host's CoreWCF configuration}
        - id: tests
          from: [impl, contracts]
          traverse: referencing_tests
          action: review
          reason: Tests use the same contract; check how they create the service or channel
        - {id: clients, from: contracts, traverse: client_call_sites, action: review, reason: Callers keep SOAP; check their address and binding against the CoreWCF endpoint}
      - id: wcf-service-rest-rewrite
        name: "REST rewrite on .NET 10"
        description: "Rewrite as a conventional REST API on ASP.NET Core, retiring SOAP entirely."
        target_description: ".NET 10 + ASP.NET Core, container on OCP4"
        consumer_impact: high
        effort: high
        notes: "Prerequisites: every consumer able to change; resource model designed and agreed. Known limitations: the largest change of the three; SOAP faults, message-level security and transactional semantics have no direct REST equivalent."
        derivations:
          - item: wcf-service-host
            action: derive
            resolution: wcf-host-aspnetcore-web-host
            reason: "A REST API runs in ASP.NET Core: the process hosting the service becomes an ASP.NET Core web host."
          - item: wcf-nettcp-client
            action: derive
            resolution: migrate-to-service-protocol
            applies_to: internal_clients
            reason: "The service stops speaking WCF: an internal client moves to its REST API in the same coordinated change."
          - item: fx47-class-library
            action: subsume
            reason: "The rewrite targets .NET 10 by definition: a separate framework retarget is no further work."
        impact:
        - {id: impl, from: seed, select: self, action: update, reason: 'The service class stays, called by thin controllers: WCF-only APIs (ServiceBehavior, FaultException<T>, ServiceSecurityContext) are swapped; business logic is unchanged'}
        - id: contracts
          from: impl
          traverse: implemented_interfaces
          filter: {has_attribute: ServiceContract}
          action: update
          reason: '[ServiceContract], [OperationContract] and [FaultContract] are removed: the interface stays as the service interface the controllers call'
        - {id: contracts-project, from: contracts, traverse: project_file, action: update, reason: 'The contracts project drops its System.ServiceModel references and is retargeted to .NET 10'}
        - id: data-contracts
          from: contracts
          traverse: signature_types
          filter: {has_attribute: DataContract}
          action: review
          reason: 'DataContract types serialize to JSON as they are; check member names against the JSON naming policy (PropertyNamingPolicy = null keeps them)'
        - id: fault-exception
          create: 'Exception type replacing FaultException<T>, mapped to an HTTP status by the host'
          for_each: contracts
          proposed_path: '{node.project.dir}/Faults/ServiceFaultException.cs'
          action: create
        - {id: svc, from: impl, traverse: convention_files, kind: svc, action: delete, reason: .svc activation goes with WCF}
        - {id: service-config, from: impl, traverse: config_elements, path: system.serviceModel/services, action: update, reason: 'Remove the <service> registration: it goes with WCF'}
        - id: tests
          from: [impl, contracts]
          traverse: referencing_tests
          action: update
          reason: Tests call the service through its WCF contract; they move to the controllers
        - {id: hosts, from: contracts, traverse: hosting_project, action: none, reason: 'The project hosting each contract (HOSTS_WCF_SERVICE): where its controller and the fault filter go'}
        - id: controllers
          create: 'REST controller per service contract: thin, one action per operation, calling the service interface'
          for_each: hosts
          proposed_path: '{node.project.dir}/Controllers/{type.resource}Controller.cs'
          action: create
        - id: fault-filter
          create: 'Filter mapping ServiceFaultException<T> to its HTTP status, with the fault as the body'
          for_each: hosts
          proposed_path: '{node.project.dir}/Errors/ServiceFaultExceptionFilter.cs'
          action: create
        - {id: clients, from: contracts, traverse: client_call_sites, action: rewrite, reason: Callers move from the WCF client to the REST API}
      - id: wcf-service-grpc-rewrite
        name: "gRPC rewrite on .NET 10"
        description: "Rewrite as a contract-first gRPC service."
        target_description: ".NET 10 + gRPC, container on OCP4"
        consumer_impact: high
        effort: high
        notes: "Prerequisites: every consumer able to adopt a gRPC client; HTTP/2 through the OCP4 ingress path. Known limitations: all callers must change — only viable where consumers are internal and in scope for coordinated change."
        derivations:
          - item: wcf-service-host
            action: derive
            resolution: wcf-host-aspnetcore-web-host
            reason: "gRPC on .NET runs in ASP.NET Core: the process hosting the service becomes an ASP.NET Core web host."
          - item: wcf-nettcp-client
            action: derive
            resolution: migrate-to-service-protocol
            applies_to: internal_clients
            reason: "The service stops speaking WCF: an internal client moves to a gRPC client in the same coordinated change."
          - item: fx47-class-library
            action: subsume
            reason: "The rewrite targets .NET 10 by definition: a separate framework retarget is no further work."
        impact:
        - {id: impl, from: seed, select: self, action: rewrite, reason: Service implementation becomes a gRPC service implementation}
        - id: contracts
          from: impl
          traverse: implemented_interfaces
          filter: {has_attribute: ServiceContract}
          action: delete
          reason: WCF service contract is replaced by a .proto service definition
        - id: data-contracts
          from: contracts
          traverse: signature_types
          filter: {has_attribute: DataContract}
          action: rewrite
          reason: DataContracts become protobuf messages, generated from the .proto file
        - {id: svc, from: impl, traverse: convention_files, kind: svc, action: delete, reason: .svc activation goes with WCF}
        - {id: service-config, from: impl, traverse: config_elements, path: system.serviceModel/services, action: update, reason: 'Remove the <service> registration: it goes with WCF'}
        - id: tests
          from: [impl, contracts]
          traverse: referencing_tests
          action: update
          reason: Tests call the service through its WCF contract; they move to the gRPC client
        - {id: protos, create: .proto service definition per service contract, for_each: contracts, proposed_path: '{project.dir}/Protos/{type.base_name}.proto', action: create}
        - {id: clients, from: contracts, traverse: client_call_sites, action: rewrite, reason: Callers move from the WCF client to a gRPC client}
      - id: wcf-service-remain-windows-hosted
        name: "Remain Windows-hosted"
        description: "Out of scope for the Linux move; the service stays on .NET Framework WCF on Windows."
        target_description: ".NET Framework WCF on Windows Server"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false
        derivations:
          - item: wcf-service-host
            action: not_derived
            reason: "The service stays where it is, so its decision does not settle the host: usually it stays Windows-hosted too, but decide it on its own."
          - item: wcf-nettcp-client
            action: not_derived
            reason: "The service keeps its WCF bindings on Windows: whether the client can still reach it from Linux (an HTTP binding, or NetTcp without Windows security) is the client's own decision."
          - item: fx47-class-library
            action: not_subsumed
            reason: "Staying on Windows does not move this project to the engagement framework: a retarget, if wanted, is separate work."
        impact:
        - {id: evidence, from: seed, select: self, action: review, reason: 'Stays on Windows: nothing structural changes. Listed so the work item stays visible, not to imply edits'}

  - id: wcf-service-host
    name: "WCF service host"
    scope: application
    category: hosting
    description: >-
      The project is the process a WCF service runs in: it constructs a
      ServiceHost (or CoreWCF host) or holds the service's .svc file. Not a
      batch job and not the service's implementation — that is wcf-service,
      usually on another project. The host follows the service's decision
      where it settles the question: CoreWCF, REST and gRPC all run in ASP.NET
      Core, so each derives "ASP.NET Core web host"; a service that remains
      Windows-hosted leaves the host to be decided on its own.

      Conversion ordering (docs/28 Part E): the ASP.NET Core web host's
      configuration migration runs FIRST: each environment's values move from
      the Web Deploy SetParam files into appsettings.{Environment}.json and the
      SetParam files are deleted. Fixes to those values (hardcoded-windows-path,
      unqualified-hostname) then apply where the values now live. Becomes a
      depends_on entry on theirs.
    excluded_roles: [TEST]
    detection:
      match:
        any:
          - id: hosts-wcf-service
            signal:
              name: HOSTS_WCF_SERVICE
    resolutions:
      - id: wcf-host-aspnetcore-web-host
        name: "ASP.NET Core web host"
        description: "Replace the ServiceHost or IIS hosting with an ASP.NET Core application on .NET 10 (Kestrel) that hosts the service's new endpoints — CoreWCF, REST or gRPC."
        target_description: ".NET 10 ASP.NET Core web host, container on OCP4"
        consumer_impact: low
        effort: medium
        is_default: true
        impact:
        - {id: host, from: seed, select: self, filter: {extension: .cs}, action: rewrite, reason: A self-hosted ServiceHost process becomes an ASP.NET Core host (Program.cs with Kestrel)}
        - {id: svc-activation, from: seed, select: self, filter: {extension: .svc}, action: delete, reason: 'IIS .svc activation is obsolete: the ASP.NET Core host registers the service'}
        - id: host-entry-point
          create: ASP.NET Core host entry point (Kestrel) replacing IIS .svc activation
          for_each: svc-activation
          proposed_path: '{project.dir}/Program.cs'
          action: create
        - {id: project, from: seed, traverse: project_file, action: update, reason: Becomes an SDK-style Microsoft.NET.Sdk.Web project on .NET 10}
        - {id: host-config, from: seed, traverse: config_elements, path: system.serviceModel, action: update, reason: system.serviceModel hosting configuration moves into the ASP.NET Core host}
        - {id: app-config, from: seed, traverse: project_files, pattern: App.config, action: delete, reason: 'ASP.NET Core does not read App.config: its settings move to appsettings.json'}
        - {id: web-deploy-parameters, from: seed, traverse: project_files, pattern: Parameters.xml, action: delete, reason: 'Web Deploy parameters are replaced by appsettings.{Environment}.json'}
        - {id: deploy-parameters, from: seed, traverse: deploy_parameter_files, action: delete, reason: 'Web Deploy SetParam files are replaced by appsettings.{Environment}.json, which ASPNETCORE_ENVIRONMENT selects'}
        - id: environment-settings
          create: 'Per-environment settings: the values the SetParam file held'
          for_each: deploy-parameters
          proposed_path: '{project.dir}/appsettings.{node.environment}.json'
          action: create
        - id: appsettings
          create: 'ASP.NET Core configuration: Kestrel endpoints and the settings App.config held'
          for_each: project
          proposed_path: '{project.dir}/appsettings.json'
          action: create
        - id: launch-settings
          create: Local launch profile (ASPNETCORE_ENVIRONMENT)
          for_each: project
          proposed_path: '{project.dir}/Properties/launchSettings.json'
          action: create
      - id: wcf-host-retire
        name: "Retire the host"
        description: "The re-platformed services each get their own ASP.NET Core project; this host is removed."
        target_description: "No separate host process"
        consumer_impact: low
        effort: low
      - id: wcf-host-remain-windows-hosted
        name: "Remain Windows-hosted"
        description: "Out of scope for the Linux move; the host stays on Windows."
        target_description: ".NET Framework on Windows Server"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false
        impact:
        - {id: evidence, from: seed, select: self, action: review, reason: 'Stays on Windows: nothing structural changes. Listed so the work item stays visible, not to imply edits'}

  - id: windows-auth-connection-string
    name: "Connection string using Windows authentication"
    scope: occurrence
    category: data-access
    description: >-
      A connection string authenticating with the process's Windows identity
      (Integrated Security / SSPI / Trusted_Connection). A container has no
      domain identity, so the connection fails on OCP4. One occurrence per
      connection string per file (environment variants included). Only the
      connection string's name is ever recorded (docs/21 Part G).

      Conversion ordering (docs/28 Part E): runs BEFORE sensitive-config-key.
      Fix the authentication in the config file first, then move the connection
      string to an OCP4 Secret; reversed, this fix would have to edit a Secret
      instead of a file, needing different allowed_paths and a different
      approach. Becomes a depends_on entry.
    excluded_roles: [TEST]
    detection:
      match:
        all:
          - id: windows-auth-connection
            signal:
              name: WINDOWS_AUTH_CONNECTION_STRING_CONFIG
      occurrence_source:
        signal: WINDOWS_AUTH_CONNECTION_STRING_CONFIG
        group_by: source_path_and_value
    resolutions:
      - id: sql-auth-from-secret
        name: "SQL authentication from an OCP4 Secret"
        description: "Switch to a SQL login; user and password come from an OCP4 Secret injected at runtime, never from the config file."
        target_description: "User ID/Password from a Secret, Integrated Security removed"
        consumer_impact: low
        effort: low
        is_default: true
      - id: kerberos-keytab
        name: "Kerberos in the container"
        description: "Keep Windows authentication by giving the pod a Kerberos identity: keytab from a Secret, krb5.conf, and a ticket-renewal sidecar."
        target_description: "Kerberos-authenticated SqlClient on Linux"
        consumer_impact: none
        effort: high
        notes: "Preserves the database's existing permissions model. Needs the directory team for the service account and SPN."

  - id: registry-access
    name: "Windows registry access"
    scope: occurrence
    category: configuration
    description: >-
      Code reading or writing the Windows registry (Microsoft.Win32.Registry,
      RegistryKey.OpenBaseKey). It throws PlatformNotSupportedException on
      Linux. One occurrence per file.
    detection:
      match:
        all:
          - id: registry-access
            signal:
              name: REGISTRY_ACCESS_USAGE
      occurrence_source:
        signal: REGISTRY_ACCESS_USAGE
        group_by: source_path
    resolutions:
      - id: move-to-configuration
        name: "Move to configuration"
        description: "Replace registry reads with IConfiguration (ConfigMap, env vars, Secret); drop writes or move them to a store the application owns."
        target_description: "IConfiguration / IOptions"
        consumer_impact: low
        effort: medium
        is_default: true
      - id: registry-access-remain-windows-hosted
        name: "Remain Windows-hosted (out of scope)"
        description: "Out of scope for the Linux move; the application stays on Windows."
        target_description: ".NET on Windows Server"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false

  - id: directory-services-usage
    name: "System.DirectoryServices (Active Directory) usage"
    scope: occurrence
    category: security
    description: >-
      Code using System.DirectoryServices or
      System.DirectoryServices.AccountManagement (DirectoryEntry,
      DirectorySearcher, PrincipalContext), which is Windows-only.
      System.DirectoryServices.Protocols is not flagged: it works on Linux,
      and is the usual target. One occurrence per file.
    detection:
      match:
        all:
          - id: directory-services
            signal:
              name: DIRECTORY_SERVICES_USAGE
      occurrence_source:
        signal: DIRECTORY_SERVICES_USAGE
        group_by: source_path
    resolutions:
      - id: ldap-protocols
        name: "Port to System.DirectoryServices.Protocols"
        description: "Rewrite the lookups against LdapConnection, which runs on Linux; bind with a service account from an OCP4 Secret."
        target_description: "System.DirectoryServices.Protocols (LDAP)"
        consumer_impact: low
        effort: medium
        is_default: true
      - id: identity-provider-claims
        name: "Use identity provider claims"
        description: "Stop querying the directory at runtime; take users and groups from the identity provider's token claims."
        target_description: "OIDC claims from the platform identity provider"
        consumer_impact: medium
        effort: high
      - id: directory-services-usage-remain-windows-hosted
        name: "Remain Windows-hosted (out of scope)"
        description: "Out of scope for the Linux move; the application stays on Windows."
        target_description: ".NET on Windows Server"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false

  - id: msmq-usage
    name: "MSMQ (System.Messaging)"
    scope: application
    category: integration
    description: >-
      The project sends or receives through MSMQ (System.Messaging). MSMQ
      exists neither on Linux nor on .NET Core, so this blocks both the
      framework move and the platform move. One decision per project; the
      producer and consumer ends of each queue must move together.
    excluded_roles: [TEST]
    detection:
      match:
        any:
          - id: messaging-namespace
            signal:
              name: SYSTEM_MESSAGING_NAMESPACE
          - id: messaging-assembly
            signal:
              name: SYSTEM_MESSAGING_ASSEMBLY
    resolutions:
      - id: migrate-to-message-broker
        name: "Migrate to the platform message broker"
        description: "Replace the queues with the engagement's broker (Kafka, AMQ or RabbitMQ), moving producers and consumers together."
        target_description: "Broker client on .NET, queue topology recreated on the broker"
        consumer_impact: medium
        effort: high
        is_default: true
      - id: msmq-usage-remain-windows-hosted
        name: "Remain Windows-hosted (out of scope)"
        description: "Out of scope for the Linux move; the application and its queues stay on Windows."
        target_description: ".NET Framework on Windows Server with MSMQ"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false

  - id: asmx-service
    name: "ASMX web service"
    scope: application
    category: integration
    description: >-
      An ASP.NET (.asmx) SOAP web service. It has no .NET Core equivalent.
      Converting it is one decision per project, like WCF, even when the
      project has several .asmx files. It can sit alongside Web Forms or MVC
      in the same project: those are separate items, since converting the UI
      does not convert the service.
    excluded_roles: [TEST]
    detection:
      match:
        any:
          - id: asmx-file
            signal:
              name: ASMX_FILE
          - id: web-method
            signal:
              name: WEB_METHOD_ATTRIBUTE
          # Step 4's resolved web methods (registry 1.8.0): code-behind in
          # App_Code or a library is split from the .asmx file.
          - id: exposes-asmx-service
            signal:
              name: EXPOSES_ASMX_SERVICE
    resolutions:
      - id: corewcf-basichttp
        name: "CoreWCF with BasicHttpBinding"
        description: "Re-host the operations on CoreWCF with BasicHttpBinding, preserving the SOAP contract and WSDL for existing callers."
        target_description: "CoreWCF on .NET 10, BasicHttpBinding"
        consumer_impact: none
        effort: medium
        is_default: true
        impact:
        - {id: code-behind, from: seed, select: self, filter: {extension: .cs}, action: rewrite, reason: '[WebMethod] operations become a CoreWCF service contract and implementation'}
        - {id: asmx-evidence, from: seed, select: self, filter: {extension: .asmx}, action: delete, reason: .asmx activation goes with ASP.NET Web Services}
        - {id: asmx, from: code-behind, traverse: convention_files, kind: asmx, action: delete, reason: .asmx activation goes with ASP.NET Web Services}
        - {id: project, from: seed, traverse: project_file, action: update, reason: CoreWCF packages added; retargeted}
        - {id: tests, from: code-behind, traverse: referencing_tests, action: update, reason: Tests of the web service target the CoreWCF service}
      - id: rest-api-rewrite
        name: "Rewrite as a REST API"
        description: "Replace the SOAP operations with ASP.NET Core HTTP endpoints; every caller changes."
        target_description: "ASP.NET Core minimal API or controllers"
        consumer_impact: high
        effort: medium
        impact:
        - {id: code-behind, from: seed, select: self, filter: {extension: .cs}, action: rewrite, reason: '[WebMethod] operations become REST controller actions'}
        - {id: asmx-evidence, from: seed, select: self, filter: {extension: .asmx}, action: delete, reason: .asmx activation goes with ASP.NET Web Services}
        - {id: asmx, from: code-behind, traverse: convention_files, kind: asmx, action: delete, reason: .asmx activation goes with ASP.NET Web Services}
        - {id: project, from: seed, traverse: project_file, action: update, reason: Becomes an ASP.NET Core project}
        - {id: tests, from: code-behind, traverse: referencing_tests, action: update, reason: Tests of the web service move to the controllers}

  - id: sensitive-config-key
    name: "Secret in a configuration file"
    scope: occurrence
    category: security
    description: >-
      A configuration key whose name marks it as secret (password, token,
      apikey, connectionString and similar), in web.config, app.config or
      appsettings*.json. Only the key's presence is recorded, never its
      value (docs/21 Part G). On OCP4 secrets come from Secrets, not files.
      High-volume, low-judgement: it fires on nearly every project and the
      resolution is nearly always the same, so it is a strong candidate for
      fully deterministic conversion. One occurrence per key per file. An
      XML connection string also fires here (its connectionString
      attribute), at the same location as windows-auth-connection-string
      when that applies; conversion ordering resolves the overlap.

      Conversion ordering (docs/28 Part E): runs AFTER
      windows-auth-connection-string, so a connection string's authentication
      is fixed in the file before the string moves to a Secret. Becomes a
      depends_on entry.
    excluded_roles: [TEST]
    detection:
      match:
        all:
          - id: sensitive-key
            signal:
              name: SENSITIVE_CONFIG_KEY
      occurrence_source:
        signal: SENSITIVE_CONFIG_KEY
        group_by: source_path_and_value
    resolutions:
      - id: ocp4-secret-injection
        name: "OCP4 Secret, injected at runtime"
        description: "Remove the value from the file; supply it from an OCP4 Secret as an environment variable or mounted file, bound through IConfiguration under the same key."
        target_description: "Kubernetes Secret -> environment variable / volume -> IConfiguration"
        consumer_impact: none
        effort: low
        is_default: true
      - id: external-secret-store
        name: "External secret store"
        description: "Resolve the value from the engagement's secret store (Vault, via Agent injection or the External Secrets operator) instead of a platform Secret."
        target_description: "Vault-sourced secret, delivered to the pod"
        consumer_impact: none
        effort: medium

  - id: unqualified-hostname
    name: "Endpoint URL on an unqualified hostname"
    scope: occurrence
    category: configuration
    description: >-
      An endpoint URL whose host is a single label, such as
      http://appsrv0341/FundsTransferWS/FundsTransferWS.asmx — in C# source, a
      configuration value or a Web Deploy SetParameters value. On Windows the
      name resolves through NetBIOS or the DNS suffix search list; in an
      OpenShift container it resolves only if the cluster's DNS search domains
      cover it. Linux verdict: requires_change (outbound-invocation-inventory
      marks the environment binding the same way). One occurrence per host per
      file, so each environment's SetParam file that names the host is its own
      occurrence. localhost and IP addresses are not matched.

      Conversion ordering (docs/28 Part E): runs AFTER wcf-service-host's move
      to an ASP.NET Core web host where that applies: a hostname in a Web Deploy
      SetParam file is fixed in the appsettings.{Environment}.json the host
      conversion moved it to. Becomes a depends_on entry.
    excluded_roles: [TEST]
    detection:
      match:
        all:
          - id: unqualified-host
            signal:
              name: UNQUALIFIED_HOSTNAME_URL
      occurrence_source:
        signal: UNQUALIFIED_HOSTNAME_URL
        group_by: source_path_and_value
    resolutions:
      - id: fully-qualify-hostname
        name: "Use the fully qualified name"
        description: "Replace the single-label host with its fully qualified DNS name in the URL, in every environment's configuration."
        target_description: "http://appsrv0341.corp.example.com/... (FQDN)"
        consumer_impact: none
        effort: low
        is_default: true
      - id: cluster-dns-search-domain
        name: "Add the domain to the pod's DNS search list"
        description: "Keep the short name and add the corporate DNS suffix to the pod's dnsConfig.searches (or the cluster DNS forwarding), so it resolves as on Windows."
        target_description: "Pod dnsConfig.searches includes the corporate domain"
        consumer_impact: none
        effort: low
        notes: "Platform-level change; every workload relying on it depends on cluster configuration staying in place."

  # ---- Hosting and container readiness (registry 1.11.0) ----
  #
  # Presence is not readiness: missing-dockerfile and missing-ocp4-manifests
  # fire when the files are absent; these fire when files that exist would be
  # refused or broken by OpenShift's restricted security context constraint,
  # which runs every container as an arbitrary non-root UID in group 0. The
  # signals are read from Dockerfiles and manifests anywhere in the repository,
  # and a repository-level file counts for every project in it.

  - id: aspnetcore-iis-hosting
    name: "ASP.NET Core hosted in IIS"
    scope: application
    category: hosting
    description: >-
      An ASP.NET Core application hosted behind IIS through the ASP.NET Core
      Module, in-process or out-of-process: a project file's
      AspNetCoreHostingModel, a web.config aspNetCore element or module
      handler, or a UseIIS / UseIISIntegration call. In a container nothing of
      this applies: there is no IIS, Kestrel serves directly, and it must
      listen on the container's port. The web.config is ignored on Linux, so
      leaving it does not fail, but in-process-only behaviour (IIS
      authentication, IISServerOptions, the ANCM startup timeout, request
      limits set in web.config) silently disappears.
    excluded_roles: [TEST, LIBRARY, DATABASE]
    detection:
      match:
        any:
          - id: hosting-model
            signal:
              name: ASPNETCORE_HOSTING_MODEL
          - id: use-iis
            signal:
              name: USE_IIS_INVOCATION
          - id: aspnetcore-module-config
            signal:
              name: ASPNETCORE_CONFIG
    resolutions:
      - id: kestrel-on-container-port
        name: "Kestrel on the container's port"
        description: "Remove the IIS hosting configuration: the AspNetCoreHostingModel property, the web.config aspNetCore element and module handler, and UseIIS / UseIISIntegration calls. Kestrel listens on the container's unprivileged port, set by ASPNETCORE_HTTP_PORTS=8080 in the image; anything IIS did (request limits, Windows authentication) moves to Kestrel options or the route."
        target_description: "Kestrel listening on 8080 in the container, behind the OpenShift route"
        consumer_impact: none
        effort: low
        is_default: true
      - id: keep-iis-for-windows-hosts
        name: "Keep IIS hosting for remaining Windows hosts"
        description: "Keep the web.config and the IIS integration for Windows servers that stay during the migration, and bind Kestrel to the container's port as well. IIS-only behaviour must be checked in both hosts."
        target_description: "One build that runs under IIS on Windows and on Kestrel in the container"
        consumer_impact: none
        effort: medium
        notes: "Two hosting models to keep equivalent until the last Windows host is retired."

  - id: container-runs-as-root
    name: "Container runs as root"
    scope: application
    category: packaging
    description: >-
      An existing Dockerfile whose final stage never switches to a non-root
      user, or switches to root; or a manifest that sets runAsUser: 0,
      runAsNonRoot: false, privileged: true or allowPrivilegeEscalation: true.
      OpenShift's restricted security context constraint refuses the pod, or
      overrides the user so that what root could write no longer is.
    excluded_roles: [TEST, LIBRARY, DATABASE]
    detection:
      match:
        all:
          - id: runs-as-root
            signal:
              name: CONTAINER_RUNS_AS_ROOT
    resolutions:
      - id: non-root-numeric-user
        name: "Run as a numeric non-root user"
        description: "End the final stage with USER 1001 (or the base image's app user, by UID), and remove privileged settings from the manifests. Nothing the application writes may need root."
        target_description: "USER 1001 in the image; the restricted SCC assigns the run-time UID"
        consumer_impact: none
        effort: low
        is_default: true
      - id: dedicated-scc
        name: "Grant a dedicated security context constraint"
        description: "Keep the image as it is and have the platform team grant the service account an SCC that allows its user (anyuid, or a custom one)."
        target_description: "A service account bound to a non-restricted SCC"
        consumer_impact: none
        effort: medium
        notes: "A platform exception: needs the cluster owners' approval, and is often refused."

  - id: container-privileged-port
    name: "Container binds a privileged port"
    scope: application
    category: packaging
    description: >-
      An existing Dockerfile or manifest binds a port below 1024: EXPOSE 80,
      ASPNETCORE_URLS=http://+:80, ASPNETCORE_HTTP_PORTS=80, or a
      containerPort below 1024. A non-root process cannot bind it, so under
      OpenShift's restricted policy the application fails to start.
    excluded_roles: [TEST, LIBRARY, DATABASE]
    detection:
      match:
        all:
          - id: privileged-port
            signal:
              name: CONTAINER_PRIVILEGED_PORT
    resolutions:
      - id: unprivileged-port-8080
        name: "Listen on 8080"
        description: "Set ASPNETCORE_HTTP_PORTS=8080 (or ASPNETCORE_URLS=http://+:8080) and EXPOSE 8080 in the image, containerPort 8080 in the manifests; the Service maps its port 80 to targetPort 8080 so callers see no change."
        target_description: "Kestrel on 8080; Service port 80 -> targetPort 8080"
        consumer_impact: none
        effort: low
        is_default: true
      - id: net-bind-service-capability
        name: "Grant NET_BIND_SERVICE"
        description: "Keep the port and add the NET_BIND_SERVICE capability through an SCC that allows it."
        target_description: "Port below 1024 with a granted capability"
        consumer_impact: none
        effort: medium
        notes: "A platform exception, like a dedicated SCC."

  - id: container-fixed-user-writable-path
    name: "Writable path owned by a fixed user"
    scope: application
    category: packaging
    description: >-
      Writable paths that assume a fixed user: in the final stage, a chown to
      an owner whose group is not 0, or an owner-only chmod (700, 600), with no
      later chmod giving group 0 the owner's rights; or a manifest's fixed
      runAsUser or fsGroup. OpenShift runs the image as an arbitrary UID that
      is a member of group 0, so the path is not writable at run time and the
      fixed IDs fall outside the namespace's allowed range.
    excluded_roles: [TEST, LIBRARY, DATABASE]
    detection:
      match:
        all:
          - id: fixed-user-path
            signal:
              name: CONTAINER_FIXED_USER_WRITABLE_PATH
    resolutions:
      - id: group-zero-writable
        name: "Group 0 owns writable paths"
        description: "chown -R 1001:0 the writable paths and chmod -R g=u them, so any UID in group 0 has the owner's rights; remove fixed runAsUser and fsGroup values from the manifests and let the SCC assign them."
        target_description: "Paths owned by 1001:0 with g=u; IDs assigned by the namespace"
        consumer_impact: none
        effort: low
        is_default: true
      - id: writable-volume
        name: "Write to a mounted volume"
        description: "Move what the application writes to an emptyDir or persistent volume mounted at that path; the platform makes it writable for the pod's UID."
        target_description: "emptyDir or PVC mounted at the writable path"
        consumer_impact: none
        effort: low

  # ---- Gaps the first Copilot pilot run exposed (registry 1.12.0) ----

  - id: enterprise-vault-secret-reference
    name: "Secret read from Enterprise Vault"
    scope: occurrence
    category: security
    description: >-
      A configuration value that is an Enterprise.Vault reference, vault:<name>: a connection
      string, a signing key, a client secret, a certificate or its key. At start-up
      AddEnterpriseVaultSecrets replaces each reference with the contents of the file <name> in the
      secrets directory: ENTERPRISE_VAULT_SECRETS_DIR, else a Windows default, else /vault/secrets.
      The file holds a reference, not the secret, so a key holding one is this item and never
      sensitive-config-key. On OpenShift the directory must be filled at deployment, one file per
      referenced name. One occurrence per key per file.
    excluded_roles: [TEST]
    detection:
      match:
        all:
          - id: vault-reference
            signal:
              name: VAULT_SECRET_REFERENCE
      occurrence_source:
        signal: VAULT_SECRET_REFERENCE
        group_by: source_path_and_value
    resolutions:
      - id: vault-agent-files
        name: "Vault Agent writes the secrets as files"
        description: "Keep the vault: references and Enterprise.Vault. The Vault Agent injector writes each referenced secret as a file named after it into /vault/secrets, and ENTERPRISE_VAULT_SECRETS_DIR points there."
        target_description: "Vault Agent injector annotations on the Deployment; ENTERPRISE_VAULT_SECRETS_DIR=/vault/secrets"
        consumer_impact: none
        effort: low
        is_default: true
      - id: openshift-secret-files
        name: "OpenShift Secret mounted as the secrets directory"
        description: "Keep the vault: references and Enterprise.Vault. An OpenShift Secret (synced from Vault by the External Secrets operator, or created by the platform team) holds one key per referenced name and is mounted as the secrets directory."
        target_description: "Secret volume at /vault/secrets; ENTERPRISE_VAULT_SECRETS_DIR=/vault/secrets"
        consumer_impact: none
        effort: low
      - id: environment-secrets
        name: "Replace the references with Secret environment variables"
        description: "Remove each vault: reference and Enterprise.Vault; each value comes from an OpenShift Secret as an environment variable under its configuration key."
        target_description: "Kubernetes Secret -> environment variable -> IConfiguration"
        consumer_impact: none
        effort: medium
      # Chosen, without a decision, when the repository's deployment files already deliver the secrets
      # (app.engine.deployment_assets): a working mechanism is kept, never replaced (Part N).
      - id: keep-existing-vault-delivery
        name: "Keep the repository's existing vault delivery"
        description: "The deployment files already deliver the vault secrets on OpenShift: an init container, the Vault Agent injector, a CSI secrets store or an external-secrets sync. Keep it as it is, and make sure every reference is delivered by it."
        target_description: "The repository's own vault delivery, unchanged"
        consumer_impact: none
        effort: low

  - id: unparseable-config-file
    name: "Configuration file that cannot be parsed"
    scope: occurrence
    category: configuration
    description: >-
      An appsettings*.json, web.config or app.config that cannot be parsed: typically a Windows path
      written with single backslashes in a JSON string. The application fails to start with it, and
      discovery could read nothing in it, so its paths, secrets and connection strings are not among
      the work items until it is fixed. AccountsApi's two utilities had one each. One occurrence per
      file.

      Conversion ordering (docs/28 Part E): runs BEFORE hardcoded-windows-path, whose places in the
      file can be seen only once it parses.
    excluded_roles: [TEST]
    detection:
      match:
        all:
          - id: unparseable
            signal:
              name: CONFIG_FILE_UNPARSEABLE
      occurrence_source:
        signal: CONFIG_FILE_UNPARSEABLE
        group_by: source_path
    resolutions:
      - id: fix-config-syntax
        name: "Correct the file's syntax"
        description: "Make the file valid without changing any value's meaning: escape backslashes in JSON strings."
        target_description: "A configuration file that parses"
        consumer_impact: none
        effort: low
        is_default: true
      - id: remove-unused-config-file
        name: "Remove the file"
        description: "Where nothing loads the file, delete it."
        target_description: "No such file"
        consumer_impact: none
        effort: low

  - id: custom-file-logger-provider
    name: "Custom logging provider writing files"
    scope: occurrence
    category: logging
    description: >-
      A class implementing ILoggerProvider that writes log files (AccountsApi's FileLoggerProvider),
      the hand-written counterpart of a Serilog file sink. In a container the files are lost with
      the pod and nothing collects them; logs belong on standard output. One occurrence per provider.

      Conversion ordering (docs/28 Part E): runs BEFORE hardcoded-windows-path. Removing the
      provider removes its log directory setting with it.
    excluded_roles: [TEST]
    detection:
      match:
        all:
          - id: file-logger-provider
            signal:
              name: CUSTOM_FILE_LOGGER_PROVIDER
      occurrence_source:
        signal: CUSTOM_FILE_LOGGER_PROVIDER
        group_by: source_path_and_value
    resolutions:
      # The default keeps the class: its tests use it, and no instruction may conflict with "never delete a test"
      # (36-COPILOT-ENHANCED-CONVERSION Part N, conversion 2 of AccountsApi.Net10).
      - id: unregister-file-logger-provider
        name: "Unregister the provider; keep the class and its tests"
        description: "Remove the provider's registration, so nothing writes log files and the console provider writes to standard output. The class and its tests stay, unchanged."
        target_description: "Console logging only, collected from standard output; the provider class unused"
        consumer_impact: none
        effort: low
        is_default: true
      - id: remove-file-logger-provider
        name: "Remove the provider and its tests; log to standard output"
        description: "Remove the provider, its registration, its configuration and the tests that use it; the console provider writes to standard output. Removes tests, so only a decision chooses it, naming them."
        target_description: "Console logging only, collected from standard output"
        consumer_impact: none
        effort: low
      - id: file-logger-to-stdout
        name: "Keep the provider, writing to standard output"
        description: "Keep the provider's format, and write each line to standard output instead of a file."
        target_description: "The same provider, writing to standard output"
        consumer_impact: none
        effort: low

  - id: windows-build-pipeline
    name: "Build and pipeline files that assume Windows"
    scope: application
    category: packaging
    description: >-
      Windows batch scripts (.bat, .cmd), CI workflows that run on Windows agents or call Windows
      workflows, and Jenkinsfiles with Windows agent labels or bat / powershell steps. They build on
      Windows what is to run in a Linux container, and an OpenShift build pipeline runs on Linux.
      A repository-level file counts for every deployable project.
    excluded_roles: [TEST, LIBRARY, DATABASE]
    detection:
      match:
        all:
          - id: windows-build
            signal:
              name: WINDOWS_BUILD_PIPELINE
    resolutions:
      - id: linux-build-pipeline
        name: "Build on Linux agents"
        description: "Add a shell script beside each batch script and Linux jobs beside the Windows ones, and build the container image in the pipeline. The Windows scripts and jobs stay until cutover: only a decision removes them."
        target_description: "dotnet CLI on Linux agents; container image built by the pipeline"
        consumer_impact: none
        effort: medium
        is_default: true
      - id: keep-windows-build-agents
        name: "Keep the Windows agents"
        description: "Keep building on Windows: publish for linux-x64 and build the container image with a Linux builder the pipeline calls."
        target_description: "Windows agents publishing linux-x64; image built on a Linux builder"
        consumer_impact: none
        effort: low

  # ---- Package dependencies (lifecycle step 6, dependency-assessment) ----
  #
  # Generic and parameterised by package: never one item per library, which
  # would turn the catalog into a package index (30-DEPENDENCY-ASSESSMENT.md Part D2). The package is in the signal value, so
  # group_by source_path_and_value makes two packages in one project file
  # two occurrences. The signals come from step 6, not step 3, and reach
  # item-detection through fingerprint_signals like any other signal.

  - id: target-framework-retarget
    name: "Modern .NET below the target framework"
    scope: application
    category: framework
    description: >-
      The project targets a modern .NET (net5.0 or later) below the engagement's
      target framework. Converted by editing the target framework where it is
      declared — the project file or an imported Directory.*.props
      (solution-discovery's target_framework_source) — not by assuming the
      project file.

      Detected on TARGET_FRAMEWORK_BELOW_ENGAGEMENT_TARGET, which
      dependency-assessment emits from 1.4.0 at the line that declares the
      framework. The conversion recipe framework-retarget binds here
      (34-CONVERSION-ARCHITECTURE.md C1), and a plan takes the framework
      declarations from solution-discovery directly.

      Conversion ordering: package bumps are ordered around it by framework
      support — a version that drops the current framework after it, a current
      version that does not support the target before it.

      Framework deltas: it carries the known breaking changes between source
      and target frameworks (backend/app/conversion/framework_deltas.yaml,
      34-CONVERSION-ARCHITECTURE.md C6), each detected in discovery as a signal
      and fixed by a unit before the retarget that builds on both frameworks.
      First entry, from net10.0: a project referencing two web projects with
      top-level statements and naming Program no longer compiles (CS0433,
      AMBIGUOUS_TOP_LEVEL_PROGRAM_ON_NET10).
    detection:
      match:
        all:
          - id: below-target
            signal:
              name: TARGET_FRAMEWORK_BELOW_ENGAGEMENT_TARGET
    resolutions:
      - id: retarget-to-engagement-target
        name: "Retarget to the target framework"
        description: "Edit the target framework where it is declared, and the SDK pin in global.json to match."
        target_description: "The engagement's target framework, e.g. net10.0"
        consumer_impact: none
        effort: low
        is_default: true
      - id: stay-on-current-framework
        name: "Stay on the current framework"
        description: "Leave the target framework as it is, for now: the current framework is still supported, and something holds the application back (a package with no target-framework version, a platform constraint). Record the reason and the current framework's support end date."
        target_description: "The current target framework, unchanged"
        consumer_impact: none
        effort: low

  - id: package-upgrade-safe
    name: "Package upgrade, no code change"
    scope: occurrence
    category: dependencies
    description: >-
      A direct NuGet package has a newer version that supports the target
      framework, and the upgrade changes nothing the code calls: by API diff
      of the two versions' assemblies; because it is a build, tools, analyzer
      or content package with no compile-time assemblies; or, where no diff
      was possible, because the version change is minor or patch. A content
      package (bootstrap, jQuery) moving a major version may still break
      markup or CSS, which step 6 cannot see: the Dependencies view flags it
      "content breaking possible". One occurrence per project per package, at
      the PackageReference line; the value reads "{id} {from} -> {to}".

      Conversion ordering (docs/28 Part E): for the same package, runs as ONE
      UNIT with package-upgrade-breaking. Bump the version everywhere, then
      fix the call sites. One package can be safe in one project and
      breaking in another; bumping only the safe projects splits the solution
      across two versions of the same library.
    detection:
      match:
        all:
          - id: upgrade-safe
            signal:
              name: PACKAGE_UPGRADE_SAFE
      occurrence_source:
        signal: PACKAGE_UPGRADE_SAFE
        group_by: source_path_and_value
    resolutions:
      - id: package-upgrade-safe-bump
        name: "Bump to the recommended version"
        description: "Change the version to step 6's recommended version: the latest that supports the target framework."
        target_description: "The recommended package version, from the authoritative feed"
        consumer_impact: none
        effort: low
        is_default: true
        impact:
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
      - id: package-upgrade-safe-keep-current
        name: "Keep the current version"
        description: "Leave the version as it is: it already supports the target framework, and nothing forces the move."
        target_description: "The current package version, unchanged"
        consumer_impact: none
        effort: low

  - id: package-upgrade-breaking
    name: "Package upgrade that breaks calling code"
    scope: occurrence
    category: dependencies
    description: >-
      A direct NuGet package's recommended version removes or changes public
      members the code calls. One occurrence per affected file; the value
      names the package, both versions and the changed member, and the
      evidence carries each call site. Call sites are matched by syntax, so a
      site is likely rather than certain, and a call that an unchanged
      overload could equally take is "possible" (ambiguous), not confirmed.
      Only runtime packages, with lib/ or ref/ assemblies, can be breaking.
      Where no API diff was possible and the change is a major version,
      semver presumes a break and the occurrence sits at the PackageReference
      line, call sites not determined.

      Conversion ordering (docs/28 Part E): for the same package, runs as ONE
      UNIT with package-upgrade-safe. Bump the version everywhere, then fix
      the call sites. Fixing call sites first writes against an API
      the project does not reference yet; bumping alone leaves the build
      broken in between.
    detection:
      match:
        all:
          - id: upgrade-breaking
            signal:
              name: PACKAGE_UPGRADE_BREAKING
      occurrence_source:
        signal: PACKAGE_UPGRADE_BREAKING
        group_by: source_path
    resolutions:
      - id: package-upgrade-breaking-bump-and-adapt
        name: "Bump and adapt the call sites"
        description: "Bump to the recommended version, then change each listed call site to the new API, in the same change."
        target_description: "The recommended package version, calling code adapted"
        consumer_impact: low
        effort: medium
        is_default: true
        impact:
        - {id: call-sites, from: seed, select: self, action: update, reason: Call sites of the changed members are adapted to the new version}
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
      - id: package-upgrade-breaking-replace
        name: "Replace the package"
        description: "Where the new major version is a rewrite rather than an evolution, adopt a different library instead."
        target_description: "An alternative library supporting the target framework"
        consumer_impact: medium
        effort: high
        impact:
        - {id: call-sites, from: seed, select: self, action: rewrite, reason: Call sites move to the replacement package's API}
        - {id: reference, from: seed, traverse: project_file, action: update, reason: The PackageReference names the replacement package}
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
  - id: package-provided-by-framework
    name: "Package the target framework already provides"
    scope: occurrence
    category: dependencies
    description: >-
      A direct NuGet package that the target framework's shared framework
      already provides at a version it carries (the SDK's PackageOverrides.txt):
      Microsoft.NETCore.App's for every project, Microsoft.AspNetCore.App's for
      a Web or Razor SDK project or one with a FrameworkReference to it.
      Microsoft.AspNetCore.Server.Kestrel 2.x in a net10.0 web project is the
      usual case. A removal, not an upgrade: upgrading would pin an old copy
      the framework supersedes anyway. One occurrence per project per package,
      at the PackageReference line; the value reads
      "{id} {from}: provided by {shared framework} {target}".
    detection:
      match:
        all:
          - id: provided-by-framework
            signal:
              name: PACKAGE_PROVIDED_BY_FRAMEWORK
      occurrence_source:
        signal: PACKAGE_PROVIDED_BY_FRAMEWORK
        group_by: source_path_and_value
    resolutions:
      - id: remove-framework-provided-package
        name: "Remove the package reference"
        description: "Remove the PackageReference, and its central version where nothing else uses it; the shared framework supplies the assemblies."
        target_description: "No PackageReference; the shared framework's version"
        consumer_impact: none
        effort: low
        is_default: true
        impact:
        - {id: reference, from: seed, traverse: project_file, action: update, reason: The PackageReference is removed from the project file}
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The central version is removed where it is declared, when no other project uses it"}
      - id: keep-framework-provided-package
        name: "Keep the package reference"
        description: "Keep the reference, at a version no lower than the framework's, where a tool or analyzer needs the package itself."
        target_description: "The PackageReference, at or above the framework's version"
        consumer_impact: none
        effort: low

  - id: package-replacement-required
    name: "Package needs replacing"
    scope: occurrence
    category: dependencies
    description: >-
      A direct NuGet package has no version supporting the target framework,
      or its publisher has retired it: deprecated as Legacy, or with no newer
      version free of deprecation. A deprecated version of a maintained package
      is not this item: upgrading resolves it. Either way it is a replacement, not
      an upgrade, and which replacement to adopt is a client decision. The
      default is the publisher's suggested replacement, carried in the
      PACKAGE_DEPRECATED value where the publisher names one; where none is
      named, and for a package with no compatible version, the decision must
      choose another option. One occurrence per project per package, at the
      PackageReference line; a package with both conditions is one occurrence.
    detection:
      match:
        any:
          - id: no-compatible-version
            signal:
              name: PACKAGE_NO_COMPATIBLE_VERSION
          - id: deprecated
            signal:
              name: PACKAGE_DEPRECATED
              # dependency-assessment 1.3.0: only a retired package. A deprecated version of a maintained package
              # ("version deprecated") is the upgrade package-upgrade-safe or -breaking already carries.
              value:
                contains: ": package deprecated"
      occurrence_source:
        signal: PACKAGE_NO_COMPATIBLE_VERSION
        also:
          - PACKAGE_DEPRECATED
        group_by: source_path_and_value
    resolutions:
      - id: package-replacement-publisher-suggested
        name: "Adopt the publisher's suggested replacement"
        description: "Move to the replacement package the publisher names in the deprecation. Not available where none is named."
        target_description: "The publisher's suggested replacement package"
        consumer_impact: low
        effort: medium
        is_default: true
        impact:
        - {id: reference, from: seed, traverse: project_file, action: update, reason: The PackageReference names the replacement package}
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
      - id: package-replacement-alternative
        name: "Adopt an alternative library"
        description: "Choose a different maintained library that supports the target framework."
        target_description: "A maintained alternative supporting the target framework"
        consumer_impact: medium
        effort: high
        impact:
        - {id: reference, from: seed, traverse: project_file, action: update, reason: The PackageReference names the replacement package}
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
      - id: package-replacement-framework-builtin
        name: "Remove it: use the framework's own equivalent"
        description: "Drop the package where the target framework provides the capability itself: OWIN middleware, the compiler packages, System.Web shims."
        target_description: "Built-in .NET capability, no package"
        consumer_impact: low
        effort: medium
        impact:
        - {id: reference, from: seed, traverse: project_file, action: update, reason: The PackageReference is removed}
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version declaration is removed where it is declared: Directory.Packages.props under central package management"}
      - id: package-replacement-remain-windows-hosted
        name: "Remain on .NET Framework"
        description: "Keep the package; the application stays on .NET Framework on Windows."
        target_description: ".NET Framework on Windows Server"
        consumer_impact: none
        effort: low
        linux_compatible: false
        container_ready: false

  - id: package-vulnerable
    name: "Package with a known vulnerability"
    scope: occurrence
    category: security
    description: >-
      A direct NuGet package's current version has a published vulnerability
      advisory. A flag, independent of the upgrade outcome: a vulnerable
      package may also be safe or breaking to upgrade, or have no compatible
      version. The value carries the highest severity. One occurrence per
      project per package, at the PackageReference line.
    detection:
      match:
        all:
          - id: vulnerable
            signal:
              name: PACKAGE_VULNERABLE
      occurrence_source:
        signal: PACKAGE_VULNERABLE
        group_by: source_path_and_value
    resolutions:
      - id: package-vulnerable-upgrade
        name: "Upgrade to a version without the advisory"
        description: "Take the recommended version where step 6 reports that it resolves the advisories; otherwise the lowest patched version."
        target_description: "A package version with no open advisory"
        consumer_impact: low
        effort: low
        is_default: true
        impact:
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
      - id: package-vulnerable-replace
        name: "Replace the package"
        description: "Where no patched version exists or the package is unmaintained, move to an alternative."
        target_description: "A maintained alternative without the advisory"
        consumer_impact: medium
        effort: high
        impact:
        - {id: reference, from: seed, traverse: project_file, action: update, reason: The PackageReference names the replacement package}
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
      - id: package-vulnerable-accept-risk
        name: "Accept the risk with a mitigation"
        description: "Keep the version with a documented mitigation, where the vulnerable code path is not reachable."
        target_description: "Unchanged package, risk accepted"
        consumer_impact: none
        effort: low
        notes: "Needs the client's security sign-off, recorded in the decision rationale."

  - id: package-not-approved
    name: "Package version not in the client feed"
    scope: occurrence
    category: dependencies
    description: >-
      The newest compatible version of a direct package on nuget.org is newer
      than anything the client's own feed (Artifactory, Azure Artifacts)
      holds, so the upgrade needs that version approved into the client feed
      first. The client feed is the authority; nuget.org is consulted for
      comparison only. Raised only when client feeds are declared. The value
      carries both versions. One occurrence per project per package.
    detection:
      match:
        all:
          - id: not-in-client-feed
            signal:
              name: PACKAGE_NOT_IN_CLIENT_FEED
      occurrence_source:
        signal: PACKAGE_NOT_IN_CLIENT_FEED
        group_by: source_path_and_value
    resolutions:
      - id: package-not-approved-request-approval
        name: "Request approval into the client feed"
        description: "Raise the newer version through the client's package-approval process, then upgrade."
        target_description: "The public version, mirrored into the client feed"
        consumer_impact: none
        effort: low
        is_default: true
        impact:
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
      - id: package-not-approved-latest-approved
        name: "Stay on the latest approved version"
        description: "Upgrade only as far as the client feed allows."
        target_description: "The newest version the client feed holds"
        consumer_impact: none
        effort: low
        impact:
        - {id: version, from: seed, traverse: version_declaration, action: update, reason: "The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names"}
