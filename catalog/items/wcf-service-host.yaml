category: hosting
deleted: false
description: |-
  The project is the process a WCF service runs in: it constructs a ServiceHost (or CoreWCF host) or holds the service's .svc file. Not a batch job and not the service's implementation — that is wcf-service, usually on another project. The host follows the service's decision where it settles the question: CoreWCF, REST and gRPC all run in ASP.NET Core, so each derives "ASP.NET Core web host"; a service that remains Windows-hosted leaves the host to be decided on its own.
  Conversion ordering (docs/28 Part E): the ASP.NET Core web host's configuration migration runs FIRST: each environment's values move from the Web Deploy SetParam files into appsettings.{Environment}.json and the SetParam files are deleted. Fixes to those values (hardcoded-windows-path, unqualified-hostname) then apply where the values now live. Becomes a depends_on entry on theirs.
detection:
  match:
    all: []
    any:
    - id: hosts-wcf-service
      signal:
        name: HOSTS_WCF_SERVICE
    atLeast: []
    metadata: []
    none: []
excluded_roles:
- TEST
id: wcf-service-host
name: WCF service host
owner_team: null
resolutions:
- consumer_impact: low
  container_ready: true
  deleted: false
  derivations: []
  description: Replace the ServiceHost or IIS hosting with an ASP.NET Core application on .NET 10 (Kestrel) that hosts the service's new endpoints — CoreWCF, REST or gRPC.
  effort: medium
  id: wcf-host-aspnetcore-web-host
  impact_rules:
  - action: rewrite
    filter:
      extension: .cs
    from: seed
    id: host
    reason: A self-hosted ServiceHost process becomes an ASP.NET Core host (Program.cs with Kestrel)
    select: self
  - action: delete
    filter:
      extension: .svc
    from: seed
    id: svc-activation
    reason: 'IIS .svc activation is obsolete: the ASP.NET Core host registers the service'
    select: self
  - action: create
    create: ASP.NET Core host entry point (Kestrel) replacing IIS .svc activation
    for_each: svc-activation
    id: host-entry-point
    proposed_path: '{project.dir}/Program.cs'
  - action: update
    from: seed
    id: project
    reason: Becomes an SDK-style Microsoft.NET.Sdk.Web project on .NET 10
    traverse: project_file
  - action: update
    from: seed
    id: host-config
    path: system.serviceModel
    reason: system.serviceModel hosting configuration moves into the ASP.NET Core host
    traverse: config_elements
  - action: delete
    from: seed
    id: app-config
    pattern: App.config
    reason: 'ASP.NET Core does not read App.config: its settings move to appsettings.json'
    traverse: project_files
  - action: delete
    from: seed
    id: web-deploy-parameters
    pattern: Parameters.xml
    reason: Web Deploy parameters are replaced by appsettings.{Environment}.json
    traverse: project_files
  - action: delete
    from: seed
    id: deploy-parameters
    reason: Web Deploy SetParam files are replaced by appsettings.{Environment}.json, which ASPNETCORE_ENVIRONMENT selects
    traverse: deploy_parameter_files
  - action: create
    create: 'Per-environment settings: the values the SetParam file held'
    for_each: deploy-parameters
    id: environment-settings
    proposed_path: '{project.dir}/appsettings.{node.environment}.json'
  - action: create
    create: 'ASP.NET Core configuration: Kestrel endpoints and the settings App.config held'
    for_each: project
    id: appsettings
    proposed_path: '{project.dir}/appsettings.json'
  - action: create
    create: Local launch profile (ASPNETCORE_ENVIRONMENT)
    for_each: project
    id: launch-settings
    proposed_path: '{project.dir}/Properties/launchSettings.json'
  is_default: true
  linux_compatible: true
  name: ASP.NET Core web host
  notes: null
  status: active
  target_description: .NET 10 ASP.NET Core web host, container on OCP4
- consumer_impact: none
  container_ready: false
  deleted: false
  derivations: []
  description: Out of scope for the Linux move; the host stays on Windows.
  effort: low
  id: wcf-host-remain-windows-hosted
  impact_rules:
  - action: review
    from: seed
    id: evidence
    reason: 'Stays on Windows: nothing structural changes. Listed so the work item stays visible, not to imply edits'
    select: self
  is_default: false
  linux_compatible: false
  name: Remain Windows-hosted
  notes: null
  status: active
  target_description: .NET Framework on Windows Server
- consumer_impact: low
  container_ready: true
  deleted: false
  derivations: []
  description: The re-platformed services each get their own ASP.NET Core project; this host is removed.
  effort: low
  id: wcf-host-retire
  is_default: false
  linux_compatible: true
  name: Retire the host
  notes: null
  status: active
  target_description: No separate host process
scope: application
status: active
