category: dependencies
deleted: false
description: |-
  A direct NuGet package's recommended version removes or changes public members the code calls. One occurrence per affected file; the value names the package, both versions and the changed member, and the evidence carries each call site. Call sites are matched by syntax, so a site is likely rather than certain, and a call that an unchanged overload could equally take is "possible" (ambiguous), not confirmed. Only runtime packages, with lib/ or ref/ assemblies, can be breaking. Where no API diff was possible and the change is a major version, semver presumes a break and the occurrence sits at the PackageReference line, call sites not determined.
  Conversion ordering (docs/28 Part E): for the same package, runs as ONE UNIT with package-upgrade-safe. Bump the version everywhere, then fix the call sites. Fixing call sites first writes against an API the project does not reference yet; bumping alone leaves the build broken in between.
detection:
  match:
    all:
    - id: upgrade-breaking
      signal:
        name: PACKAGE_UPGRADE_BREAKING
    any: []
    atLeast: []
    metadata: []
    none: []
  occurrence_source:
    group_by: source_path
    signal: PACKAGE_UPGRADE_BREAKING
engine_guidance: |-
  The recommended version of a NuGet package removes or changes public members this code calls.
  Bumping the version alone breaks the build: the calling code has to change in the same change.
excluded_roles: []
id: package-upgrade-breaking
name: Package upgrade that breaks calling code
owner_team: null
resolutions:
- consumer_impact: low
  container_ready: true
  deleted: false
  derivations: []
  description: Bump to the recommended version, then change each listed call site to the new API, in the same change.
  effort: medium
  engine_guidance: |-
    1. Change the package's version to the recommended version where it is declared (the project
       file, Directory.Packages.props, or the property it names), in every project that references
       the package, together with any no-code-change upgrade of the same package.
    2. Change each listed call site to the new version's API, keeping the behaviour the same.
    3. Build and run the tests.
  id: package-upgrade-breaking-bump-and-adapt
  impact_rules:
  - action: update
    from: seed
    id: call-sites
    reason: Call sites of the changed members are adapted to the new version
    select: self
  - action: update
    from: seed
    id: version
    reason: 'The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names'
    traverse: version_declaration
  is_default: true
  linux_compatible: true
  name: Bump and adapt the call sites
  notes: null
  status: active
  target_description: The recommended package version, calling code adapted
- consumer_impact: medium
  container_ready: true
  deleted: false
  derivations: []
  description: Where the new major version is a rewrite rather than an evolution, adopt a different library instead.
  effort: high
  engine_guidance: |-
    Replace the package with a different library that supports the target framework, and change the
    call sites to its API.
  id: package-upgrade-breaking-replace
  impact_rules:
  - action: rewrite
    from: seed
    id: call-sites
    reason: Call sites move to the replacement package's API
    select: self
  - action: update
    from: seed
    id: reference
    reason: The PackageReference names the replacement package
    traverse: project_file
  - action: update
    from: seed
    id: version
    reason: 'The version is edited where it is declared: the project file, Directory.Packages.props, or the property it names'
    traverse: version_declaration
  is_default: false
  linux_compatible: true
  name: Replace the package
  notes: null
  status: active
  target_description: An alternative library supporting the target framework
scope: occurrence
status: active
