category: dependencies
deleted: false
description: 'System.Drawing.Common is Windows-only from .NET 6 (the Unix support switch was removed in .NET 7). On .NET Framework the same types come from the in-box System.Drawing assembly, so there may be no package at all; detection keys on the Windows-only GDI+ types used in code, or the package. Deliberately not on SYSTEM_DRAWING_NAMESPACE: that namespace also holds the cross-platform Color, Point and Size types, so it flags files that are fine on Linux. One occurrence per file using a GDI+ type. A project with only the package and no usage matches but has no located occurrence: the fix there is removing a dead reference.'
detection:
  match:
    all: []
    any:
    - id: gdi-type-usage
      signal:
        name: SYSTEM_DRAWING_USAGE
    - id: system-drawing-common-package
      signal:
        name: SYSTEM_DRAWING_COMMON_PACKAGE
    atLeast: []
    metadata: []
    none: []
  occurrence_source:
    group_by: source_path
    signal: SYSTEM_DRAWING_USAGE
excluded_roles: []
id: system-drawing-common
name: System.Drawing, unsupported on Linux
owner_team: null
