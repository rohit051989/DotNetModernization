# The first Copilot-enhanced conversion experiment (36-COPILOT-ENHANCED-CONVERSION Part F).
#
# Question: how much does the platform's enhancement — its discovery, generated inputs and adapted
# skills — improve the engine's result? Prepared by `python -m app.experiment.prepare`, verified per run
# by `python -m app.engine.verifier --config experiments/copilot-eshoponweb/experiment.yaml`.
# The lifecycle register does not change until this experiment reports (Part H).

experiment: copilot-eshoponweb
spec: docs/36-COPILOT-ENHANCED-CONVERSION.md Part F
engagement: test-client-a
repository: eshoponweb
baseline_commit: 4da8212
# The T1 proof's measured baseline: 44 of 44 unit tests, result files kept.
baseline_plan: 90bc71e0
engine:
  provider: github-copilot
  scenario: dotnet-version-upgrade
  # One model for every run of both arms. A decision, recorded here before the first run; the runbook stops
  # while it is unset. Name it exactly as the Copilot chat model picker shows it.
  model: null

arms:
  - arm: 1
    name: Engine alone
    runs: 2
    enhancement: false
  - arm: 2
    name: Engine with enhancement
    runs: 2
    enhancement: true
  - arm: 3
    name: Platform codemods
    ref: conversion/90bc71e0
    # Arm 3 covers the version upgrade only, not OpenShift readiness: compared on that dimension alone.
    scope: version upgrade only

# A deliberate one-line break in code the unit tests cover. The verifier applies it to each branch after the
# clean run, rebuilds, and expects at least one test that passed to fail; then restores the file.
canaries:
  - file: src/ApplicationCore/Entities/BasketAggregate/Basket.cs
    find: "i.Quantity == 0"
    replace: "i.Quantity < 0"
    why: "Basket.RemoveEmptyItems keeps empty items (== 0 changed to < 0)"

# When the operator stops a run (the runbook's stop rules).
stop:
  max_elapsed_minutes: 240
  max_attempts_on_one_task: 3
