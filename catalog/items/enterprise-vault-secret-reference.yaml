category: security
deleted: false
description: 'A configuration value that is an Enterprise.Vault reference, vault:<name>: a connection string, a signing key, a client secret, a certificate or its key. At start-up AddEnterpriseVaultSecrets replaces each reference with the contents of the file <name> in the secrets directory: ENTERPRISE_VAULT_SECRETS_DIR, else a Windows default, else /vault/secrets. The file holds a reference, not the secret, so a key holding one is this item and never sensitive-config-key. On OpenShift the directory must be filled at deployment, one file per referenced name. One occurrence per key per file.'
detection:
  match:
    all:
    - id: vault-reference
      signal:
        name: VAULT_SECRET_REFERENCE
    any: []
    atLeast: []
    metadata: []
    none: []
  occurrence_source:
    group_by: source_path_and_value
    signal: VAULT_SECRET_REFERENCE
engine_guidance: |-
  This configuration value is not the secret itself but a reference, `vault:<name>`. At start-up
  `AddEnterpriseVaultSecrets()` (Enterprise.Vault) replaces each reference with the contents of the
  file `<name>` in its secrets directory: the `ENTERPRISE_VAULT_SECRETS_DIR` environment variable,
  else a Windows default, else `/vault/secrets`. On OpenShift that directory must be filled at
  deployment, one file per referenced name, or the application starts with these settings unresolved.
excluded_roles:
- TEST
id: enterprise-vault-secret-reference
name: Secret read from Enterprise Vault
owner_team: null
resolutions:
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: 'Remove each vault: reference and Enterprise.Vault; each value comes from an OpenShift Secret as an environment variable under its configuration key.'
  effort: medium
  engine_guidance: |-
    1. Replace each `vault:` reference with nothing: remove the value from the configuration file and
       keep the code reading the setting under the same key.
    2. Remove the `AddEnterpriseVaultSecrets()` call and the Enterprise.Vault package once no reference
       is left.
    3. Each value is supplied at deployment from an OpenShift Secret as an environment variable named
       after its key, with `:` written as `__`; the names are listed below. Never write a secret value
       anywhere.
  id: environment-secrets
  is_default: false
  linux_compatible: true
  name: Replace the references with Secret environment variables
  notes: null
  status: active
  target_description: Kubernetes Secret -> environment variable -> IConfiguration
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: 'Keep the vault: references and Enterprise.Vault. An OpenShift Secret (synced from Vault by the External Secrets operator, or created by the platform team) holds one key per referenced name and is mounted as the secrets directory.'
  effort: low
  engine_guidance: |-
    1. Keep every `vault:` reference and the `AddEnterpriseVaultSecrets()` call as they are.
    2. In the deployment manifest, mount the OpenShift Secret named below as a volume at
       `/vault/secrets`, so each referenced name is a file there, and set
       `ENTERPRISE_VAULT_SECRETS_DIR=/vault/secrets` in the container.
    3. Never write a secret value anywhere.
  id: openshift-secret-files
  is_default: false
  linux_compatible: true
  name: OpenShift Secret mounted as the secrets directory
  notes: null
  status: active
  target_description: Secret volume at /vault/secrets; ENTERPRISE_VAULT_SECRETS_DIR=/vault/secrets
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: 'Keep the vault: references and Enterprise.Vault. The Vault Agent injector writes each referenced secret as a file named after it into /vault/secrets, and ENTERPRISE_VAULT_SECRETS_DIR points there.'
  effort: low
  engine_guidance: |-
    1. Keep every `vault:` reference and the `AddEnterpriseVaultSecrets()` call as they are.
    2. In the deployment manifest, have the Vault Agent injector write each referenced secret as a
       file named after it (the text after `vault:`) into `/vault/secrets`: the
       `vault.hashicorp.com/agent-inject` annotations, with one `agent-inject-secret-<name>` per
       reference, using the Vault role and secret path from the deployment parameters named below.
    3. Set `ENTERPRISE_VAULT_SECRETS_DIR=/vault/secrets` in the container.
    4. Never write a secret value anywhere.
  id: vault-agent-files
  is_default: true
  linux_compatible: true
  name: Vault Agent writes the secrets as files
  notes: null
  status: active
  target_description: Vault Agent injector annotations on the Deployment; ENTERPRISE_VAULT_SECRETS_DIR=/vault/secrets
scope: occurrence
status: active
