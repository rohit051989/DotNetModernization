          signal:
            name: SERVICES_FOLDER
          weight: 15
      none:
        - id: no-main-entry
          signal:
            name: MAIN_METHOD_ENTRY_POINT
          disqualify: true
        - id: no-toplevel-entry
          signal:
            name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
          disqualify: true
