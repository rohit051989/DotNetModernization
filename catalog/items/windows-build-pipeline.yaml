category: packaging
deleted: false
description: Windows batch scripts (.bat, .cmd), CI workflows that run on Windows agents or call Windows workflows, and Jenkinsfiles with Windows agent labels or bat / powershell steps. They build on Windows what is to run in a Linux container, and an OpenShift build pipeline runs on Linux. A repository-level file counts for every deployable project.
detection:
  match:
    all:
    - id: windows-build
      signal:
        name: WINDOWS_BUILD_PIPELINE
    any: []
    atLeast: []
    metadata: []
    none: []
engine_guidance: |-
  The repository's build and pipeline files assume Windows: batch scripts (`.bat`, `.cmd`), CI
  workflows that run on Windows agents or call Windows workflows, or Jenkinsfiles with a Windows agent
  label or `bat` / `powershell` steps. The application is to run in a Linux container, built by a
  pipeline that runs on Linux.
excluded_roles:
- DATABASE
- LIBRARY
- TEST
id: windows-build-pipeline
name: Build and pipeline files that assume Windows
owner_team: null
resolutions:
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: 'Keep building on Windows: publish for linux-x64 and build the container image with a Linux builder the pipeline calls.'
  effort: low
  engine_guidance: |-
    Keep the Windows agents and batch scripts. Make the publish step target `linux-x64`, and build the
    container image with a Linux builder the pipeline calls, not on the Windows agent.
  id: keep-windows-build-agents
  is_default: false
  linux_compatible: true
  name: Keep the Windows agents
  notes: null
  status: active
  target_description: Windows agents publishing linux-x64; image built on a Linux builder
- consumer_impact: none
  container_ready: true
  deleted: false
  derivations: []
  description: 'Add a shell script beside each batch script and Linux jobs beside the Windows ones, and build the container image in the pipeline. The Windows scripts and jobs stay until cutover: only a decision removes them.'
  effort: medium
  engine_guidance: |-
    1. For each batch script the pipeline runs, add a shell script beside it, same folder and name with
       `.sh`, that does the same steps with the .NET CLI. Keep every `.bat` and `.cmd` script and every
       Windows job or step exactly as it is: the existing pipeline runs them until cutover. Never delete,
       rename or empty one.
    2. Every new shell script starts with `#!/bin/sh` (or `#!/usr/bin/env bash`), has LF line endings and
       is executable in git: add the rule `*.sh text eol=lf` to the repository's `.gitattributes` (create
       it at the root if there is none), and run `git add --chmod=+x <script>` for each script.
    3. Add Linux jobs or stages beside the Windows ones in each CI workflow and Jenkinsfile, calling the
       shell scripts, with the same stages, order and outputs. Point only at scripts that exist: a batch
       script listed below, or a shell script you add in the same change.
    4. Build the container image in the Linux job from the repository's existing Dockerfile.
  id: linux-build-pipeline
  is_default: true
  linux_compatible: true
  name: Build on Linux agents
  notes: null
  status: active
  target_description: dotnet CLI on Linux agents; container image built by the pipeline
scope: application
status: active
