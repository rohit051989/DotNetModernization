category: hosting
deleted: false
description: |-
  The project is the process a WCF service runs in: it constructs a ServiceHost (or CoreWCF host) or holds the service's .svc file. Not a batch job and not the service's implementation — that is wcf-service, usually on another project. The host follows the service's decision where it settles the question: CoreWCF, REST and gRPC all run in ASP.NET Core, so each derives "ASP.NET Core web host"; a service that remains Windows-hosted leaves the host to be decided on its own.
  Conversion ordering (docs/28 Part E): the ASP.NET Core web host's configuration migration runs FIRST: each environment's values move from the Web Deploy SetParam files into appsettings.{Environment}.json and the SetParam files are deleted. Fixes to those values (hardcoded-windows-path, unqualified-hostname) then apply where the values now live. Becomes a depends_on entry on theirs.
detection:
  match:
    all: []
    any:
    - id: hosts-wcf-service
      signal:
        name: HOSTS_WCF_SERVICE
    atLeast: []
    metadata: []
    none: []
engine_guidance: |-
  This project is the process a WCF service runs in: it creates a `ServiceHost` (in a console
  application or a Windows service) or holds the service's `.svc` file for IIS. Neither a
  `ServiceHost` process nor IIS exists in a Linux container on the target framework. The service's
  implementation usually lives in another project; this one hosts it, with its endpoints, bindings
  and behaviours configured in web.config or app.config. A classic ASP.NET web project's old-style
  project file has no supported SDK-style form on .NET Framework: it becomes an SDK-style ASP.NET
  Core project in the move itself, as the instruction below says, not in a conversion of its own
  first.
excluded_roles:
- TEST
id: wcf-service-host
name: WCF service host
owner_team: null
resolutions:
- confirm_design: true
  consumer_impact: low
  container_ready: true
  deleted: false
  derivations: []
  description: Replace the ServiceHost or IIS hosting with an ASP.NET Core application on .NET 10 (Kestrel) that hosts the service's new endpoints — CoreWCF, REST or gRPC.
  effort: medium
  engine_guidance: |-
    Replace the host with an ASP.NET Core application on the target framework, served by Kestrel,
    that hosts the service's new endpoints (CoreWCF, REST or gRPC, as the service's own instruction
    says).
    1. Make the project an ASP.NET Core application (`Microsoft.NET.Sdk.Web`) on the target
       framework, with a `Program.cs` that builds a `WebApplication`. The project file becomes
       SDK-style in this same task, not before: `<Project Sdk="Microsoft.NET.Sdk.Web">` with
       `<TargetFramework>` set to the target framework, keeping `RootNamespace`, `AssemblyName` and
       the strong-name key. Move its packages from `packages.config` to `PackageReference` items
       with the same ids and versions, as the instruction for packages.config says. Remove
       `ProjectTypeGuids`, the import of the Web Application targets and the IIS Express settings. A
       classic ASP.NET project has no supported SDK-style form on .NET Framework, so it is never
       converted to the SDK style on its own first.
    2. Move each endpoint's address, binding settings, behaviours and limits from web.config or
       app.config to the new host's configuration (`appsettings.json` and environment variables),
       environment by environment, keeping every value. A value that differs per environment
       becomes a configuration name, never a value in code.
    3. Register the service as its own instruction says, at the same relative addresses.
    4. Listen on port 8080: set `ASPNETCORE_HTTP_PORTS=8080` in the container image, not in code.
    5. Remove the `ServiceHost` code and the `system.serviceModel` configuration once the new host
       serves every endpoint. Keep a `.svc` file's address as a route if callers use it.
    6. Keep the host's logging, now through `ILogger` to standard output.
    7. Build, start the host in a test, and call each endpoint once.
  id: wcf-host-aspnetcore-web-host
  impact_rules:
  - action: rewrite
    filter:
      extension: .cs
    from: seed
    id: host
    reason: A self-hosted ServiceHost process becomes an ASP.NET Core host (Program.cs with Kestrel)
    select: self
  - action: delete
    filter:
      extension: .svc
    from: seed
    id: svc-activation
    reason: 'IIS .svc activation is obsolete: the ASP.NET Core host registers the service'
    select: self
  - action: create
    create: ASP.NET Core host entry point (Kestrel) replacing IIS .svc activation
    for_each: svc-activation
    id: host-entry-point
    proposed_path: '{project.dir}/Program.cs'
  - action: update
    from: seed
    id: project
    reason: Becomes an SDK-style Microsoft.NET.Sdk.Web project on .NET 10
    traverse: project_file
  - action: update
    from: seed
    id: host-config
    path: system.serviceModel
    reason: system.serviceModel hosting configuration moves into the ASP.NET Core host
    traverse: config_elements
  - action: delete
    from: seed
    id: app-config
    pattern: App.config
    reason: 'ASP.NET Core does not read App.config: its settings move to appsettings.json'
    traverse: project_files
  - action: delete
    from: seed
    id: web-deploy-parameters
    pattern: Parameters.xml
    reason: Web Deploy parameters are replaced by appsettings.{Environment}.json
    traverse: project_files
  - action: delete
    from: seed
    id: deploy-parameters
    reason: Web Deploy SetParam files are replaced by appsettings.{Environment}.json, which ASPNETCORE_ENVIRONMENT selects
    traverse: deploy_parameter_files
  - action: create
    create: 'Per-environment settings: the values the SetParam file held'
    for_each: deploy-parameters
    id: environment-settings
    proposed_path: '{project.dir}/appsettings.{node.environment}.json'
  - action: create
    create: 'ASP.NET Core configuration: Kestrel endpoints and the settings App.config held'
    for_each: project
    id: appsettings
    proposed_path: '{project.dir}/appsettings.json'
  - action: create
    create: Local launch profile (ASPNETCORE_ENVIRONMENT)
    for_each: project
    id: launch-settings
    proposed_path: '{project.dir}/Properties/launchSettings.json'
  is_default: true
  linux_compatible: true
  name: ASP.NET Core web host
  notes: null
  status: active
  target_description: .NET 10 ASP.NET Core web host, container on OCP4
- consumer_impact: none
  container_ready: false
  deleted: false
  derivations: []
  description: Out of scope for the Linux move; the host stays on Windows.
  effort: low
  engine_guidance: 'Leave this exactly as it is: the host stays on Windows, outside the Linux move. Change nothing this instruction is about: not its code, its project file, its references or its configuration. Record it in the task''s notes as left unchanged, with that reason.'
  id: wcf-host-remain-windows-hosted
  impact_rules:
  - action: review
    from: seed
    id: evidence
    reason: 'Stays on Windows: nothing structural changes. Listed so the work item stays visible, not to imply edits'
    select: self
  is_default: false
  linux_compatible: false
  name: Remain Windows-hosted
  notes: null
  status: active
  target_description: .NET Framework on Windows Server
- consumer_impact: low
  container_ready: true
  deleted: false
  derivations: []
  description: The re-platformed services each get their own ASP.NET Core project; this host is removed.
  effort: low
  engine_guidance: |-
    Remove this host: each service it hosted gets an ASP.NET Core host of its own in this
    conversion.
    1. Check that every service this project hosts has its own new host in this conversion. If one
       does not, leave this host as it is and record why in the task's notes.
    2. Remove the project, its configuration and every reference to it from the solution and the
       repository.
    3. Move nothing of its configuration into another project unless a service's new host needs it,
       as that host's instruction says.
    4. Build the solution and run its tests.
  id: wcf-host-retire
  is_default: false
  linux_compatible: true
  name: Retire the host
  notes: null
  status: active
  target_description: No separate host process
scope: application
status: active
