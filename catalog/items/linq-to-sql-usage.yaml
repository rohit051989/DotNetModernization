category: data-access
deleted: false
description: |-
  Code using LINQ to SQL: System.Data.Linq, a DataContext subclass,
  Table<T>, or a .dbml mapping file. LINQ to SQL exists only on .NET
  Framework: no target framework or .NET Standard implementation, and no
  package provides one. One occurrence per file (the .dbml files and the
  project's assembly reference included).
detection:
  match:
    all: []
    any:
    - id: linq-namespace
      signal:
        name: SYSTEM_DATA_LINQ_NAMESPACE
    - id: linq-assembly
      signal:
        name: SYSTEM_DATA_LINQ_ASSEMBLY
    - id: datacontext-subclass
      signal:
        name: DATACONTEXT_BASE_CLASS
    - id: dbml-file
      signal:
        name: DBML_FILE
    atLeast: []
    metadata: []
    none: []
  occurrence_source:
    also:
    - DATACONTEXT_BASE_CLASS
    - DBML_FILE
    - SYSTEM_DATA_LINQ_ASSEMBLY
    group_by: source_path
    signal: SYSTEM_DATA_LINQ_NAMESPACE
engine_guidance: |-
  This code uses LINQ to SQL (`System.Data.Linq`): a `DataContext` subclass, `Table<T>`, queries against
  them, and the `.dbml` files that map classes to tables. LINQ to SQL exists only on .NET Framework: there
  is no implementation for the target framework or for .NET Standard 2.0, and no package provides one. The
  project builds neither for the target framework nor for `netstandard2.0` until nothing uses it.
excluded_roles:
- TEST
id: linq-to-sql-usage
name: LINQ to SQL (System.Data.Linq)
owner_team: null
