  - id: role-application-project
    name: "Application project"
    summary: "A project with its own entry point — runs as a standalone application, not merely consumed."
    description: |
      Identified by the presence of any registered entry-point signal.
      Part D's alternative basis, "outputType Exe/WinExe, or a web SDK",
      isn't included: step 2's raw-only parser leaves output_type null
      whenever a project relies on an SDK-implied default or a centralized
      Directory.Build.props (common even in modern, well-structured repos —
      confirmed against the eShopOnWeb sample, where every SDK-style project
      has a null output_type), and no step 2/3 field captures the actual SDK
      string at all. Entry-point signals cover the real cases directly.
    legacy_stack: "Any"
    category: library
    typical_indicators: "Main method, top-level statements, a host-builder call, ServiceBase.Run, or Global.asax."
    known_risks: "None — this is a classification input, not a migration target."
    classification_role: PROJECT_ROLE
    classification_family: PROJECT_ROLE
    classification_value: APPLICATION
    priority: 60
    compatible_with: []
    conflicts_with: []
    anchor_signals: ["MAIN_METHOD_ENTRY_POINT", "TOP_LEVEL_STATEMENTS_ENTRY_POINT", "WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT"]
    eligibility: null
    analysis_requirements:
      required:
        syntaxAnalysis: true
      preferred: {}
    thresholds:
      minimumScore: 50
      highConfidenceScore: 70
    rules_status: active
    required_signals_pending: []
    rules:
      schema: signal-rules/1.0
      all: []
      any:
        - id: main-entry
          signal:
            name: MAIN_METHOD_ENTRY_POINT
        - id: toplevel-entry
          signal:
            name: TOP_LEVEL_STATEMENTS_ENTRY_POINT
        - id: web-builder
          signal:
            name: WEB_APPLICATION_CREATE_BUILDER_ENTRY_POINT
        - id: host-builder
          signal:
            name: HOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
        - id: webhost-builder
          signal:
            name: WEBHOST_CREATE_DEFAULT_BUILDER_ENTRY_POINT
        - id: global-asax-entry
          signal:
            name: GLOBAL_ASAX_ENTRY_POINT
        - id: startup-class-entry
          signal:
            name: STARTUP_CLASS_ENTRY_POINT
        - id: servicebase-run-entry
          signal:
            name: SERVICEBASE_RUN_ENTRY_POINT
        - id: hosted-service-entry
          signal:
            name: ADD_HOSTED_SERVICE_ENTRY_POINT
        # IIS-hosted web applications have no code entry point of their own —
        # IIS is the host, and the project is legitimately OutputType
        # Library. Without these they fall through to role-library-project,
        # which then contradicts the application pattern that matched them.
        # eShopWCFService was the observed case: role LIBRARY while
